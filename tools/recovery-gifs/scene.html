<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:white}canvas{display:block}</style>
<script type="module">
import * as T from './vendor/three.module.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(540,540);renderer.setClearColor(0xffffff);renderer.shadowMap.enabled=true;
document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.OrthographicCamera(-1.05,1.05,1.05,-1.05,.01,50);
scene.add(new T.HemisphereLight(0xffffff,0x9b9b9b,2.0));
const light=new T.DirectionalLight(0xffffff,3);light.position.set(-3,5,5);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
const skin=new T.MeshStandardMaterial({color:0xb8b8b8,roughness:.7}),shorts=new T.MeshStandardMaterial({color:0x242424,roughness:.9});
const accent=new T.MeshStandardMaterial({color:0xa96b68,roughness:.8}),wallMat=new T.MeshStandardMaterial({color:0xd8d8d8,roughness:1});
const floor=new T.Mesh(new T.PlaneGeometry(20,20),new T.ShadowMaterial({opacity:.09}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;floor.receiveShadow=true;scene.add(floor);
let figure=new T.Group();scene.add(figure);
const v=a=>new T.Vector3(...a),add=(a,b)=>a.map((x,i)=>x+b[i]);
function ellipsoid(position,scale,material=skin,parent=figure){const m=new T.Mesh(new T.SphereGeometry(1,24,16),material);m.position.copy(v(position));m.scale.set(...scale);m.castShadow=true;parent.add(m);return m;}
function link(a,b,r1,r2=r1,material=skin){
  const A=v(a),B=v(b),delta=B.clone().sub(A);const m=new T.Mesh(new T.CylinderGeometry(r2,r1,delta.length(),20,1),material);
  m.position.copy(A.clone().add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());m.castShadow=true;figure.add(m);
  ellipsoid(a,[r1,r1,r1],material);ellipsoid(b,[r2,r2,r2],material);
}
function ik(a,b,l1,l2,bend){
  const A=v(a),B=v(b),D=B.clone().sub(A);const length=D.length();const u=D.normalize();const d=Math.min(length,l1+l2-.001);
  const x=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-x*x));
  const n=v(bend).addScaledVector(u,-v(bend).dot(u)).normalize();
  return A.addScaledVector(u,x).addScaledVector(n,h).toArray();
}
function hand(wrist,direction){
  const g=new T.Group();g.position.copy(v(wrist));g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v(direction).normalize());figure.add(g);
  ellipsoid([0,.036,0],[.045,.055,.019],skin,g);
  for(let i=0;i<4;i++)ellipsoid([(i-1.5)*.018,.099-Math.abs(i-1.5)*.008,0],[.008,.033,.009],skin,g);
  ellipsoid([.047,.025,.003],[.012,.032,.012],skin,g);
}
function arm(shoulder,elbow,wrist,red=false){
  link(shoulder,elbow,.070,.045);link(elbow,wrist,.045,.028);
  const d=v(wrist).sub(v(elbow)).normalize().toArray();hand(wrist,d);
  if(red)ellipsoid(shoulder,[.073,.073,.073],accent);
}
function foot(ankle){ellipsoid(add(ankle,[0,-.018,.075]),[.055,.035,.12]);}
function torso(hip,shoulderCenter,rotation=0,fixedHips=false,highlightSide=0){
  const g=new T.Group();g.position.copy(v(hip));g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v(shoulderCenter).sub(v(hip)).normalize());
  g.rotateY(rotation);figure.add(g);const length=v(shoulderCenter).distanceTo(v(hip));
  ellipsoid([0,length*.46,0],[.18,length*.51,.115],skin,g);
  ellipsoid([0,length*.75,.012],[.235,length*.27,.135],skin,g);
  for(const side of [-1,1]){
    ellipsoid([side*.095,length*.73,.115],[.095,.080,.032],side===highlightSide?accent:skin,g);
    for(let i=0;i<3;i++)ellipsoid([side*.035,length*(.30+i*.10),.104],[.034,.024,.015],skin,g);
  }
  let pelvis=g;
  if(fixedHips){pelvis=new T.Group();pelvis.position.copy(v(hip));pelvis.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v(shoulderCenter).sub(v(hip)).normalize());figure.add(pelvis);}
  for(const side of [-1,1])ellipsoid([side*.095,0,0],[.12,.13,.12],shorts,pelvis);
  return g;
}
function head(center,direction=[0,1,0],rotation=0){
  const g=new T.Group();g.position.copy(v(center));g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v(direction).normalize());g.rotateY(rotation);figure.add(g);
  ellipsoid([0,-.10,0],[.045,.075,.048],skin,g);ellipsoid([0,.015,0],[.095,.13,.095],skin,g);
  ellipsoid([0,-.007,.095],[.020,.034,.027],skin,g);for(const s of [-1,1])ellipsoid([s*.096,.007,0],[.018,.035,.020],skin,g);
}
function standing(phase,breathing=false){
  const wave=Math.sin(phase*2*Math.PI),bob=breathing?0:Math.cos(phase*4*Math.PI)*.008;
  const hip=[0,.97+bob,0],shoulders=[0,1.56+bob+(breathing?wave*.004:0),0];
  const body=torso(hip,shoulders);if(breathing)body.scale.z=1+wave*.045;
  head([0,1.80+bob,0]);
  for(const s of [-1,1]){
    const swing=breathing?0:wave*s;
    const h=add(hip,[s*.115,0,0]),ankle=[s*.115,.065+Math.max(0,swing)*.085,swing*.25];
    const knee=ik(h,ankle,.45,.44,[0,0,1]);link(h,knee,.091,.059);link(knee,ankle,.062,.033);foot(ankle);
    const shoulder=add(shoulders,[s*.235,-.025,0]),wrist=[s*.27,1.03+bob,-swing*.24+.05];
    arm(shoulder,ik(shoulder,wrist,.29,.28,[0,0,1]),wrist);
  }
  camera.position.set(3,2.4,5);camera.lookAt(0,.99,0);
}
function openBook(phase){
  const u=(1-Math.cos(phase*2*Math.PI))/2,phi=u*Math.PI;
  const hip=[.05,.20,0],center=[-.49,.22,0];
  torso(hip,center,u*Math.PI/2,true);
  head([-.74,.24,0],[-1,0,0],u*Math.PI/2);
  // Stacked knees stay planted while only the chest and upper arm open.
  for(const y of [.10,.25]){const h=[.05,y,0],k=[.25,y,.31],a=[.63,y,.29];link(h,k,.080,.055);link(k,a,.052,.030);ellipsoid([.69,y,.29],[.09,.032,.045]);}
  const lower=[-.49,.22-.18*Math.cos(phi/2),.18*Math.sin(phi/2)],lowerWrist=[-.49,.08,.53];arm(lower,ik(lower,lowerWrist,.32,.30,[1,0,0]),lowerWrist);
  const upper=[-.49,.22+.18*Math.cos(phi/2),-.18*Math.sin(phi/2)];
  const wrist=[-.49,.08+.52*Math.sin(phi),.50*Math.cos(phi)];
  arm(upper,ik(upper,wrist,.32,.30,[1,0,0]),wrist);
  camera.position.set(1.1,2.2,3.2);camera.lookAt(-.08,.19,0);
}
function doorway(phase){
  const t=(1-Math.cos(phase*2*Math.PI))/2,rotate=-t*.20;
  const hip=[0,.98,.03*t],center=[0,1.56,.05*t];torso(hip,center,rotate,false,1);head([0,1.80,.05*t],[0,1,0],rotate);
  for(const s of [-1,1]){const h=add(hip,[s*.115,0,0]),ankle=[s*.13,.065,s===1?.13:-.12],k=ik(h,ankle,.45,.44,[0,0,1]);link(h,k,.09,.055);link(k,ankle,.055,.032);foot(ankle);}
  const shoulder=[.235*Math.cos(rotate),1.53,.05*t-.235*Math.sin(rotate)],wrist=[.54,1.82,.03];
  arm(shoulder,ik(shoulder,wrist,.31,.30,[1,0,0]),wrist,true);
  arm([-.235,1.53,.05*t],[-.255,1.23,.02],[-.265,.97,.035]);
  const post=new T.Mesh(new T.BoxGeometry(.075,2.12,.14),wallMat);post.position.set(.63,1.06,.03);figure.add(post);
  const top=new T.Mesh(new T.BoxGeometry(.70,.075,.14),wallMat);top.position.set(.94,2.10,.03);figure.add(top);
  camera.position.set(3,2.4,5);camera.lookAt(.15,1.02,0);
}
window.renderFrame=(name,phase)=>{
  scene.remove(figure);figure.traverse(o=>{o.geometry?.dispose();});figure=new T.Group();scene.add(figure);
  if(name==='open-book')openBook(phase);else if(name==='doorway')doorway(phase);else standing(phase,name==='breathing');
  renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');
};window.ready=true;
</script></html>

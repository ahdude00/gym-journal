<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A1F">
<title>Salon Defteri</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141A1F; --panel:#1C242B; --field:#232D36; --line:#2E3A44;
  --text:#E8EEF2; --dim:#8D9BA8; --brass:#E0A32E; --done:#5FBF8B;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --tabbar:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:18px}
p{margin:0 0 10px}
button{font-family:var(--sans);font-size:16px;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:var(--cond);font-size:22px;font-weight:600;color:var(--text);background:var(--field);
  border:1px solid var(--line);border-radius:10px;text-align:center;width:100%;padding:9px 4px;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:12px 14px 26px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 14px 4px;max-width:560px;margin:0 auto}
.topbar .clock{font-family:var(--cond);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--dim)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--brass);color:#141A1F;font-weight:600;font-size:17px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.quiet{background:var(--field);color:var(--text)}
.btn[disabled]{opacity:.45}

.stage{background:#0E141B;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage-cap{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;gap:8px}

.setrow{display:grid;grid-template-columns:56px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.setno{font-family:var(--cond);font-size:17px;color:var(--dim)}
.unit{position:relative}
.unit span{position:absolute;right:7px;bottom:6px;font-size:11px;color:var(--dim);pointer-events:none}
.tick{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:20px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.setrow.done .tick{background:var(--done);border-color:var(--done);color:#12261C}
.setrow.done input{opacity:.55}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--dim)}
.pill.on{background:var(--brass);border-color:var(--brass);color:#141A1F}
.progress{display:flex;gap:4px;margin:6px 0 10px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--brass)}

.rest{position:fixed;inset:0;background:rgba(12,16,20,.97);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px}
.rest .num{font-family:var(--cond);font-weight:700;font-size:106px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--brass)}
.rest .lbl{color:var(--dim);letter-spacing:.05em}
.rest .acts{display:flex;gap:10px;margin-top:22px;width:100%;max-width:340px}

.modal{position:fixed;inset:0;background:rgba(10,14,18,.8);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px}
.modal .sheet .btn{margin-top:10px}

.exitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.exitem:first-child{border-top:none}
.exitem .thumb{width:62px;height:48px;flex:none;background:#0E141B;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.exitem .thumb svg{width:100%;height:100%;display:block}
ol.steps{margin:0;padding-left:20px} ol.steps li{margin-bottom:7px}
ul.warn{margin:0;padding-left:18px;color:var(--dim)} ul.warn li{margin-bottom:6px}

.hist{width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--cond);font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass);line-height:1.1}
.stat span{font-size:12px;color:var(--dim);display:block;line-height:1.25}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;color:var(--dim);font-size:14px;background:var(--panel)}
.seg button.on{background:var(--brass);border-color:var(--brass);color:#141A1F;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin:6px 0 2px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars i{display:block;width:100%;background:var(--brass);border-radius:4px 4px 0 0;min-height:3px}
.bars i.empty{background:var(--line)}
.bars small{color:var(--dim);font-size:11px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:none}
.kv b{font-family:var(--cond);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch button{width:52px;height:30px;border-radius:999px;background:var(--field);border:1px solid var(--line);position:relative;flex:none}
.switch button i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
.switch button.on{background:var(--brass);border-color:var(--brass)}
.switch button.on i{left:26px;background:#141A1F}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#10161B;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px}
nav button.on{color:var(--brass)}
nav button i{font-style:normal;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 16px);z-index:70;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;max-width:88%;text-align:center}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <h1 id="title">Salon Defteri</h1>
  <div class="clock hidden" id="clock">00:00</div>
</header>

<main class="wrap" id="view"></main>

<nav><div>
  <button data-tab="workout" class="on"><i>▣</i>Antrenman</button>
  <button data-tab="guide"><i>◈</i>Hareketler</button>
  <button data-tab="stats"><i>◪</i>İstatistik</button>
  <button data-tab="history"><i>▤</i>Geçmiş</button>
  <button data-tab="data"><i>⇅</i>Veri</button>
</div></nav>

<div id="rest" class="rest hidden">
  <div class="lbl">Dinlenme</div>
  <div class="num" id="restNum">90</div>
  <div class="lbl small" id="restNext"></div>
  <div class="acts">
    <button class="btn quiet" id="restPlus">+15 sn</button>
    <button class="btn" id="restSkip">Devam et</button>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="modalBody"></div></div>

/* ==========================================================
   2. DURUM VE KAYIT
   ========================================================== */
const KEY="salonDefteri.v1";
let state={tab:"workout",sessions:[],active:null,exIndex:0,openEx:null,openHist:null,donem:"hafta",otoDosya:true};
let restTimer=null,restLeft=0,clockTimer=null,animRAF=null,kayitYeri="yok";

function lsGet(k){ try{ return window.localStorage ? localStorage.getItem(k) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ if(window.localStorage){ localStorage.setItem(k,v); return true; } }catch(e){} return false; }

async function loadAll(){
  let ham=null;
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value){ ham=r.value; kayitYeri="uygulama hafızası"; } } }catch(e){}
  if(!ham){ const l=lsGet(KEY); if(l){ ham=l; kayitYeri="telefon tarayıcı hafızası"; } }
  if(ham){ try{ const d=JSON.parse(ham); state.sessions=d.sessions||[]; if(typeof d.otoDosya==="boolean") state.otoDosya=d.otoDosya; }catch(e){} }
  if(kayitYeri==="yok" && lsSet(KEY+".test","1")) kayitYeri="telefon tarayıcı hafızası";
}
async function saveAll(){
  const paket=JSON.stringify({v:1,otoDosya:state.otoDosya,sessions:state.sessions});
  let ok=false;
  try{ if(window.storage){ await window.storage.set(KEY,paket); ok=true; } }catch(e){}
  if(lsSet(KEY,paket)) ok=true;
  return ok;
}

/* ==========================================================
   3. ÇİZİM MOTORU
   ========================================================== */
const JOINTS=["head","neck","hip","sL","eL","hL","sR","eR","hR","kL","fL","kR","fR"];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
function poseAt(ex,t){ const o={}; for(const j of JOINTS) o[j]=lerp(ex.a[j],ex.b[j],t); return o; }
function ln(p,q,w,c,o){ return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${o?` opacity="${o}"`:""}/>`; }
function dot(p,r,c){ return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${c}"/>`; }

function propsSvg(prop){
  const g="#485864"; let s="";
  if(prop.floor) s+=`<line x1="8" y1="82" x2="112" y2="82" stroke="${g}" stroke-width="2"/>`;
  if(prop.bench) s+=`<rect x="30" y="57" width="68" height="5" rx="2.5" fill="${g}"/><line x1="40" y1="62" x2="40" y2="81" stroke="${g}" stroke-width="2.5"/><line x1="90" y1="62" x2="90" y2="81" stroke="${g}" stroke-width="2.5"/><line x1="8" y1="82" x2="112" y2="82" stroke="${g}" stroke-width="2"/>`;
  if(prop.benchLow) s+=`<rect x="24" y="60" width="36" height="5" rx="2.5" fill="${g}"/><line x1="30" y1="65" x2="30" y2="81" stroke="${g}" stroke-width="2.5"/><line x1="54" y1="65" x2="54" y2="81" stroke="${g}" stroke-width="2.5"/><line x1="8" y1="82" x2="112" y2="82" stroke="${g}" stroke-width="2"/>`;
  if(prop.backrest) s+=`<rect x="69" y="22" width="5" height="36" rx="2.5" fill="${g}" transform="rotate(7 71 40)"/><rect x="48" y="56" width="26" height="5" rx="2.5" fill="${g}"/><line x1="8" y1="82" x2="112" y2="82" stroke="${g}" stroke-width="2"/>`;
  if(prop.bar) s+=`<line x1="24" y1="11" x2="96" y2="11" stroke="${g}" stroke-width="4" stroke-linecap="round"/><line x1="28" y1="11" x2="28" y2="4" stroke="${g}" stroke-width="2.5"/><line x1="92" y1="11" x2="92" y2="4" stroke="${g}" stroke-width="2.5"/>`;
  if(prop.hyperPad) s+=`<rect x="43" y="57" width="22" height="7" rx="3.5" fill="${g}"/><line x1="54" y1="64" x2="46" y2="81" stroke="${g}" stroke-width="2.5"/><circle cx="30" cy="70" r="4" fill="${g}"/><circle cx="30" cy="78" r="4" fill="${g}"/><line x1="8" y1="82" x2="112" y2="82" stroke="${g}" stroke-width="2"/>`;
  return s;
}

function govde(p,w,c,op){
  let s="";
  s+=ln(p.sR,p.eR,w*.85,c,op)+ln(p.eR,p.hR,w*.85,c,op);
  s+=ln(p.hip,p.kR,w*.85,c,op)+ln(p.kR,p.fR,w*.85,c,op);
  s+=ln(p.neck,p.hip,w*1.35,c,op);
  s+=ln(p.sL,p.sR,w*.8,c,op);
  s+=ln(p.hip,p.kL,w,c,op)+ln(p.kL,p.fL,w,c,op);
  s+=ln(p.sL,p.eL,w,c,op)+ln(p.eL,p.hL,w,c,op);
  s+=`<circle cx="${p.head[0].toFixed(1)}" cy="${p.head[1].toFixed(1)}" r="7" fill="${c}"${op?` opacity="${op}"`:""}/>`;
  return s;
}

function figureSvg(ex,t,mini){
  const p=poseAt(ex,t), c="#F2F7FA", br="#E0A32E", w=mini?4:5.2;
  let s=`<svg viewBox="6 0 108 88" xmlns="http://www.w3.org/2000/svg">`;
  s+=propsSvg(ex.prop||{});
  if(!mini){
    // hareketin diğer ucu: soluk hayalet figür
    const hayalet=poseAt(ex, t>0.5?0:1);
    s+=govde(hayalet,w*.9,"#5C6B78",".38");
    // hareket yönü: izlenen eklemin yolu
    if(ex.izle){
      const A=ex.a[ex.izle],B=ex.b[ex.izle];
      if(Math.hypot(B[0]-A[0],B[1]-A[1])>6){
        s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${br}" stroke-width="1.6" stroke-dasharray="3 3" opacity=".65"/>`;
        s+=dot(A,2.2,br)+dot(B,2.2,br);
      }
    }
  }
  s+=govde(p,w,c,null);
  if(!mini){ s+=dot(p.eL,3,"#B9C6D0")+dot(p.kL,3,"#B9C6D0"); }
  const pr=ex.prop||{};
  if(pr.dumbbellFront){
    s+=`<rect x="${p.hL[0]-2.6}" y="${p.hL[1]-5.5}" width="5.2" height="11" rx="2" fill="${br}"/>`;
    s+=`<rect x="${p.hR[0]-2.6}" y="${p.hR[1]-5.5}" width="5.2" height="11" rx="2" fill="${br}"/>`;
  }
  if(pr.dumbbellSide) s+=`<rect x="${p.hL[0]-5.5}" y="${p.hL[1]-2.6}" width="11" height="5.2" rx="2" fill="${br}"/>`;
  return s+`</svg>`;
}

// yavaş, uçlarda duraklamalı döngü
function faz(now,start){
  const p=((now-start)%3400)/3400;
  let u;
  if(p<0.38) u=p/0.38;
  else if(p<0.5) u=1;
  else if(p<0.88) u=1-(p-0.5)/0.38;
  else u=0;
  return u*u*(3-2*u);
}
function animate(id,exId){
  const ex=EX[exId], start=performance.now();
  cancelAnimationFrame(animRAF);
  (function frame(now){
    const el=document.getElementById(id);
    if(!el) return;
    const t=faz(now,start);
    el.innerHTML=figureSvg(ex,t,false);
    const cap=document.getElementById(id+"-faz");
    if(cap&&ex.faz) cap.textContent=ex.faz[t>0.5?1:0];
    animRAF=requestAnimationFrame(frame);
  })(start);
}

/* ==========================================================
   4. YARDIMCILAR
   ========================================================== */
const pad=n=>String(n).padStart(2,"0");
const mmss=s=>pad(Math.floor(s/60))+":"+pad(s%60);
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUNLER=["Paz","Pzt","Sal","Çrş","Prş","Cum","Cmt"];
function tarihTR(iso){ const d=new Date(iso); return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`; }
function haftaBasi(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function sonrakiGun(){ return state.sessions.length ? (state.sessions[state.sessions.length-1].gun==="A"?"B":"A") : "A"; }
function sonKayit(exId){
  for(let i=state.sessions.length-1;i>=0;i--){
    const e=(state.sessions[i].kayitlar||[]).find(k=>k.id===exId);
    if(e){ const d=e.setler.filter(s=>s.done); if(d.length) return d[d.length-1]; }
  }
  return null;
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

function modalAc(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); }
function modalKapat(){ document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") modalKapat(); };

/* ==========================================================
   5. EKRANLAR
   ========================================================== */
const view=document.getElementById("view");
function render(){
  cancelAnimationFrame(animRAF);
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
  document.getElementById("clock").classList.toggle("hidden",!state.active);
  ({workout:renderWorkout,guide:renderGuide,stats:renderStats,history:renderHistory,data:renderData}[state.tab])();
}

/* --- ANTRENMAN --- */
function renderWorkout(){
  if(!state.active){
    clearInterval(clockTimer);
    const gun=sonrakiGun(), p=PROGRAM[gun];
    document.getElementById("title").textContent="Salon Defteri";
    view.innerHTML=`
      <div class="card">
        <div class="row between"><h2>${p.ad}</h2><span class="pill on">Sıradaki</span></div>
        <p class="muted small" style="margin-top:6px">${state.sessions.length?"Son antrenman: "+tarihTR(state.sessions[state.sessions.length-1].tarih):"İlk antrenmanın. Kutulardaki değerler başlangıç önerisi — kolay gelirse artır."}</p>
        ${p.hareketler.map(h=>{
          const e=EX[h.id], sk=sonKayit(h.id), o=e.oneri;
          const oner = sk ? ((sk.kg?sk.kg+" kg × ":"")+sk.tekrar+(e.tip==="sure"?" sn":"")) : ((o.kg?o.kg+" kg × ":"")+o.tekrar+(e.tip==="sure"?" sn":""));
          return `<div class="row between" style="padding:8px 0;border-top:1px solid var(--line)">
            <span>${e.ad}</span><span class="muted small">${h.set} set · ${oner}</span></div>`;}).join("")}
        <button class="btn" id="startBtn" style="margin-top:14px">Antrenmanı başlat</button>
        <button class="btn ghost" id="altBtn" style="margin-top:8px">${PROGRAM[gun==="A"?"B":"A"].ad} yap</button>
      </div>`;
    document.getElementById("startBtn").onclick=()=>startSession(gun);
    document.getElementById("altBtn").onclick=()=>startSession(gun==="A"?"B":"A");
    return;
  }

  const s=state.active, h=PROGRAM[s.gun].hareketler[state.exIndex], ex=EX[h.id], kayit=s.kayitlar[state.exIndex];
  const sk=sonKayit(h.id), birim=ex.tip==="sure"?"sn":"tekrar";
  document.getElementById("title").textContent="Gün "+s.gun;
  view.innerHTML=`
    <div class="progress">${PROGRAM[s.gun].hareketler.map((_,i)=>`<i class="${i<=state.exIndex?"on":""}"></i>`).join("")}</div>
    <div class="card">
      <div class="stage">
        <div id="stage"></div>
        <div class="stage-cap"><span>${ex.kas}</span><span id="stage-faz"></span></div>
      </div>
      <div class="row between" style="margin-top:12px"><h2>${ex.ad}</h2><span class="pill">${h.set} × ${h.tekrar}</span></div>
      <p class="muted small" style="margin-top:4px">${ex.ipucu}${sk?" · Geçen sefer: "+(sk.kg?sk.kg+" kg × ":"")+sk.tekrar+" "+birim:" · Kutularda başlangıç önerisi var"}</p>
      <div style="margin-top:12px">
        ${kayit.setler.map((st,i)=>`
          <div class="setrow ${st.done?"done":""}">
            <div class="setno">Set ${i+1}</div>
            <div class="unit">${ex.tip==="kg"
              ? `<input type="number" inputmode="decimal" step="0.5" data-f="kg" data-set="${i}" value="${st.kg??""}"><span>kg</span>`
              : `<div class="tick" style="border-style:dashed;font-size:13px">vücut</div>`}</div>
            <div class="unit"><input type="number" inputmode="numeric" data-f="tekrar" data-set="${i}" value="${st.tekrar??""}"><span>${birim}</span></div>
            <button class="tick" data-done="${i}">${st.done?"✓":"○"}</button>
          </div>`).join("")}
      </div>
      <details style="margin-top:12px"><summary class="muted small">Nasıl yapılır</summary>
        <ol class="steps small" style="margin-top:8px">${ex.adimlar.map(a=>`<li>${a}</li>`).join("")}</ol></details>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn quiet" id="prevEx" ${state.exIndex===0?"disabled":""}>Önceki</button>
      <button class="btn" id="nextEx">${state.exIndex===PROGRAM[s.gun].hareketler.length-1?"Son hareket":"Sonraki"}</button>
    </div>
    <button class="btn ghost" id="finish" style="margin-top:10px">Antrenmanı bitir</button>`;

  animate("stage",h.id);
  view.querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{ kayit.setler[+inp.dataset.set][inp.dataset.f]= inp.value===""?null:+inp.value; };
  });
  view.querySelectorAll("[data-done]").forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.done, st=kayit.setler[i];
      st.done=!st.done;
      const kalan=kayit.setler.filter(x=>!x.done).length;
      renderWorkout();
      if(st.done) startRest(h.mola, kalan>0?`Sonraki: ${ex.ad} · set ${i+2}`:"Bu hareket bitti");
    };
  });
  document.getElementById("prevEx").onclick=()=>{ if(state.exIndex>0){state.exIndex--;renderWorkout();scrollTo(0,0);} };
  document.getElementById("nextEx").onclick=()=>{
    if(state.exIndex<PROGRAM[s.gun].hareketler.length-1){ state.exIndex++; renderWorkout(); scrollTo(0,0); }
    else bitirSor();
  };
  document.getElementById("finish").onclick=bitirSor;
}

function startSession(gun){
  state.active={
    id:"s"+Date.now(), tarih:new Date().toISOString(), gun, baslangic:Date.now(), sure:0,
    kayitlar:PROGRAM[gun].hareketler.map(h=>{
      const e=EX[h.id], sk=sonKayit(h.id);
      const kg = e.tip==="kg" ? (sk&&sk.kg!=null?sk.kg:e.oneri.kg??null) : null;
      const tk = sk&&sk.tekrar!=null ? sk.tekrar : (e.oneri.tekrar??null);
      return { id:h.id, setler:Array.from({length:h.set},()=>({kg,tekrar:tk,done:false})) };
    })
  };
  state.exIndex=0;
  clearInterval(clockTimer);
  clockTimer=setInterval(()=>{
    if(!state.active) return;
    const el=document.getElementById("clock");
    if(el) el.textContent=mmss(Math.floor((Date.now()-state.active.baslangic)/1000));
  },1000);
  document.getElementById("clock").textContent="00:00";
  render();
}

function bitirSor(){
  const s=state.active; if(!s) return;
  const yapilan=s.kayitlar.reduce((a,k)=>a+k.setler.filter(x=>x.done).length,0);
  const sure=mmss(Math.floor((Date.now()-s.baslangic)/1000));
  modalAc(`
    <h2>Antrenmanı bitir</h2>
    <p class="muted small">${yapilan} set işaretledin · ${sure} sürdü.</p>
    ${yapilan?`<button class="btn" id="mSave">Kaydet ve bitir</button>`:`<p class="muted small">Hiç set işaretlemedin, kaydedecek bir şey yok.</p>`}
    <button class="btn quiet" id="mDrop">Kaydetmeden çık</button>
    <button class="btn ghost" id="mBack">Vazgeç, devam et</button>`);
  const sv=document.getElementById("mSave"); if(sv) sv.onclick=()=>{ modalKapat(); kaydetVeBitir(); };
  document.getElementById("mDrop").onclick=()=>{ modalKapat(); state.active=null; clearInterval(clockTimer); state.tab="workout"; render(); toast("Antrenman kaydedilmedi"); };
  document.getElementById("mBack").onclick=modalKapat;
}

async function kaydetVeBitir(){
  const s=state.active;
  s.sure=Math.floor((Date.now()-s.baslangic)/1000);
  s.kayitlar.forEach(k=>{ k.setler=k.setler.filter(x=>x.done); });
  s.kayitlar=s.kayitlar.filter(k=>k.setler.length);
  s.hacim=s.kayitlar.reduce((a,k)=>a+k.setler.reduce((b,x)=>b+((x.kg||0)*(x.tekrar||0)),0),0);
  state.sessions.push(s);
  state.active=null;
  clearInterval(clockTimer);
  const ok=await saveAll();
  if(state.otoDosya) dosyayaAktar(true);
  state.tab="stats";
  render();
  toast(ok?`Kaydedildi · ${mmss(s.sure)}`:"Kaydedildi, ama telefon hafızası kapalı. Veri sekmesinden dosyaya aktar.");
}

/* --- DİNLENME --- */
function startRest(sn,not){
  restLeft=sn;
  document.getElementById("restNum").textContent=restLeft;
  document.getElementById("restNext").textContent=not||"";
  document.getElementById("rest").classList.remove("hidden");
  clearInterval(restTimer);
  restTimer=setInterval(()=>{
    restLeft--;
    document.getElementById("restNum").textContent=Math.max(restLeft,0);
    if(restLeft<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([120,80,120]); }
  },1000);
}
function stopRest(){ clearInterval(restTimer); document.getElementById("rest").classList.add("hidden"); }
document.getElementById("restSkip").onclick=stopRest;
document.getElementById("restPlus").onclick=()=>{ restLeft+=15; document.getElementById("restNum").textContent=restLeft; };

/* --- HAREKET REHBERİ --- */
function renderGuide(){
  document.getElementById("title").textContent="Hareketler";
  if(state.openEx){
    const ex=EX[state.openEx];
    view.innerHTML=`
      <button class="btn ghost" id="back" style="margin-bottom:12px">Listeye dön</button>
      <div class="card">
        <div class="stage"><div id="stage"></div><div class="stage-cap"><span>${ex.kas}</span><span id="stage-faz"></span></div></div>
        <h2 style="margin-top:12px">${ex.ad}</h2>
        <p class="muted small">${ex.ipucu}</p>
        <p class="small" style="margin-top:8px">Başlangıç önerisi: <b>${(ex.oneri.kg?ex.oneri.kg+" kg × ":"")+ex.oneri.tekrar+(ex.tip==="sure"?" saniye":" tekrar")}</b></p>
        <h3 style="margin-top:14px">Nasıl yapılır</h3>
        <ol class="steps">${ex.adimlar.map(a=>`<li>${a}</li>`).join("")}</ol>
        <h3 style="margin-top:14px">Sık yapılan hatalar</h3>
        <ul class="warn small">${ex.hatalar.map(a=>`<li>${a}</li>`).join("")}</ul>
      </div>`;
    animate("stage",state.openEx);
    document.getElementById("back").onclick=()=>{state.openEx=null;render();};
    return;
  }
  const ids=Object.keys(EX);
  view.innerHTML=`<div class="card">${ids.map(id=>`
    <button class="exitem" data-ex="${id}"><span class="thumb" id="th-${id}"></span>
      <span style="flex:1"><span style="display:block">${EX[id].ad}</span><span class="muted small">${EX[id].kas}</span></span>
      <span class="muted">›</span></button>`).join("")}</div>`;
  ids.forEach(id=>{ const el=document.getElementById("th-"+id); if(el) el.innerHTML=figureSvg(EX[id],0.75,true); });
  view.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{state.openEx=b.dataset.ex;render();scrollTo(0,0);});
}

/* --- İSTATİSTİK --- */
function donemFiltre(){
  const now=new Date();
  if(state.donem==="hafta"){ const b=haftaBasi(now); return state.sessions.filter(s=>new Date(s.tarih)>=b); }
  if(state.donem==="ay"){ const b=new Date(now.getFullYear(),now.getMonth(),1); return state.sessions.filter(s=>new Date(s.tarih)>=b); }
  return state.sessions.slice();
}
function renderStats(){
  document.getElementById("title").textContent="İstatistik";
  const ss=donemFiltre();
  const setSay=ss.reduce((a,s)=>a+s.kayitlar.reduce((b,k)=>b+k.setler.length,0),0);
  const sureDk=Math.round(ss.reduce((a,s)=>a+(s.sure||0),0)/60);
  const hacim=Math.round(ss.reduce((a,s)=>a+(s.hacim||0),0));
  const ortDk=ss.length?Math.round(sureDk/ss.length):0;
  const tekrarSay=ss.reduce((a,s)=>a+s.kayitlar.reduce((b,k)=>b+k.setler.reduce((c,x)=>c+(x.tekrar||0),0),0),0);

  // hareket bazlı en iyi set
  const enIyi={};
  ss.forEach(s=>s.kayitlar.forEach(k=>k.setler.forEach(x=>{
    const skor=(x.kg||0)*1000+(x.tekrar||0);
    if(!enIyi[k.id]||skor>enIyi[k.id].skor) enIyi[k.id]={skor,kg:x.kg,tekrar:x.tekrar};
  })));

  // grafik: son 8 hafta veya son 6 ay
  let bars=[];
  if(state.donem==="ay"||state.donem==="hafta"){
    const bugun=new Date();
    for(let i=7;i>=0;i--){
      const b=haftaBasi(new Date(bugun.getTime()-i*7*864e5));
      const son=new Date(b.getTime()+7*864e5);
      bars.push({etiket:b.getDate()+"."+(b.getMonth()+1), n:state.sessions.filter(s=>{const d=new Date(s.tarih);return d>=b&&d<son;}).length});
    }
  }else{
    const bugun=new Date();
    for(let i=5;i>=0;i--){
      const d=new Date(bugun.getFullYear(),bugun.getMonth()-i,1), son=new Date(d.getFullYear(),d.getMonth()+1,1);
      bars.push({etiket:AYLAR[d.getMonth()], n:state.sessions.filter(s=>{const x=new Date(s.tarih);return x>=d&&x<son;}).length});
    }
  }
  const enBuyuk=Math.max(1,...bars.map(b=>b.n));

  view.innerHTML=`
    <div class="seg">
      <button data-d="hafta" class="${state.donem==="hafta"?"on":""}">Bu hafta</button>
      <button data-d="ay" class="${state.donem==="ay"?"on":""}">Bu ay</button>
      <button data-d="tum" class="${state.donem==="tum"?"on":""}">Tüm zamanlar</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${ss.length}</b><span>antrenman</span></div>
      <div class="stat"><b>${sureDk}</b><span>dakika</span></div>
      <div class="stat"><b>${setSay}</b><span>set</span></div>
    </div>
    <div class="card">
      <h3>${state.donem==="tum"?"Aylara göre":"Haftalara göre"} antrenman</h3>
      <div class="bars">${bars.map(b=>`<div><i class="${b.n?"":"empty"}" style="height:${b.n?Math.round(b.n/enBuyuk*88)+"%":"3px"}"></i><small>${b.etiket}</small></div>`).join("")}</div>
    </div>
    <div class="card">
      <h3>Özet</h3>
      <div class="kv"><span>Ortalama antrenman süresi</span><b>${ortDk} dk</b></div>
      <div class="kv"><span>Toplam tekrar</span><b>${tekrarSay}</b></div>
      <div class="kv"><span>Toplam kaldırılan ağırlık</span><b>${hacim.toLocaleString("tr-TR")} kg</b></div>
    </div>
    ${Object.keys(enIyi).length?`<div class="card"><h3>Hareket bazlı en iyi set</h3>
      ${Object.keys(enIyi).map(id=>`<div class="kv"><span>${EX[id]?EX[id].ad:id}</span><b>${(enIyi[id].kg?enIyi[id].kg+" kg × ":"")+(enIyi[id].tekrar||0)}${EX[id]&&EX[id].tip==="sure"?" sn":""}</b></div>`).join("")}</div>`:
      `<div class="card"><p class="muted small" style="margin:0">Bu dönemde kayıt yok. Antrenman yaptıkça buradaki sayılar dolar.</p></div>`}`;
  view.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ state.donem=b.dataset.d; renderStats(); });
}

/* --- GEÇMİŞ --- */
function renderHistory(){
  document.getElementById("title").textContent="Geçmiş";
  const ss=state.sessions;
  if(!ss.length){ view.innerHTML=`<div class="card"><h3>Henüz kayıt yok</h3><p class="muted small">İlk antrenmanını bitirdiğinde tarih, süre ve ağırlıkların burada listelenir.</p></div>`; return; }
  view.innerHTML=`<div class="card">${[...ss].reverse().map(s=>{
    const setSayisi=s.kayitlar.reduce((a,k)=>a+k.setler.length,0), acik=state.openHist===s.id;
    return `<button class="hist" data-h="${s.id}">
      <div class="row between">
        <span><b style="font-family:var(--cond);font-size:18px">${tarihTR(s.tarih)}</b><span class="pill" style="margin-left:8px">Gün ${s.gun}</span></span>
        <span class="muted small">${mmss(s.sure||0)} · ${setSayisi} set</span>
      </div>
      ${acik?`<div class="small muted" style="margin-top:8px">${s.kayitlar.map(k=>`<div style="padding:3px 0">${EX[k.id]?EX[k.id].ad:k.id}: ${k.setler.map(x=>(x.kg?x.kg+"kg×":"")+x.tekrar).join(" · ")}</div>`).join("")}</div>`:""}
    </button>`;}).join("")}</div>`;
  view.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ state.openHist=state.openHist===b.dataset.h?null:b.dataset.h; renderHistory(); });
}

/* --- VERİ --- */
function renderData(){
  document.getElementById("title").textContent="Veri";
  view.innerHTML=`
    <div class="card">
      <h3>Otomatik kayıt</h3>
      <p class="muted small">Antrenman bittiğinde kayıtlar telefonun hafızasına yazılır. Yedek dosya da otomatik olarak <b>İndirilenler</b> klasörüne iner.</p>
      <div class="switch"><span>Bitirince dosyaya da yaz</span>
        <button id="tgl" class="${state.otoDosya?"on":""}"><i></i></button></div>
      <div class="kv"><span>Kayıt yeri</span><b>${kayitYeri}</b></div>
      <div class="kv"><span>Kayıtlı antrenman</span><b>${state.sessions.length}</b></div>
    </div>
    <div class="card">
      <h3>Elle yedek al</h3>
      <p class="muted small">Tüm geçmişin tek dosyaya iner. Telefon değiştirirsen bu dosyayı taşı.</p>
      <button class="btn" id="exp">Dosyaya aktar</button>
    </div>
    <div class="card">
      <h3>Dosyadan geri yükle</h3>
      <p class="muted small">İndirilenler klasöründen json dosyasını seç. Kayıtlar mevcutlara eklenir, aynı antrenman iki kez yazılmaz.</p>
      <input type="file" id="imp" accept="application/json,.json" style="font-family:var(--sans);font-size:14px;text-align:left;padding:12px">
    </div>
    <div class="card">
      <h3>Tarayıcı hafızası hakkında</h3>
      <p class="muted small">Android'de bir web sayfası kendi başına klasör okuyup yazamaz — bu bir güvenlik kuralı. Uygulama bu yüzden iki yerde birden tutuyor: tarayıcı hafızası (otomatik okunur) ve İndirilenler'deki yedek dosya (tarayıcı verilerini silersen buradan geri yüklersin).</p>
    </div>`;
  document.getElementById("tgl").onclick=async()=>{ state.otoDosya=!state.otoDosya; await saveAll(); renderData(); };
  document.getElementById("exp").onclick=()=>dosyayaAktar(false);
  document.getElementById("imp").onchange=dosyadanYukle;
}

function dosyayaAktar(sessiz){
  try{
    const blob=new Blob([JSON.stringify({v:1,sessions:state.sessions},null,1)],{type:"application/json"});
    const d=new Date(), ad=`salon-defteri-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ad; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(!sessiz) toast("İndirilenler klasörüne kaydedildi");
  }catch(e){ if(!sessiz) toast("Dosya kaydedilemedi"); }
}

function dosyadanYukle(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result), gelen=Array.isArray(d)?d:(d.sessions||[]);
      if(!gelen.length){ toast("Dosyada antrenman kaydı yok"); return; }
      const varOlan=new Set(state.sessions.map(s=>s.id)); let eklenen=0;
      gelen.forEach(s=>{ if(s&&s.id&&!varOlan.has(s.id)){ state.sessions.push(s); eklenen++; } });
      state.sessions.sort((a,b)=>new Date(a.tarih)-new Date(b.tarih));
      await saveAll();
      toast(eklenen?eklenen+" antrenman eklendi":"Yeni kayıt yoktu");
      state.tab="stats"; render();
    }catch(err){ toast("Dosya okunamadı. Doğru json dosyasını seçtiğinden emin ol."); }
  };
  r.readAsText(f);
}

/* ==========================================================
   6. BAŞLAT
   ========================================================== */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{ state.tab=b.dataset.tab; state.openEx=null; render(); scrollTo(0,0); };
});
(async()=>{ await loadAll(); render(); })();

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1217">
<title>Salon Defteri</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   TEMA JETONLARI
   Her tema ayni jeton kumesini doldurur; asagidaki kurallarin
   hicbiri sabit renk kullanmaz. Tema <html data-tema="..."> ile
   secilir, "sistem" secilirse prefers-color-scheme'e birakilir.
   --plate her temada acik kalir: dataset GIF/JPG'lerinin zemini
   saf beyaz, koyu plaka uzerinde dikis gorunurdu.
   ========================================================== */
:root,
:root[data-tema="gece"]{
  color-scheme:dark;
  --bg:#11161B; --panel:#1A212A; --field:#232C36; --line:#2E3A46;
  --text:#E9EFF4; --dim:#8FA0AF;
  --accent:#E8A93A; --accent-ink:#17110A; --accent-soft:#E8A93A22;
  --done:#5FC28D; --prot:#74AEE0;
  --isinma:#6FA8DC; --soguma:#5FC28D;
  --nav:#0D1217; --overlay:rgba(9,13,17,.94); --uyari:#E88A8A;
  --golge-1:0 1px 2px rgba(0,0,0,.35);
  --golge-2:0 14px 38px rgba(0,0,0,.5);
}
:root[data-tema="komur"]{
  color-scheme:dark;
  --bg:#08090B; --panel:#13161A; --field:#1B1F25; --line:#272C34;
  --text:#F1F3F6; --dim:#8B929B;
  --accent:#F5A623; --accent-ink:#14100A; --accent-soft:#F5A62322;
  --done:#54C98A; --prot:#6FB0E8;
  --isinma:#6FB0E8; --soguma:#54C98A;
  --nav:#050607; --overlay:rgba(4,5,6,.95); --uyari:#EC8B8B;
  --golge-1:0 1px 2px rgba(0,0,0,.6);
  --golge-2:0 14px 38px rgba(0,0,0,.7);
}
:root[data-tema="okyanus"]{
  color-scheme:dark;
  --bg:#0C161E; --panel:#14212C; --field:#1B2B39; --line:#25384A;
  --text:#E4EEF5; --dim:#86A2B6;
  --accent:#3BC3CE; --accent-ink:#04181B; --accent-soft:#3BC3CE22;
  --done:#5DC79C; --prot:#7FB6E8;
  --isinma:#A98CF0; --soguma:#5DC79C;
  --nav:#081119; --overlay:rgba(6,15,21,.94); --uyari:#E8909A;
  --golge-1:0 1px 2px rgba(0,0,0,.4);
  --golge-2:0 14px 38px rgba(0,0,0,.55);
}
:root[data-tema="gun"]{
  color-scheme:light;
  --bg:#F3F6FA; --panel:#FFFFFF; --field:#EDF1F6; --line:#DDE4EC;
  --text:#16212C; --dim:#5F7284;
  --accent:#3B6FF0; --accent-ink:#FFFFFF; --accent-soft:#3B6FF016;
  --done:#2E9E68; --prot:#3D7FC4;
  --isinma:#0E9AA7; --soguma:#2E9E68;
  --nav:#FFFFFF; --overlay:rgba(22,33,44,.55); --uyari:#C5443F;
  --golge-1:0 1px 2px rgba(22,40,66,.07);
  --golge-2:0 14px 34px rgba(22,40,66,.14);
}
:root[data-tema="kagit"]{
  color-scheme:light;
  --bg:#F5F0E7; --panel:#FFFDF8; --field:#EFE8DB; --line:#E0D6C5;
  --text:#2A2119; --dim:#7B6B59;
  --accent:#C0632F; --accent-ink:#FFF6EE; --accent-soft:#C0632F16;
  --done:#5B8C4A; --prot:#4E7FA6;
  --isinma:#4E7FA6; --soguma:#5B8C4A;
  --nav:#FFFDF8; --overlay:rgba(42,33,25,.55); --uyari:#B4452F;
  --golge-1:0 1px 2px rgba(80,60,35,.08);
  --golge-2:0 14px 34px rgba(80,60,35,.16);
}
/* "sistem": cihaz acik moddaysa Gun paletine gec, degilse Gece kalir. */
@media (prefers-color-scheme:light){
  :root[data-tema="sistem"]{
    color-scheme:light;
    --bg:#F3F6FA; --panel:#FFFFFF; --field:#EDF1F6; --line:#DDE4EC;
    --text:#16212C; --dim:#5F7284;
    --accent:#3B6FF0; --accent-ink:#FFFFFF; --accent-soft:#3B6FF016;
    --done:#2E9E68; --prot:#3D7FC4;
    --isinma:#0E9AA7; --soguma:#2E9E68;
    --nav:#FFFFFF; --overlay:rgba(22,33,44,.55); --uyari:#C5443F;
    --golge-1:0 1px 2px rgba(22,40,66,.07);
    --golge-2:0 14px 34px rgba(22,40,66,.14);
  }
}
:root{
  --plate:#FFFFFF;                    /* dataset gorselleri beyaz zeminli */
  --ana:var(--accent);                /* ana bolum programin vurgu rengini kullanir */
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --tabbar:64px;
  --r-s:10px; --r-m:14px; --r-l:18px;  /* kose yaricaplari */
  --gecis:.16s cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;transition:background var(--gecis),color var(--gecis)}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0;letter-spacing:.005em}
h1{font-size:27px} h2{font-size:22px} h3{font-size:18px}
p{margin:0 0 10px}
a{color:var(--accent)}
button{font-family:var(--sans);font-size:16px;color:inherit;background:none;border:none;cursor:pointer}

input{font-family:var(--cond);font-size:22px;font-weight:600;color:var(--text);background:var(--field);
  border:1px solid var(--line);border-radius:var(--r-s);text-align:center;width:100%;padding:10px 4px;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;transition:border-color var(--gecis),box-shadow var(--gecis)}
input[type=search],input.text{font-family:var(--sans);font-size:16px;font-weight:400;text-align:left;padding:13px 14px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::-webkit-search-cancel-button{-webkit-appearance:none}
input::placeholder{color:var(--dim)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:10px 16px 28px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:16px 16px 6px;max-width:560px;margin:0 auto}
.topbar .clock{font-family:var(--cond);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;
  margin-bottom:12px;box-shadow:var(--golge-1)}
.muted{color:var(--dim)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}

.btn{display:block;width:100%;padding:15px;border-radius:var(--r-m);background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:17px;text-align:center;letter-spacing:.01em;
  transition:transform .08s ease,filter var(--gecis),background var(--gecis),border-color var(--gecis)}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--field);filter:none}
.btn.quiet{background:var(--field);color:var(--text)}
.btn.quiet:hover{filter:none;border-color:var(--line)}
.btn.sm{padding:12px;font-size:15px}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--uyari)}
.btn.danger:hover{background:var(--uyari);color:var(--panel);border-color:var(--uyari);filter:none}
.btn[disabled]{opacity:.4;pointer-events:none}

/* Hareket görseli. Dataset GIF'leri beyaz zeminli, o yüzden açık plaka üstünde. */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.stage .media{background:var(--plate);display:flex;align-items:center;justify-content:center;padding:12px;min-height:212px}
.stage .media img{width:min(100%,240px);height:auto;aspect-ratio:1;object-fit:contain;display:block}
.stage-cap{padding:9px 13px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;
  display:flex;justify-content:space-between;gap:8px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;flex:none}
.plate img{width:100%;height:100%;object-fit:contain;display:block}
.attrib{color:var(--dim);font-size:11px;margin-top:12px}
.attrib a{color:var(--dim)}

/* Dataset gorseli olmayan hareketler: adimlara yonlendiren yer tutucu. */
.stage .media.bos{background:var(--field);flex-direction:column;gap:10px;text-align:center;color:var(--dim)}
.stage .media.bos b{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1;color:var(--line)}
.stage .media.bos span{font-size:14px;max-width:260px}
.plate.bos{background:var(--field);display:flex;align-items:center;justify-content:center}
.plate.bos b{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--dim)}
.plate.bos[data-harf]::after{content:attr(data-harf);font-family:var(--cond);font-weight:700;font-size:18px;color:var(--dim)}

/* --- ANTRENMAN BOLUMLERI (isinma / ana / soguma) --- */
.fazbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-m);margin-bottom:10px;
  border:1px solid var(--fz,var(--accent));background:color-mix(in srgb,var(--fz,var(--accent)) 12%,transparent)}
.fazbar i{font-style:normal;font-size:17px;line-height:1;color:var(--fz,var(--accent))}
.fazbar b{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--fz,var(--accent))}
.fazbar .sag{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.faz-isinma{--fz:var(--isinma)} .faz-ana{--fz:var(--ana)} .faz-soguma{--fz:var(--soguma)}

/* Bolum gecis ekrani: yeni bolume girerken tam ekran, atlanmasi zor. */
.gecis{position:fixed;inset:0;z-index:55;background:var(--overlay);backdrop-filter:blur(7px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:26px;text-align:center}
.gecis .mark{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:33px;border:2px solid var(--fz);color:var(--fz);background:color-mix(in srgb,var(--fz) 15%,transparent)}
.gecis h2{font-size:31px;letter-spacing:.09em;text-transform:uppercase;color:var(--fz)}
.gecis p{max-width:330px;color:var(--dim);margin:0}
.gecis .liste{width:100%;max-width:330px;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-m);padding:12px 15px;box-shadow:var(--golge-2)}
.gecis .liste div{padding:4px 0;font-size:14px;color:var(--dim)}
.gecis .liste div b{color:var(--text);font-weight:500}
.gecis .btn{max-width:330px;background:var(--fz);color:var(--accent-ink)}

.setrow{display:grid;grid-template-columns:56px 1fr 1fr 52px;gap:9px;align-items:center;
  padding:9px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.setno{font-family:var(--cond);font-size:17px;color:var(--dim)}
.unit{position:relative}
.unit span{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--dim);pointer-events:none}
.tick{width:100%;height:46px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--field);
  font-size:20px;color:var(--dim);display:flex;align-items:center;justify-content:center;
  transition:background var(--gecis),border-color var(--gecis),color var(--gecis),transform .08s ease}
.tick:active{transform:scale(.94)}
.setrow.done .tick{background:var(--done);border-color:var(--done);color:var(--panel)}
.setrow.done input{opacity:.5}

.pill{display:inline-block;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  font-size:13px;color:var(--dim);white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.progress{display:flex;gap:4px;margin:8px 0 12px}
.progress i{flex:1;height:4px;border-radius:999px;background:var(--line);transition:background var(--gecis)}
.progress i.on{background:var(--fz,var(--accent))}   /* --fz: hareketin bolum rengi */

/* protein çubuğu */
.meter{height:12px;border-radius:999px;background:var(--field);overflow:hidden;margin:9px 0 6px}
.meter i{display:block;height:100%;background:var(--prot);border-radius:999px;transition:width var(--gecis)}
.meter i.full{background:var(--done)}
.bignum{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:17px;font-weight:500;color:var(--dim)}

.rest{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(7px);z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px}
.rest .num{font-family:var(--cond);font-weight:700;font-size:108px;line-height:.9;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.rest .lbl{color:var(--dim);letter-spacing:.06em}
.rest .acts{display:flex;gap:10px;margin-top:22px;width:100%;max-width:340px}
.rest .onizleme{display:flex;align-items:center;gap:12px;width:100%;max-width:340px;margin-top:14px;
  padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--golge-2)}
.rest .onizleme .plate{width:52px;height:52px}
.rest .onizleme .nm{flex:1;min-width:0;text-align:left}
.rest .onizleme .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(5px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;
  width:100%;max-width:420px;max-height:86vh;overflow:auto;box-shadow:var(--golge-2)}
.modal .sheet .btn{margin-top:10px}
.chips{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chips button{flex:1;min-width:60px;padding:12px 6px;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--field);font-family:var(--cond);font-size:18px;transition:background var(--gecis),border-color var(--gecis)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.exitem{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--line);
  width:100%;text-align:left;transition:opacity var(--gecis)}
.exitem:first-child{border-top:none}
.exitem:active{opacity:.6}
.exitem .plate{width:56px;height:56px}
.exitem .nm{flex:1;min-width:0}
.exitem .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.steps{margin:0;padding-left:20px} ol.steps li{margin-bottom:7px}
ul.warn{margin:0;padding-left:18px;color:var(--dim)} ul.warn li{margin-bottom:6px}
summary{cursor:pointer}

/* hareket kataloğu */
.filters{display:flex;gap:8px;margin:10px 0 2px}
.filters select{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-s);padding:12px 10px;font-family:var(--sans);font-size:14px;-webkit-appearance:none;appearance:none}
.count{color:var(--dim);font-size:13px;padding:9px 0 2px}

/* program düzenleyici */
.progrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.progrow:first-of-type{border-top:none}
.progrow .plate{width:44px;height:44px}
.progrow .nm{flex:1;min-width:0;text-align:left}
.progrow .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:34px;height:34px;flex:none;border-radius:var(--r-s);background:var(--field);border:1px solid var(--line);
  color:var(--dim);font-size:15px;display:inline-flex;align-items:center;justify-content:center;
  transition:background var(--gecis),color var(--gecis)}
.iconbtn:hover{color:var(--text)}
.iconbtn[disabled]{opacity:.28}
.editgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.editgrid label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;letter-spacing:.03em}
.editgrid input{font-size:18px;padding:9px 4px}

/* beslenme kaydı */
.logrow{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;
  padding:11px 0;border-top:1px solid var(--line)}
.logrow:first-of-type{border-top:none}
.logrow .val{font-family:var(--cond);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.logrow .del{width:34px;height:34px;border-radius:var(--r-s);background:var(--field);border:1px solid var(--line);
  color:var(--dim);font-size:16px;transition:color var(--gecis),border-color var(--gecis)}
.logrow .del:hover{color:var(--uyari);border-color:var(--uyari)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datenav button{width:46px;height:44px;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--panel);color:var(--text);font-size:18px;transition:background var(--gecis)}
.datenav button:hover{background:var(--field)}
.datenav b{font-family:var(--cond);font-size:19px}

.hist{width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 8px;
  text-align:center;box-shadow:var(--golge-1)}
.stat b{display:block;font-family:var(--cond);font-size:30px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.stat span{font-size:12px;color:var(--dim);display:block;line-height:1.3;margin-top:2px}

/* segment secici */
.seg{display:flex;gap:4px;margin-bottom:12px;background:var(--field);border:1px solid var(--line);
  border-radius:var(--r-m);padding:4px}
.seg button{flex:1;padding:10px 4px;border:none;border-radius:calc(var(--r-m) - 5px);color:var(--dim);
  font-size:14px;background:transparent;transition:background var(--gecis),color var(--gecis)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:var(--golge-1)}
.seg.sm{margin-bottom:0}
.seg.sm button{font-size:13px;padding:9px 3px}

.bars{display:flex;align-items:flex-end;gap:6px;height:112px;margin:8px 0 2px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px}
.bars i.empty{background:var(--line)}
.bars i.p{background:var(--prot)}
.bars small{color:var(--dim);font-size:11px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:none}
.kv b{font-family:var(--cond);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.switch button{width:52px;height:31px;border-radius:999px;background:var(--field);border:1px solid var(--line);
  position:relative;flex:none;transition:background var(--gecis),border-color var(--gecis)}
.switch button i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:var(--dim);transition:left var(--gecis),background var(--gecis)}
.switch button.on{background:var(--accent);border-color:var(--accent)}
.switch button.on i{left:25px;background:var(--accent-ink)}

/* tema secici */
.temalar{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:12px}
.tema{border:1px solid var(--line);border-radius:var(--r-m);padding:10px;background:var(--field);
  color:var(--text);text-align:left;transition:border-color var(--gecis),transform .08s ease}
.tema:active{transform:scale(.97)}
.tema.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tema .ornek{height:42px;border-radius:var(--r-s);display:flex;align-items:flex-end;gap:4px;
  padding:7px;overflow:hidden;border:1px solid rgba(128,128,128,.18)}
.tema .ornek i{display:block;border-radius:3px;flex:none}
.tema .ornek i:nth-child(1){width:26px;height:9px}
.tema .ornek i:nth-child(2){width:15px;height:15px}
.tema .ornek i:nth-child(3){width:15px;height:22px}
.tema .ad{display:flex;align-items:center;gap:5px;font-size:13px;margin-top:8px}
.tema .ad b{font-weight:500}
.tema.on .ad::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:700}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:saturate(1.3)}
nav div{display:flex;max-width:560px;margin:0 auto;padding:0 4px}
nav button{flex:1;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--dim);font-size:11px;position:relative;
  transition:color var(--gecis)}
nav button i{font-style:normal;font-size:17px;line-height:1;width:44px;height:26px;
  display:flex;align-items:center;justify-content:center;border-radius:999px;
  transition:background var(--gecis),color var(--gecis)}
nav button.on{color:var(--accent)}
nav button.on i{background:var(--accent-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 18px);z-index:70;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 18px;
  font-size:14px;max-width:88%;text-align:center;box-shadow:var(--golge-2)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<!-- Tema, ana betik yüklenmeden önce uygulanır: yoksa açık tema seçmiş

/* Buyuk gorsel alani (antrenman ekrani, hareket detayi). */

  if(medyaVar(e)) return `<div class="media"><img src="${exGif(e)}" alt="${e.n}" onerror="this.style.display='none'"></div>`;

    <span>Bu hareketin dataset görseli yok — aşağıdaki adımları izle.</span></div>`;

function temaUygula(ad){
  const t = TEMALAR[ad] ? ad : "gece";
  document.documentElement.dataset.tema = t;
  /* Telefonun durum cubugu da temayla ayni renge donsun. */
  const m = document.querySelector('meta[name="theme-color"]');
  if(m){
    const nav = getComputedStyle(document.documentElement).getPropertyValue("--nav").trim();
    if(nav) m.setAttribute("content", nav);
  }
  try{ localStorage.setItem(TEMA_KEY, t); }catch(e){}
  return t;
}

const FAZ = {
  isinma:{ ad:"Isınma", ikon:"◍", sinif:"faz-isinma",
    not:"Nabzı ve eklemleri hazırla. Burada ağırlık değil kalite önemli — hiçbir seti zorlamadan bitir." },
  ana:{ ad:"Antrenman", ikon:"▣", sinif:"faz-ana",
    not:"Asıl iş burada. Setleri zorlanarak bitir, ama son tekrara kadar formu koru." },
  soguma:{ ad:"Soğuma", ikon:"◎", sinif:"faz-soguma",
    not:"Nefesi yavaşlat, çalışan kasları uzat. Acele etme — bu bölüm duruşun için antrenman kadar değerli." }
};
const FAZ_SIRA = ["isinma","ana","soguma"];
function fazOf(h){ return (h && FAZ[h.faz]) ? h.faz : "ana"; }
/* Listeyi bolum bolum gruplar. Sira programdaki siradir; hareketleri
   elle tasiyip isinmayi sona koyduysan liste de oyle gorunur. */
function fazGruplari(liste){
  const gruplar=[];
  liste.forEach(h=>{
    const f=fazOf(h), son=gruplar[gruplar.length-1];
    if(son && son.faz===f) son.hareketler.push(h);
    else gruplar.push({faz:f,hareketler:[h]});
  });
  return gruplar;
}

/* Isınma ve soğuma üç günde de aynı: tekrar yazmak yerine üretiliyor.
   Isınmada bilerek lateral raise yok — aynı hareket hem ısınmada hem ana
   bölümde olsaydı, uygulama "geçen sefer" ağırlığını ısınma setinden
   okur ve çalışma ağırlığını unuturdu. */
function isinmaBolumu(){
  return [
    {ex:"2141",set:1,tekrar:"180",mola:20,tip:"sure",faz:"isinma"},
    {ex:"c003",set:1,tekrar:"40", mola:15,tip:"sure",faz:"isinma"},
    {ex:"1362",set:2,tekrar:"20", mola:15,tip:"sure",faz:"isinma"},
    {ex:"c004",set:2,tekrar:"10", mola:15,tip:"vucut",faz:"isinma"},
    {ex:"1422",set:1,tekrar:"12", mola:20,tip:"vucut",faz:"isinma"}
  ];
}
function sogumaBolumu(){
  return [
    {ex:"c005",set:2,tekrar:"8", mola:20,tip:"vucut",faz:"soguma"},
    {ex:"1259",set:2,tekrar:"30",mola:10,tip:"sure",faz:"soguma"},
    {ex:"1511",set:2,tekrar:"30",mola:10,tip:"sure",faz:"soguma"},
    {ex:"1346",set:2,tekrar:"30",mola:10,tip:"sure",faz:"soguma"}
  ];
}
function gun(id,ad,ana){ return {id, ad, hareketler:[...isinmaBolumu(), ...ana, ...sogumaBolumu()]}; }

/* Varsayilan programlarin surumu. Eski A/B ikilisi hala duruyorsa yeni
   uc gunluk programla degistirilir; kullanici kendi programini
   duzenlediyse ona dokunulmaz, yeniler yanina eklenir. */
const PROGRAM_SURUM = 2;
function programlariTazele(){
  if((state.programSurum||1) >= PROGRAM_SURUM) return false;
  const eskiVarsayilan = state.programs.length===2
    && state.programs.every(p=>p.id==="A"||p.id==="B")
    && !state.programs.some(p=>p.duzenlendi);
  if(!state.programs.length || eskiVarsayilan){
    state.programs = varsayilanProgramlar();
  }else{
    varsayilanProgramlar().forEach(p=>{
      if(!state.programs.some(x=>x.id===p.id)) state.programs.push(p);
    });
  }
  state.programSurum = PROGRAM_SURUM;
  return true;
}

const KEY="salonDefteri.v1";
let state={tab:"home",sessions:[],meals:{},hedefProtein:150,besinTarih:null,tema:"gece",
  programs:[],programSurum:0,active:null,exIndex:0,openEx:null,openHist:null,donem:"hafta",otoDosya:true,
  kat:{q:"",bolge:"",ekip:"",limit:60},duzenle:null,secici:null,bildirim:false,saglayici:"gemini",modeller:{},kotaDolu:{}};
let restTimer=null,restBitis=0,sayacBas=0,sayacBitti=null,sayacTipi="dinlenme",clockTimer=null,kayitYeri="yok";

function lsGet(k){ try{ return window.localStorage ? localStorage.getItem(k) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ if(window.localStorage){ localStorage.setItem(k,v); return true; } }catch(e){} return false; }

/* Eski kayitlari yeni semaya tasir: slug -> dataset id, program bilgisi, set tipi. */
function migrasyonYap(){
  let degisti=false;
  state.sessions.forEach(s=>{
    if(!s.program){
      const ad=(s.gun==="A"||s.gun==="B")?("G\u00fcn "+s.gun):String(s.gun||"Antrenman");
      s.program={id:String(s.gun||"?"),ad}; degisti=true;
    }
    (s.kayitlar||[]).forEach(k=>{
      if(ESKI_ID[k.id]){ k.id=ESKI_ID[k.id]; degisti=true; }
      if(!k.tip){ k.tip=tipOf(k.id); degisti=true; }
    });
  });
  return degisti;
}

async function loadAll(){
  let ham=null;
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value){ ham=r.value; kayitYeri="uygulama haf\u0131zas\u0131"; } } }catch(e){}
  if(!ham){ const l=lsGet(KEY); if(l){ ham=l; kayitYeri="telefon haf\u0131zas\u0131"; } }
  if(ham){ try{
    const d=JSON.parse(ham);
    state.sessions=d.sessions||[];
    state.meals=d.meals||{};
    if(d.hedefProtein) state.hedefProtein=d.hedefProtein;
    if(typeof d.otoDosya==="boolean") state.otoDosya=d.otoDosya;
    if(typeof d.bildirim==="boolean") state.bildirim=d.bildirim;
    if(d.saglayici&&SAGLAYICI[d.saglayici]) state.saglayici=d.saglayici;
    if(d.modeller&&typeof d.modeller==="object") state.modeller=d.modeller;
    if(d.kotaDolu&&typeof d.kotaDolu==="object") state.kotaDolu=d.kotaDolu;
    if(Array.isArray(d.programs)&&d.programs.length) state.programs=d.programs;
    state.programSurum=+d.programSurum||1;   // kayit varsa en az surum 1'dir
    if(d.tema&&TEMALAR[d.tema]) state.tema=d.tema;
    /* Yarım kalan antrenman. Sayfa yenilenirse (ekran döndürme, tarayıcının
       sekmeyi bellekten atması, uygulamanın kapanıp açılması) kaldığı
       yerden devam eder. 12 saatten eskiyse unutulur. */
    if(d.aktif && d.aktif.baslangic && Date.now()-d.aktif.baslangic < 12*3600*1000){
      state.active=d.aktif;
      const n=(d.aktif.hareketler||[]).length;
      state.exIndex=Math.max(0, Math.min(+d.aktifIndex||0, n-1));
    }
  }catch(e){} }
  /* <head>'deki betik temayi zaten uygulamisti; burada state ile
     eslestiriyoruz (yedek dosyasindan geri yukleme de buradan geciyor). */
  try{
    const yerel = localStorage.getItem(TEMA_KEY);
    if(!ham && yerel && TEMALAR[yerel]) state.tema = yerel;
  }catch(e){}
  state.tema = temaUygula(state.tema);
  const tazelendi=programlariTazele();
  const tasindi=migrasyonYap();
  if(tazelendi||tasindi) await saveAll();
  if(kayitYeri==="yok" && lsSet(KEY+".test","1")) kayitYeri="telefon haf\u0131zas\u0131";
}
async function saveAll(){
  const paket=JSON.stringify({v:3,tema:state.tema,otoDosya:state.otoDosya,bildirim:state.bildirim,saglayici:state.saglayici,modeller:state.modeller,kotaDolu:state.kotaDolu,hedefProtein:state.hedefProtein,
    programs:state.programs,programSurum:state.programSurum,sessions:state.sessions,meals:state.meals,
    aktif:state.active,aktifIndex:state.exIndex});
  let ok=false;
  try{ if(window.storage){ await window.storage.set(KEY,paket); ok=true; } }catch(e){}
  if(lsSet(KEY,paket)) ok=true;
  return ok;
}

const pad=n=>String(n).padStart(2,"0");
const mmss=s=>pad(Math.floor(s/60))+":"+pad(s%60);
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUNLER=["Paz","Pzt","Sal","Çrş","Prş","Cum","Cmt"];
function gunKey(d){ d=d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function keyToDate(k){ const [y,m,g]=k.split("-").map(Number); return new Date(y,m-1,g); }
function tarihTR(iso){ const d=new Date(iso); return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`; }
function gunAdi(k){
  const d=keyToDate(k), b=gunKey();
  if(k===b) return "Bugün";
  if(k===gunKey(new Date(Date.now()-864e5))) return "Dün";
  return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`;
}
function haftaBasi(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function progById(id){ return state.programs.find(p=>p.id===id)||null; }
function yeniProgId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
/* Ozet ana bolumu anlatir; isinma/soguma varsa ayrica belirtilir, cunku
   "3 hareket 9 set" derken \u0131s\u0131nma hareketlerini saymak yaniltici olur. */
function progOzet(p){
  const ana=p.hareketler.filter(h=>fazOf(h)==="ana");
  const ek=p.hareketler.length-ana.length;
  return ana.length+" hareket \u00b7 "+ana.reduce((a,h)=>a+(+h.set||0),0)+" set"
       + (ek?" \u00b7 +"+ek+" \u0131s\u0131nma/so\u011fuma":"");
}
/* \u0130statistikte yalnizca ana bolum sayilir: isinma ve soguma setleri
   rakamlari sisirip haftalar arasi karsilastirmayi bozardi. */
function anaMi(k){ return fazOf(k)==="ana"; }
function progKisa(ad){ return String(ad||"").split("\u2014")[0].trim()||"Program"; }
/* Son antrenmandan sonraki program; liste sonunda basa doner. */
function sonrakiProgram(){
  if(!state.programs.length) return null;
  const son=state.sessions.length?state.sessions[state.sessions.length-1]:null;
  if(!son) return state.programs[0];
  const pid=(son.program&&son.program.id)||son.gun;
  const i=state.programs.findIndex(p=>p.id===pid);
  return i<0 ? state.programs[0] : state.programs[(i+1)%state.programs.length];
}
/* Bir hareketin en son yapildigi antrenmandaki setleri ve o seansin tarihi. */
function sonKayitBilgi(exId){
  for(let i=state.sessions.length-1;i>=0;i--){
    const s=state.sessions[i];
    const e=(s.kayitlar||[]).find(k=>k.id===exId);
    if(e&&e.setler){ const d=e.setler.filter(x=>x.done); if(d.length) return {setler:d,tarih:s.tarih}; }
  }
  return null;
}
function sonKayit(exId){ const b=sonKayitBilgi(exId); return b?b.setler[b.setler.length-1]:null; }
function gunToplam(k){
  const l=state.meals[k]||[];
  return { p:l.reduce((a,x)=>a+x.p*x.adet,0), k:l.reduce((a,x)=>a+x.k*x.adet,0), n:l.length };
}
function yuvarla(n){ return Math.round(n*10)/10; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function modalAc(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); }
function modalKapat(){ document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") modalKapat(); };

/* --- ANA SAYFA --- */
function renderHome(){
  const bugun=gunKey(), t=gunToplam(bugun), hedef=state.hedefProtein;
  const oran=Math.min(100,Math.round(t.p/hedef*100));
  const prog=sonrakiProgram();
  const hb=haftaBasi(new Date());
  const buHafta=state.sessions.filter(s=>new Date(s.tarih)>=hb).length;
  const sonAnt=state.sessions.length?state.sessions[state.sessions.length-1]:null;
  // bu haftanın protein ortalaması
  let gunler=[],topP=0,say=0;
  for(let i=0;i<7;i++){
    const d=new Date(hb.getTime()+i*864e5);
    if(d>new Date()) break;
    const k=gunKey(d), g=gunToplam(k);
    gunler.push({etiket:GUNLER[d.getDay()][0], p:g.p});
    if(g.n){ topP+=g.p; say++; }
  }
  const ortP=say?Math.round(topP/say):0;
  const enB=Math.max(hedef,...gunler.map(x=>x.p));

  const d=new Date();
  document.getElementById("title").textContent="Özet";
  view.innerHTML=`
    <div class="card">
      <div class="row between"><h3>Bugünün proteini</h3><span class="muted small">${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}</span></div>
      <div class="bignum" style="margin-top:6px;color:${t.p>=hedef?"var(--done)":"var(--prot)"}">${yuvarla(t.p)} <small>/ ${hedef} g</small></div>
      <div class="meter"><i class="${t.p>=hedef?"full":""}" style="width:${oran}%"></i></div>
      <div class="row between small muted">
        <span>${t.p>=hedef?"Hedef tamam":yuvarla(hedef-t.p)+" g kaldı"}</span>
        <span>${Math.round(t.k)} kcal · ${t.n} kayıt</span>
      </div>
      <button class="btn sm" id="goFood" style="margin-top:12px">Yemek ekle</button>
    </div>

    <div class="card">
      <div class="row between"><h3>Sıradaki antrenman</h3>${prog?`<span class="pill on">${progKisa(prog.ad)}</span>`:""}</div>
      ${prog?`<p class="muted small" style="margin-top:6px">${progOzet(prog)}${sonAnt?" · son antrenman "+tarihTR(sonAnt.tarih):""}</p>
      <button class="btn" id="goWorkout">${state.active?"Antrenmana dön":"Antrenmanı başlat"}</button>`
      :`<p class="muted small" style="margin-top:6px">Henüz bir programın yok.</p>
      <button class="btn" id="goWorkout">Program oluştur</button>`}
    </div>

    <div class="card">
      <h3>Bu hafta</h3>
      <div class="stats" style="margin:10px 0 6px">
        <div class="stat"><b>${buHafta}</b><span>antrenman</span></div>
        <div class="stat"><b>${ortP}</b><span>ort. protein</span></div>
        <div class="stat"><b>${gunler.filter(x=>x.p>=hedef).length}</b><span>hedef tutan gün</span></div>
      </div>
      <div class="bars" style="height:80px">${gunler.map(x=>`<div><i class="p ${x.p?"":"empty"}" style="height:${x.p?Math.round(x.p/enB*88)+"%":"3px"}"></i><small>${x.etiket}</small></div>`).join("")}</div>
    </div>

    <button class="btn ghost sm" id="goData">Veri ve yedek</button>`;
  document.getElementById("goFood").onclick=()=>{ state.tab="food"; render(); scrollTo(0,0); };
  document.getElementById("goWorkout").onclick=()=>{
    if(!prog){ state.tab="programs"; render(); scrollTo(0,0); return; }
    if(!state.active) startSession(prog); else { state.tab="workout"; render(); }
  };
  document.getElementById("goData").onclick=()=>{ state.tab="data"; render(); scrollTo(0,0); };
}

/* Seçilen modelden başlayıp listenin altına inen sıra. Bugün kotası
   dolduğu bilinen modeller atlanıyor; kota günlük sıfırlandığı için
   işaret tarihle tutuluyor. */
function modelZinciri(){
  const sag=aktifSag();

  let bas=hepsi.indexOf(secili);

  const bugun=gunKey(), dolu=state.kotaDolu||{};
  const acik=sira.filter(id=>dolu[id]!==bugun);
  return acik.length?acik:sira;   // hepsi doluysa yine de dene, belki sıfırlanmıştır
}

/* Sağlayıcıdan bağımsız iç biçim: [{metin},{gorsel}] */
function istekGovdesi(model, parcalar, sema, sistem, maxTokens, anahtar){
  if(state.saglayici==="claude"){
    return {url:"https://api.anthropic.com/v1/messages", ayar:{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":anahtar,
        "anthropic-version":"2023-06-01",
        /* tarayıcıdan doğrudan çağrı için gerekli; bu başlık olmadan
           istek CORS'a takılır ve sunucuya hiç ulaşmaz */
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:model,
        max_tokens:maxTokens||4000,
        system:sistem,
        output_config:{format:{type:"json_schema",schema:sema}},
        messages:[{role:"user",content:parcalar.map(p=>p.gorsel
          ? {type:"image",source:{type:"base64",media_type:"image/jpeg",data:p.gorsel}}
          : {type:"text",text:p.metin})}]
      })
    }};
  }
  /* Gemini: sistem istemi ilk metin parçası olarak gidiyor, ayrı alanı yok */
  return {url:"https://generativelanguage.googleapis.com/v1beta/interactions", ayar:{
    method:"POST",
    headers:{"content-type":"application/json","x-goog-api-key":anahtar},
    body:JSON.stringify({
      model:model,
      input:[{type:"text",text:sistem}].concat(parcalar.map(p=>p.gorsel
        ? {type:"image",data:p.gorsel,mime_type:"image/jpeg"}
        : {type:"text",text:p.metin})),
      response_format:{type:"text",mime_type:"application/json",schema:sema}
    })
  }};
}

async function hataMetni(yanit, sag, model){
  let ek="";
  try{
    const h=await yanit.json();
    /* Gemini hatayı dizi içinde döndürebiliyor */
    const g=Array.isArray(h)?h[0]:h;
    ek=(g&&g.error&&g.error.message)||"";
  }catch(e){}
  if(/credit balance/i.test(ek))
    return `Anahtar geçerli ama ${sag.ad} hesabında kredi yok.`;
  if(/API key not valid|API key expired|API_KEY_INVALID|api key is invalid/i.test(ek))
    return `Anahtar kabul edilmedi — ${sag.konsolAd}'den yeni bir anahtar al.`;
  if(yanit.status===429)
    return "Kota ya da hız sınırına takıldı ("+(model||aktifModel())+")."+(ek?" — "+ek:"");
  if(yanit.status===404||/not found|not supported|does not exist/i.test(ek))
    return "Model bulunamadı ya da bu isteği desteklemiyor ("+(model||aktifModel())
      +")."+(ek?" — "+ek:"");
  const on={401:"Anahtar kabul edilmedi", 403:"Bu anahtarın yetkisi yok",
            400:"İstek reddedildi",
            503:"Sunucu yoğun. Birkaç kez denedim, hepsi meşgul döndü - biraz bekleyip tekrar dene",
            529:"Sunucu yoğun, biraz bekleyip tekrar dene"}[yanit.status]
            || ("API hatası "+yanit.status);
  /* Sağlayıcının kendi açıklaması teşhis için en değerli bilgi, saklama */
  return on+(ek?" — "+ek:"");
}

/* Dinlenirken sırada ne olduğunu hesaplar: aynı hareketin bir sonraki seti,
   ya da hareket bittiyse sıradaki hareket. Sıradaki hareket başka bir
   bölümdeyse (ısınma bitti, antrenman başlıyor gibi) başlık bunu söyler. */
function sonrakiBilgi(s, exIndex, kayit){
  const kalan=kayit.setler.filter(x=>!x.done).length;
  if(kalan>0){
    const h=s.hareketler[exIndex], yapilan=kayit.setler.length-kalan;
    return {baslik:"Sıradaki set", ex:h.ex,
            alt:`set ${yapilan+1} / ${kayit.setler.length}`};
  }
  const simdiki=s.hareketler[exIndex], sonraki=s.hareketler[exIndex+1];
  if(!sonraki) return {baslik:"Son hareket bitti", ex:null, alt:"Antrenmanı bitirebilirsin"};
  const fazDegisti = fazOf(sonraki)!==fazOf(simdiki);
  return {baslik: fazDegisti ? "Sırada: "+FAZ[fazOf(sonraki)].ad : "Sıradaki hareket",
          ex:sonraki.ex,
          alt:`${sonraki.set} set × ${sonraki.tekrar}${sonraki.tip==="sure"?" sn":""}`};
}

const uyu=ms=>new Promise(r=>setTimeout(r,ms));
/* Ücretsiz katmanda model yoğunken 503 sık geliyor ve geçici; elle tekrar
   denemek yerine kendimiz deniyoruz. 4xx'lerin çoğu kalıcı, onları denemiyoruz. */
const GECICI_DURUM=[408,429,500,502,503,504,529];

async function tekModelIstek(model, parcalar, sema, sistem, maxTokens, anahtar, sag, ilerle){
  const istek=istekGovdesi(model,parcalar,sema,sistem,maxTokens,anahtar);
  const enFazla=3;
  for(let deneme=1;;deneme++){
    let yanit;
    try{ yanit=await fetch(istek.url,istek.ayar); }
    catch(e){
      if(deneme<enFazla){ if(ilerle) ilerle("Bağlanılamadı, yeniden deneniyor ("+(deneme+1)+"/"+enFazla+")"); await uyu(800*deneme); continue; }
      throw new Error("Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.");
    }
    if(yanit.ok){
      const d=await yanit.json();
      if(d.stop_reason==="refusal") throw new Error("Model bu fotoğrafı değerlendirmedi");
      return jsonAyikla(yanitMetni(d));
    }
    /* 429 ve "model yok" durumlarını zincire bildiriyoruz: bu modelde
       ısrar etmek yerine bir alttakine geçmek daha hızlı çözüm. */
    if(yanit.status===429||yanit.status===404){
      const hata=new Error(await hataMetni(yanit,sag,model));
      hata.modelDegistir=true;
      hata.gunlukKota=yanit.status===429;
      throw hata;
    }
    if(GECICI_DURUM.indexOf(yanit.status)>=0 && deneme<enFazla){
      /* sunucu ne kadar bekleneceğini söylüyorsa ona uy */
      const sonra=yanit.headers&&yanit.headers.get?+(yanit.headers.get("retry-after")||0):0;
      if(ilerle) ilerle("Sunucu meşguldü, yeniden deneniyor ("+(deneme+1)+"/"+enFazla+")");
      await uyu(Math.max(sonra*1000, 900*Math.pow(2,deneme-1)));
      continue;
    }
    throw new Error(await hataMetni(yanit,sag,model));
  }
}

async function yzIstek(parcalar, sema, sistem, maxTokens, ilerle){
  const sag=aktifSag(), anahtar=apiAnahtar(sag);
  if(!anahtar) throw new Error(sag.ad+" anahtarı girilmemiş");
  const zincir=modelZinciri();
  let son=null;
  for(let i=0;i<zincir.length;i++){
    try{
      return await tekModelIstek(zincir[i],parcalar,sema,sistem,maxTokens,anahtar,sag,ilerle);
    }catch(e){
      son=e;
      if(!e.modelDegistir || i===zincir.length-1) throw e;
      if(e.gunlukKota) kotayiIsaretle(zincir[i]);
      if(ilerle) ilerle(modelAdi(zincir[i])+" kotası doldu, "+modelAdi(zincir[i+1])+" deneniyor");
      await uyu(300);
    }
  }
  throw son;
}

/* Claude metni content[] içinde; Gemini yanıtı adımlara bölüyor ve metin
   model_output adımının content[]'inde duruyor (düşünme adımları ayrı). */
function yanitMetni(d){
  if(state.saglayici==="claude")
    return (d.content||[]).filter(c=>c&&c.type==="text").map(c=>c.text).join("");
  const adimlar=Array.isArray(d.steps)?d.steps:[];
  const metin=adimlar
    .filter(a=>a&&a.type==="model_output")
    .reduce((t,a)=>t.concat(Array.isArray(a.content)?a.content:[]),[])
    .filter(c=>c&&c.type==="text")
    .map(c=>c.text).join("");
  return metin || d.output_text || "";
}

/* Şema istesek de model JSON'u ``` içine alabiliyor ya da başına bir cümle
   ekleyebiliyor; kabuğu soyup öyle ayrıştırıyoruz. Hiç olmazsa gelen metnin
   başını hataya koyuyoruz, yoksa sorun teşhis edilemiyor. */
function jsonAyikla(metin){
  const t=String(metin||"").trim();
  const cit=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const ham=cit?cit[1].trim():t;
  try{ return JSON.parse(ham); }catch(e){}
  const ilk=ham.indexOf("{"), son=ham.lastIndexOf("}");
  if(ilk>=0&&son>ilk){ try{ return JSON.parse(ham.slice(ilk,son+1)); }catch(e){} }
  const ornek=ham.slice(0,140).replace(/\s+/g," ");
  throw new Error("Yanıt okunamadı"+(ornek?" — gelen: "+ornek:" — yanıt boş geldi"));
}

       {metin:"Bu fotoğraftaki porsiyonun protein ve kalori miktarını tahmin et."}];
  if(ek.not) parcalar.push({metin:"Kullanıcının notu: "+ek.not});
  if(ek.onceki) parcalar.push({metin:"Önceki tahminin: "+JSON.stringify(ek.onceki)});
  if(ek.duzeltme) parcalar.push({metin:"Kullanıcının düzeltmesi: "+ek.duzeltme});
  return yzIstek(parcalar, fotoSema(kalanVar), kalanVar?SISTEM_KALAN:SISTEM_TEK, null, ilerlemeYaz);
}

/* Fotoğrafsız yol: kullanıcı ne yediğini yazıyor. Şema ve sonuç ekranı
   fotoğraftakiyle aynı, sadece görsel yerine metin gidiyor. */
async function metinAnaliz(metin, ek){
  ek=ek||{};
  const parcalar=[{metin:"Bugün şunu yedim: "+metin}];
  if(ek.onceki) parcalar.push({metin:"Önceki tahminin: "+JSON.stringify(ek.onceki)});
  if(ek.duzeltme) parcalar.push({metin:"Kullanıcının düzeltmesi: "+ek.duzeltme});
  return yzIstek(parcalar, fotoSema(false), SISTEM_METIN, null, ilerlemeYaz);
}

/* Uzun kenarı 1024 px'e indirip JPEG'e çevirir: yemek fotoğrafı için
   fazlasıyla yeterli, istek boyutunu ve görsel token maliyetini düşürür. */
function fotoKucult(dosya, uzunKenar=1024, kalite=0.8){
  return new Promise((coz,yan)=>{
    const img=new Image(), url=URL.createObjectURL(dosya);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const olcek=Math.min(1, uzunKenar/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*olcek)), h=Math.max(1,Math.round(img.height*olcek));
      const c=document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const veri=c.toDataURL("image/jpeg",kalite);
      coz(veri.slice(veri.indexOf(",")+1));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); yan(new Error("Fotoğraf okunamadı")); };
    img.src=url;
  });
}

/* Kamera/galeri seçici. Kullanıcı hareketi içinde çağrılmalı. */
function fotoSec(){
  return new Promise(coz=>{
    const inp=document.createElement("input");
    inp.type="file"; inp.accept="image/*"; inp.capture="environment";
    inp.onchange=()=>coz(inp.files&&inp.files[0]||null);
    inp.click();
  });
}

/* Sonucu düzenlenebilir gösterir. Kalan fotoğrafı henüz çekilmediyse
   "Kalanını çek" ile ikinci fotoğraf istenip yenen miktar hesaplanır. */
function fotoSonucSheet(sonuc, durum){
  const guvenTR={yuksek:"yüksek",orta:"orta",dusuk:"düşük"}[sonuc.guven]||sonuc.guven||"";
  const kalemler=Array.isArray(sonuc.kalemler)?sonuc.kalemler:[];
  const yuzde=durum.kalanVar&&sonuc.yenen_yuzde!=null?Math.round(sonuc.yenen_yuzde):null;
  modalAc(`
    <h2>${durum.kalanVar?"Yediğin kadarı":(durum.metinMi?"Yazdığından":"Fotoğraftan")}</h2>
    <p class="muted small">${yuzde!=null?"Tabağın ~%"+yuzde+"'i · ":""}${sonuc.porsiyon||""}${guvenTR?" · güven "+guvenTR:""}</p>
    <input class="text" id="fAd" value="${String(sonuc.ad||"").replace(/"/g,"&quot;")}" style="margin-top:10px">
    <div class="editgrid" style="grid-template-columns:1fr 1fr">
      <div><label>Protein (g)</label><input type="number" inputmode="decimal" id="fP" value="${Math.round((+sonuc.protein_g||0)*10)/10}"></div>
      <div><label>Kalori</label><input type="number" inputmode="numeric" id="fK" value="${Math.round(+sonuc.kalori||0)}"></div>
    </div>
    ${kalemler.length>1?`<p class="muted small" style="margin-top:12px">Neler var</p>
      ${kalemler.map(x=>`<div class="kv"><span>${x.ad}<br><span class="muted small">${x.porsiyon||""}</span></span>
        <b>${Math.round((+x.protein_g||0)*10)/10} g · ${Math.round(+x.kalori||0)} kcal</b></div>`).join("")}`:""}
    <p class="muted small" style="margin-top:10px">${durum.metinMi?"Dayanak":"Ölçek"}: ${sonuc.olcek||"—"}</p>
    ${sonuc.not?`<p class="muted small">${sonuc.not}</p>`:""}
    ${durum.notu?`<p class="muted small">${durum.metinMi?"Yazdığın":"Notun"}: ${durum.notu}</p>`:""}
    <button class="btn" id="fEkle">Güne ekle</button>
    <button class="btn quiet" id="fDuzelt">Tahmini düzelt</button>
    ${(durum.kalanVar||durum.metinMi)?"":`<button class="btn quiet" id="fKalan">Hepsini yemediysen: kalanını çek</button>`}
    <button class="btn ghost" id="fIptal">Vazgeç</button>`);

  document.getElementById("fEkle").onclick=async()=>{
    const ad=document.getElementById("fAd").value.trim()||"Yemek";
    const pr=+document.getElementById("fP").value||0;
    const kal=+document.getElementById("fK").value||0;
    if(!pr&&!kal){ toast("Protein veya kalori gir"); return; }
    if(!state.meals[durum.gunK]) state.meals[durum.gunK]=[];
    state.meals[durum.gunK].push({ad,por:sonuc.porsiyon||"1 porsiyon",p:pr,k:kal,adet:1});
    await saveAll(); modalKapat(); renderFood(); toast(ad+" eklendi");
  };
  /* Yanlış bir kalem varsa kullanıcı söylüyor, tahmin yeniden hesaplanıyor.
     Fotoğraf da önceki tahmin de birlikte gönderildiği için model neyi
     değiştireceğini biliyor. */
  document.getElementById("fDuzelt").onclick=()=>{
    modalAc(`
      <h2>Neyi düzeltmeli?</h2>
      <p class="muted small">Yanlış bulduğun kalemi ve doğrusunu yaz.</p>
      <input class="text" id="dMetin" placeholder="örn. pilav 170 değil 80 gram" style="margin-top:10px">
      ${kalemler.length?`<p class="muted small" style="margin-top:8px">Tahmindeki kalemler: ${kalemler.map(x=>x.ad).join(", ")}</p>`:""}
      <button class="btn" id="dGonder">Yeniden hesapla</button>
      <button class="btn ghost" id="dVaz">Vazgeç</button>`);
    const gonder=async()=>{
      const metin=document.getElementById("dMetin").value.trim();
      if(!metin){ toast("Ne düzeltmeli?"); return; }
      modalAc(`<h2>Yeniden hesaplanıyor</h2><p class="muted small">Düzeltmen uygulanıyor.</p>`);
      try{
        /* Kaynak ne olursa olsun (fotoğraf, iki fotoğraf, metin) aynı yerden
           yeniden çalıştırılıyor; sayfa kaynağı bilmek zorunda değil. */
        const yeni=await durum.yeniden({onceki:sonuc,duzeltme:metin});
        fotoSonucSheet(yeni,durum);
      }catch(e){ fotoHataSheet(e, ()=>fotoSonucSheet(sonuc,durum)); }
    };
    document.getElementById("dGonder").onclick=gonder;
    document.getElementById("dMetin").onkeydown=ev=>{ if(ev.key==="Enter") gonder(); };

      <p class="muted small">Önceki fotoğrafla kalanlar birlikte değerlendiriliyor.</p>`);
    try{

    }catch(e){ fotoHataSheet(e, ()=>fotoSonucSheet(sonuc,durum)); }
  };
  document.getElementById("fIptal").onclick=modalKapat;
}

async function fotoSheet(dosya,gunK,notu){
  modalAc(`<h2>Fotoğraf inceleniyor</h2>

  }
}

     isaretlenince tum ekrani yeniden cizmedigimiz icin GIF bastan baslamiyor. */
  const setKutu=document.getElementById("setler");
  setKutu.oninput=ev=>{
    const inp=ev.target;
    if(!inp.dataset||inp.dataset.f===undefined) return;
    kayit.setler[+inp.dataset.set][inp.dataset.f]= inp.value===""?null:+inp.value;
  };
  /* Seti tamamlar: sn verilirse gerçekleşen süreyi kutuya yazar. */
  const setiBitir=(i,sn)=>{
    const st=kayit.setler[i], satir=setKutu.querySelectorAll(".setrow")[i];
    if(sn!=null){
      st.tekrar=sn;
      const inp=satir.querySelector('[data-f="tekrar"]');
      if(inp) inp.value=sn;
    }
    st.done=true;
    satir.classList.add("done");
    satir.querySelector("[data-done]").textContent="✓";
    saveAll();
    const bilgi=sonrakiBilgi(s,state.exIndex,kayit);
    /* Mola 0 ise (isinma/soguma'da olabilir) dinlenme ekranini hic acma. */
    if(h.mola>0) startRest(h.mola, bilgi.baslik, bilgi);
  };
  setKutu.onclick=ev=>{
    const b=ev.target.closest("[data-done]");
    if(!b) return;
    const i=+b.dataset.done, st=kayit.setler[i];
    if(st.done){                                  // işareti geri al
      st.done=false;
      b.closest(".setrow").classList.remove("done");
      b.textContent="○";
      saveAll();
      return;
    }
    /* Plank gibi süreli hareketlerde tik önce sayacı başlatır; set, süre
       dolunca ya da "Bitir"e basılınca geçen süreyle kapanır. */
    if(h.tip==="sure"){
      const hedef=Math.max(1, +st.tekrar || parseInt(h.tekrar,10) || 30);
      startHold(hedef, `${exAd(h.ex)} · set ${i+1}`, gecen=>setiBitir(i,gecen));
      return;
    }
    setiBitir(i,null);
  };
  const setSilBtn=document.getElementById("setSil");
  const setDurum=()=>{
    document.getElementById("setPill").textContent=setEtiketi(kayit,h);
    setSilBtn.disabled = kayit.setler.length<=1;
  };
  setDurum();
  document.getElementById("setEkle").onclick=()=>{
    if(kayit.setler.length>=20){ toast("Bir harekette en fazla 20 set"); return; }
    const son=kayit.setler[kayit.setler.length-1]||{};
    kayit.setler.push({kg:son.kg??null, tekrar:son.tekrar??null, done:false});
    const i=kayit.setler.length-1;
    setKutu.insertAdjacentHTML("beforeend", setSatiri(kayit.setler[i],i,h,birim));
    setDurum(); saveAll();
  };
  /* Sondaki seti cikarir; en az bir set kalir. */
  setSilBtn.onclick=()=>{
    if(kayit.setler.length<=1) return;
    const cikan=kayit.setler.pop();
    setKutu.lastElementChild.remove();
    setDurum(); saveAll();
    if(cikan.done) toast("İşaretli set çıkarıldı");
  };
  document.getElementById("prevEx").onclick=()=>{ if(state.exIndex>0){state.exIndex--;saveAll();renderWorkout();scrollTo(0,0);} };
  document.getElementById("nextEx").onclick=()=>{
    if(state.exIndex<s.hareketler.length-1){ state.exIndex++; saveAll(); renderWorkout(); scrollTo(0,0); }
    else bitirSor();
  };
  /* Antrenman sürerken programa değil, yalnızca bu seansa dokunur. */
  document.getElementById("exEkle").onclick=()=>{
    state.secici={seans:true};
    state.tab="guide"; state.kat.limit=60; state.openEx=null;
    render(); scrollTo(0,0);
  };
  document.getElementById("exCikar").onclick=()=>{
    if(s.hareketler.length<=1){ toast("Antrenmanda en az bir hareket kalmalı"); return; }
    const cikar=()=>{
      s.hareketler.splice(state.exIndex,1);
      s.kayitlar.splice(state.exIndex,1);
      if(state.exIndex>=s.hareketler.length) state.exIndex=s.hareketler.length-1;
      saveAll(); renderWorkout(); scrollTo(0,0);
      toast("Hareket antrenmandan çıkarıldı");
    };
    const yapilan=kayit.setler.filter(x=>x.done).length;
    if(!yapilan) return cikar();
    modalAc(`
      <h2>Hareketi çıkar</h2>
      <p class="muted small">${exAd(h.ex)} için ${yapilan} işaretli set var, bu kayıt silinecek.</p>
      <button class="btn danger" id="hEvet">Çıkar</button>
      <button class="btn ghost" id="hHayir">Vazgeç</button>`);
    document.getElementById("hEvet").onclick=()=>{ modalKapat(); cikar(); };
    document.getElementById("hHayir").onclick=modalKapat;
  };
  document.getElementById("finish").onclick=bitirSor;
  /* Ekran cizildikten sonra: yeni bir bolume girdiysek tam ekran uyari.
     sonFaz ayni bolumde tekrar tetiklenmesini engelliyor. */
  gecisKontrol();
}

/* Bir hareket icin seans kaydi. adet verilmezse gecen antrenmandaki set
   sayisi, o da yoksa programdaki hedef kullanilir. Kilo ve tekrar her zaman
   gecen antrenmandan set set tasinir. */
function kayitOlustur(h,adet){
  const onceki=sonKayitBilgi(h.ex), o=oneriOf(h.ex);
  const gecmis = onceki ? onceki.setler : null;
  const n = adet!=null ? adet : (gecmis ? gecmis.length : h.set);
  /* faz kayda da yaziliyor: istatistikte yalnizca "ana" setler sayilsin diye. */
  return { id:h.ex, tip:h.tip, faz:fazOf(h), setler:Array.from({length:n},(_,i)=>{
    const ref = gecmis ? (gecmis[i]||gecmis[gecmis.length-1]) : null;
    const kg = h.tip==="kg" ? (ref&&ref.kg!=null?ref.kg:(o.kg!=null?o.kg:null)) : null;
    const tk = ref&&ref.tekrar!=null ? ref.tekrar : (o.tekrar!=null?o.tekrar:null);
    return {kg,tekrar:tk,done:false};
  })};
}

function startSession(prog){
  if(!prog||!prog.hareketler.length) return;
  /* Program anlık kopyalanır: seans sürerken programı düzenlemek seansı bozmaz. */
  /* mola: 0 gecerli bir deger (isinma/soguma'da molasiz gecis istenebilir),
     o yuzden "||60" yerine null kontrolu. */
  const hareketler=prog.hareketler.map(h=>({
    ex:h.ex, set:Math.max(1,+h.set||1), tekrar:h.tekrar,
    mola:(h.mola==null ? 60 : Math.max(0,Math.min(600,+h.mola||0))),
    tip:h.tip||tipOf(h.ex), faz:fazOf(h)
  }));
  state.active={
    id:"s"+Date.now(), tarih:new Date().toISOString(),
    gun:prog.id, program:{id:prog.id,ad:prog.ad}, hareketler,
    baslangic:Date.now(), sure:0,
    /* Gecen antrenmanda ne yaptiysan onunla basla: set sayisi, kilo ve
       tekrar set set birebir tasinir. Programi o antrenmandan SONRA
       duzenlediysen programdaki hedef gecerli olur. */
    kayitlar:hareketler.map(h=>{
      /* Program duzenlemesi yalnizca SET SAYISINI belirler; kilo ve tekrar
         her zaman gecen antrenmandan gelir. */
      const onceki=sonKayitBilgi(h.ex);
      const programDahaYeni = prog.duzenlendi && (!onceki || prog.duzenlendi > Date.parse(onceki.tarih));
      return kayitOlustur(h, programDahaYeni ? h.set : null);
    })
  };
  state.exIndex=0; state.tab="workout"; state.duzenle=null; state.secici=null; state.openEx=null;
  state.active.sonFaz=null;     // ilk hareket hangi bolumdeyse gecis ekrani cikacak
  saatBaslat();
  render(); scrollTo(0,0);
}

/* Süre başlangıç anından hesaplanıyor, tik sayısından değil; uygulama arka
   planda kalsa da geri dönünce doğru süreyi gösterir. */
function saatBaslat(){
  clearInterval(clockTimer);
  const yaz=()=>{
    if(!state.active) return;
    const el=document.getElementById("clock");
    if(el) el.textContent=mmss(Math.floor((Date.now()-state.active.baslangic)/1000));
  };
  yaz();
  clockTimer=setInterval(yaz,1000);
}

function bitirSor(){
  const s=state.active; if(!s) return;
  const yapilan=s.kayitlar.reduce((a,k)=>a+k.setler.filter(x=>x.done).length,0);
  const sure=mmss(Math.floor((Date.now()-s.baslangic)/1000));
  modalAc(`
    <h2>Antrenmanı bitir</h2>
    <p class="muted small">${yapilan} set işaretledin · ${sure} sürdü.</p>
    ${yapilan?`<button class="btn" id="mSave">Kaydet ve bitir</button>`:`<p class="muted small">Hiç set işaretlemedin, kaydedecek bir şey yok.</p>`}
    <button class="btn quiet" id="mDrop">Kaydetmeden çık</button>
    <button class="btn ghost" id="mBack">Vazgeç, devam et</button>`);
  const sv=document.getElementById("mSave"); if(sv) sv.onclick=()=>{ modalKapat(); kaydetVeBitir(); };
  document.getElementById("mDrop").onclick=async()=>{
    modalKapat();
    state.active=null; clearInterval(clockTimer);
    /* Diskteki yarım seans kopyasını da sil; yoksa her yenilemede geri gelir. */
    await saveAll();
    state.tab="home"; render(); toast("Antrenman kaydedilmedi");
  };
  document.getElementById("mBack").onclick=modalKapat;
}

async function kaydetVeBitir(){
  const s=state.active;
  s.sure=Math.floor((Date.now()-s.baslangic)/1000);
  s.kayitlar.forEach(k=>{ k.setler=k.setler.filter(x=>x.done); });
  s.kayitlar=s.kayitlar.filter(k=>k.setler.length);
  s.hacim=s.kayitlar.reduce((a,k)=>a+k.setler.reduce((b,x)=>b+((x.kg||0)*(x.tekrar||0)),0),0);
  delete s.hareketler;
  delete s.sonFaz;            // yalnizca seans sirasinda anlamli
  state.sessions.push(s);
  state.active=null;
  clearInterval(clockTimer);
  const ok=await saveAll();
  if(state.otoDosya) dosyayaAktar(true);
  state.tab="stats"; render();
  toast(ok?`Kaydedildi · ${mmss(s.sure)}`:"Kaydedildi, ama telefon hafızası kapalı. Veri sekmesinden dosyaya aktar.");
}

      ${p.hareketler.length? fazGruplari(p.hareketler.map((h,i)=>({h,i}))

      : `<p class="muted small" style="margin:6px 0 0">Bu programda hareket yok.</p>`}

    </div>
    <button class="btn danger sm" id="progSil">Bu programı sil</button>`;

  document.getElementById("back").onclick=()=>{ state.duzenle=null; render(); scrollTo(0,0); };

    document.getElementById("sHayir").onclick=modalKapat;
  };
}

/* set / tekrar / mola / sayım tipi düzenleme sayfası */

      <div class="seg sm">
        <button data-t="kg" class="${h.tip==="kg"?"on":""}">Ağırlıklı</button>
        <button data-t="vucut" class="${h.tip==="vucut"?"on":""}">Vücut ağırlığı</button>

        <div><label>${h.tip==="sure"?"Saniye":"Tekrar"}</label><input type="text" id="aTek" value="${String(h.tekrar).replace(/"/g,"&quot;")}"></div>
        <div><label>Mola (sn)</label><input type="number" inputmode="numeric" id="aMola" value="${h.mola}"></div>
      </div>
      <button class="btn" id="aOk">Kaydet</button>
      <button class="btn ghost" id="aIptal">Vazgeç</button>`);
    const sheet=document.getElementById("modalBody");
    const oku=()=>{
      h.set=Math.max(1,Math.min(20,+sheet.querySelector("#aSet").value||1));
      h.tekrar=sheet.querySelector("#aTek").value.trim()||"10";
      h.mola=Math.max(0,Math.min(600,+sheet.querySelector("#aMola").value||60));
    };
    sheet.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ oku(); h.tip=b.dataset.t; ciz(); });
    sheet.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ oku(); h.faz=b.dataset.f; ciz(); });
    sheet.querySelector("#aOk").onclick=async()=>{
      oku();
      p.duzenlendi=Date.now();   // program artik gecmisten daha yeni
      await saveAll(); modalKapat(); render();
    };
    sheet.querySelector("#aIptal").onclick=()=>{ Object.assign(h,snap); modalKapat(); };
  };
  ciz();
}

/* katalogdan seçilen hareketi bir programa ekler */
function ekleSheet(exId){
  /* Sürmekte olan antrenmana mı, bir programa mı ekleniyor? */
  const seansaMi = !!(state.secici && state.secici.seans && state.active);
  const hedefProg=(!seansaMi && state.secici)?progById(state.secici.progId):null;
  if(!seansaMi && !hedefProg && !state.programs.length){ toast("Önce bir program oluştur"); return; }
  const o=oneriOf(exId);
  const y={ tip:tipOf(exId), set:3, tekrar:"", mola:0, faz:"ana" };
  y.tekrar=String(y.tip==="sure"?(o.tekrar!=null?o.tekrar:30):(o.tekrar!=null?o.tekrar:10));
  y.mola=y.tip==="kg"?90:60;
  let secilen=hedefProg?hedefProg.id:(state.programs[0]?state.programs[0].id:null);

  const ciz=()=>{
    modalAc(`
      <h2>Programa ekle</h2>
      <p class="muted small">${exAd(exId)}</p>
      ${seansaMi?`<p class="small" style="margin-top:12px">Sürmekte olan antrenmana eklenecek</p>`
        :hedefProg?`<p class="small" style="margin-top:12px">Program: <b>${hedefProg.ad}</b></p>`
        :`<p class="muted small" style="margin:12px 0 6px">Hangi programa?</p>
          <div class="seg sm" style="flex-wrap:wrap">${state.programs.map(p=>`<button data-p="${p.id}" class="${p.id===secilen?"on":""}">${progKisa(p.ad)}</button>`).join("")}</div>`}
      <p class="muted small" style="margin:12px 0 6px">Hangi bölüme?</p>
      <div class="seg sm">
        ${FAZ_SIRA.map(f=>`<button data-f="${f}" class="${y.faz===f?"on":""}">${FAZ[f].ad}</button>`).join("")}
      </div>
      <p class="muted small" style="margin:12px 0 6px">Nasıl sayılsın?</p>
      <div class="seg sm">
        <button data-t="kg" class="${y.tip==="kg"?"on":""}">Ağırlıklı</button>
        <button data-t="vucut" class="${y.tip==="vucut"?"on":""}">Vücut ağırlığı</button>
        <button data-t="sure" class="${y.tip==="sure"?"on":""}">Süre</button>
      </div>
      <div class="editgrid">
        <div><label>Set</label><input type="number" inputmode="numeric" id="nSet" value="${y.set}"></div>
        <div><label>${y.tip==="sure"?"Saniye":"Tekrar"}</label><input type="text" id="nTek" value="${String(y.tekrar).replace(/"/g,"&quot;")}"></div>
        <div><label>Mola (sn)</label><input type="number" inputmode="numeric" id="nMola" value="${y.mola}"></div>
      </div>
      <button class="btn" id="nOk">Ekle</button>
      <button class="btn ghost" id="nIptal">Vazgeç</button>`);
    const sheet=document.getElementById("modalBody");
    const oku=()=>{
      y.set=Math.max(1,Math.min(20,+sheet.querySelector("#nSet").value||3));
      y.tekrar=sheet.querySelector("#nTek").value.trim()||"10";
      y.mola=Math.max(0,Math.min(600,+sheet.querySelector("#nMola").value||60));
    };
    sheet.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ oku(); secilen=b.dataset.p; ciz(); });
    sheet.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ oku(); y.tip=b.dataset.t; ciz(); });
    sheet.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ oku(); y.faz=b.dataset.f; ciz(); });
    sheet.querySelector("#nOk").onclick=async()=>{
      oku();
      if(seansaMi){
        const h={ex:exId,set:y.set,tekrar:y.tekrar,mola:y.mola,tip:y.tip,faz:y.faz};
        state.active.hareketler.push(h);
        state.active.kayitlar.push(kayitOlustur(h,y.set));
        state.exIndex=state.active.hareketler.length-1;   // yeni harekete geç
        await saveAll();
        modalKapat();
        toast(exAd(exId)+" antrenmana eklendi");
        state.secici=null; state.openEx=null; state.tab="workout";
        render(); scrollTo(0,0);
        return;
      }
      const p=progById(secilen);
      if(!p){ toast("Program bulunamadı"); return; }
      p.hareketler.push({ex:exId,set:y.set,tekrar:y.tekrar,mola:y.mola,tip:y.tip,faz:y.faz});
      p.duzenlendi=Date.now();
      await saveAll();
      modalKapat();
      toast(exAd(exId)+" → "+p.ad);
      if(state.secici){ state.secici=null; state.openEx=null; state.duzenle=p.id; state.tab="programs"; }
      render(); scrollTo(0,0);
    };

/* --- DİNLENME VE SÜRE SAYACI --- */
/* Aynı tam ekran sayaç iki iş görüyor: setler arası dinlenme, ve plank gibi
   süreli hareketlerde setin kendisi. Fark etiketlerde ve bitişte olanda. */
/* --- BİLDİRİM ---
   Sayaç bittiğinde uygulama arka plandaysa bildirim gönderir. Android'de
   new Notification() desteklenmiyor, service worker üzerinden göndermek
   gerekiyor; masaüstünde ikisi de çalışıyor, SW yoksa geri düşüyoruz. */
function bildirimDurum(){
  if(!("Notification" in window)) return "desteklenmiyor";
  return {granted:"verildi", denied:"reddedildi", "default":"sorulmadı"}[Notification.permission] || Notification.permission;
}
async function bildirimGonder(baslik,govde){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const ayar={body:govde, icon:"icon-192.png", badge:"icon-192.png",
              tag:"salon-sayac", renotify:true, vibrate:[120,80,120]};
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){ await reg.showNotification(baslik,ayar); return; }
  }catch(e){}
  try{ new Notification(baslik,ayar); }catch(e){}
}

/* --- AYRI PENCERE ---
   Document Picture-in-Picture: sayacı, diğer pencerelerin üstünde duran
   küçük bir pencereye taşır. Masaüstü Chrome/Edge'de çalışır. Android'de
   tarayıcılar bir web sayfasının başka uygulamaların üstünde durmasına izin
   vermiyor; orada düğme hiç görünmüyor. */
let pipPencere=null;
function pipDestekli(){ return "documentPictureInPicture" in window; }
function pipGuncelle(){
  if(!pipPencere) return;
  const d=pipPencere.document;
  const yaz=(id,v)=>{ const e=d.getElementById(id); if(e) e.textContent=v; };
  yaz("l", document.getElementById("restLbl").textContent);
  yaz("n", document.getElementById("restNum").textContent);
  const alt=document.getElementById("restNext");
  yaz("a", alt.dataset.tam || alt.textContent);
}
async function pipAc(){
  if(!pipDestekli()){ toast("Bu tarayıcı ayrı pencereyi desteklemiyor"); return; }
  if(pipPencere){ pipPencere.focus(); return; }
  try{
    const w=await window.documentPictureInPicture.requestWindow({width:260,height:200});
    const st=w.document.createElement("style");
    st.textContent=`body{margin:0;height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;background:#141A1F;color:#E8EEF2;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;user-select:none}
      #l{color:#8D9BA8;font-size:13px;letter-spacing:.05em}
      #n{font-size:76px;font-weight:700;line-height:1;color:#E0A32E;font-variant-numeric:tabular-nums}
      #a{color:#8D9BA8;font-size:12px;text-align:center;padding:0 12px}`;
    w.document.head.appendChild(st);
    w.document.body.innerHTML=`<div id="l"></div><div id="n">0</div><div id="a"></div>`;
    w.addEventListener("pagehide",()=>{ pipPencere=null; });
    pipPencere=w;
    pipGuncelle();
  }catch(e){ toast("Ayrı pencere açılamadı"); }
}

/* Sayaç duvar saatine göre çalışır. Tarayıcı arka plandaki sekmenin
   setInterval'ini kıstığında geri sayım kaymaz; uygulamaya dönünce doğru
   değere atlar. Bitiş anı restBitis'te tutulur, tik sayısında değil. */
function sayacCiz(){
  const kalan=Math.max(0, Math.round((restBitis-Date.now())/1000));
  document.getElementById("restNum").textContent=kalan;
  pipGuncelle();
  if(kalan<=0) sayacKapat(true);
}
function sayacAc(tip,sn,not,bitince,onizleme){
  sayacTipi=tip;
  sayacBitti=bitince||null;
  sayacBas=Date.now();
  restBitis=Date.now()+sn*1000;
  document.getElementById("restLbl").textContent = tip==="sure" ? "Süre" : "Dinlenme";
  document.getElementById("restSkip").textContent = tip==="sure" ? "Bitir" : "Devam et";
  const alt=document.getElementById("restNext");
  alt.textContent=not||"";
  onizlemeYaz(onizleme, alt);
  document.getElementById("rest").classList.remove("hidden");
  clearInterval(restTimer);
  sayacCiz();
  restTimer=setInterval(sayacCiz,250);
}
/* Geçen süreyi duvar saatinden ölçüyoruz; "+15 sn" ve erken bitirme
   ikisinde de gerçek süre kaydedilsin diye. */
function sayacKapat(suresiDoldu){
  clearInterval(restTimer);
  document.getElementById("rest").classList.add("hidden");
  if(suresiDoldu){
    if(navigator.vibrate) navigator.vibrate([120,80,120]);
    if(pipPencere){
      const l=pipPencere.document.getElementById("l");
      if(l) l.textContent="Bitti";
    }
    /* Ekrandaysan zaten görüyorsun; bildirim sadece arka plandayken. */
    if(state.bildirim && document.hidden){
      bildirimGonder(sayacTipi==="sure" ? "Süre doldu" : "Dinlenme bitti",
                     document.getElementById("restNext").textContent || "Salon Defteri");
    }
  }
  const bit=sayacBitti; sayacBitti=null;
  if(bit) bit(Math.max(1,Math.round((Date.now()-sayacBas)/1000)));
}
function startRest(sn,not,onizleme){ sayacAc("dinlenme",sn,not,null,onizleme); }

/* Önizleme kartını doldurur. Ayrı pencere yalnızca metni gösterdiği için
   tam metni restNext üzerinde saklıyoruz. */
function onizlemeYaz(bilgi, altEl){
  const kutu=document.getElementById("restOnizleme");
  const e=bilgi&&bilgi.ex?EX[bilgi.ex]:null;
  if(!bilgi||!e){
    kutu.classList.add("hidden");
    altEl.dataset.tam=altEl.textContent;
    return;
  }
  kutu.classList.remove("hidden");
  /* Medyasi olmayan hareketlerde (c003-c005) kare, bas harfli yer tutucuya doner. */
  const plaka=kutu.querySelector(".plate"), img=document.getElementById("restImg");
  if(medyaVar(e)){ plaka.classList.remove("bos"); img.classList.remove("hidden"); img.src=exImg(e); }
  else{ plaka.classList.add("bos"); img.classList.add("hidden"); img.removeAttribute("src"); }
  plaka.dataset.harf=basHarf(e);
  document.getElementById("restAd").textContent=e.n;
  document.getElementById("restAlt").textContent=bilgi.alt||"";
  altEl.dataset.tam=(altEl.textContent?altEl.textContent+": ":"")+e.n;
}
function startHold(sn,not,bitince){ sayacAc("sure",sn,not,bitince); }
document.getElementById("restSkip").onclick=()=>sayacKapat(false);
document.getElementById("restPip").onclick=pipAc;
if(pipDestekli()) document.getElementById("restPip").classList.remove("hidden");
document.getElementById("restPlus").onclick=()=>{ restBitis+=15000; sayacCiz(); };
/* Arka plandan dönünce sayaç beklemeden doğru değere atlasın. */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && restTimer) sayacCiz(); });

/* --- İSTATİSTİK --- */
function donemBaslangic(){
  const now=new Date();
  if(state.donem==="hafta") return haftaBasi(now);
  if(state.donem==="ay") return new Date(now.getFullYear(),now.getMonth(),1);
  return new Date(2000,0,1);
}
function renderStats(){
  document.getElementById("title").textContent="İstatistik";
  const bas=donemBaslangic();
  const ss=state.sessions.filter(s=>new Date(s.tarih)>=bas);
  const setSay=ss.reduce((a,s)=>a+s.kayitlar.filter(anaMi).reduce((b,k)=>b+k.setler.length,0),0);
  const sureDk=Math.round(ss.reduce((a,s)=>a+(s.sure||0),0)/60);
  const hacim=Math.round(ss.reduce((a,s)=>a+(s.hacim||0),0));
  const ortDk=ss.length?Math.round(sureDk/ss.length):0;
  const tekrarSay=ss.reduce((a,s)=>a+s.kayitlar.filter(anaMi).reduce((b,k)=>b+k.setler.reduce((c,x)=>c+(x.tekrar||0),0),0),0);

  // beslenme
  const gunKeys=Object.keys(state.meals).filter(k=>keyToDate(k)>=bas).sort();
  let topP=0,topK=0,hedefTutan=0;
  gunKeys.forEach(k=>{ const g=gunToplam(k); topP+=g.p; topK+=g.k; if(g.p>=state.hedefProtein) hedefTutan++; });
  const ortP=gunKeys.length?Math.round(topP/gunKeys.length):0;
  const ortK=gunKeys.length?Math.round(topK/gunKeys.length):0;

  const enIyi={};
  ss.forEach(s=>s.kayitlar.forEach(k=>k.setler.forEach(x=>{
    const skor=(x.kg||0)*1000+(x.tekrar||0);
    if(!enIyi[k.id]||skor>enIyi[k.id].skor) enIyi[k.id]={skor,kg:x.kg,tekrar:x.tekrar,tip:k.tip||tipOf(k.id)};
  })));

  let bars=[];
  if(state.donem==="tum"){
    const b=new Date();
    for(let i=5;i>=0;i--){
      const d=new Date(b.getFullYear(),b.getMonth()-i,1), son=new Date(d.getFullYear(),d.getMonth()+1,1);
      bars.push({etiket:AYLAR[d.getMonth()], n:state.sessions.filter(s=>{const x=new Date(s.tarih);return x>=d&&x<son;}).length});
    }
  }else{
    const b=new Date();
    for(let i=7;i>=0;i--){
      const h=haftaBasi(new Date(b.getTime()-i*7*864e5)), son=new Date(h.getTime()+7*864e5);
      bars.push({etiket:h.getDate()+"."+(h.getMonth()+1), n:state.sessions.filter(s=>{const d=new Date(s.tarih);return d>=h&&d<son;}).length});
    }
  }
  const enB=Math.max(1,...bars.map(b=>b.n));

  // son 7 gün protein
  let pBars=[];
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*864e5), k=gunKey(d);
    pBars.push({etiket:GUNLER[d.getDay()][0], p:gunToplam(k).p});
  }
  const enP=Math.max(state.hedefProtein,...pBars.map(x=>x.p));

  view.innerHTML=`
    <div class="seg">
      <button data-d="hafta" class="${state.donem==="hafta"?"on":""}">Bu hafta</button>
      <button data-d="ay" class="${state.donem==="ay"?"on":""}">Bu ay</button>

    </div>

    <div class="stats">
      <div class="stat"><b>${ss.length}</b><span>antrenman</span></div>
      <div class="stat"><b>${sureDk}</b><span>dakika</span></div>
      <div class="stat"><b>${setSay}</b><span>set</span></div>
    </div>

    <div class="card">
      <h3>${state.donem==="tum"?"Aylara göre":"Haftalara göre"} antrenman</h3>
      <div class="bars">${bars.map(b=>`<div><i class="${b.n?"":"empty"}" style="height:${b.n?Math.round(b.n/enB*88)+"%":"3px"}"></i><small>${b.etiket}</small></div>`).join("")}</div>
    </div>

    <div class="card">
      <h3>Beslenme</h3>
      <div class="bars" style="height:90px">${pBars.map(x=>`<div><i class="p ${x.p?"":"empty"}" style="height:${x.p?Math.round(x.p/enP*88)+"%":"3px"}"></i><small>${x.etiket}</small></div>`).join("")}</div>
      <p class="muted small" style="margin:2px 0 10px">Son 7 gün protein</p>

      <div class="kv"><span>Ortalama günlük kalori</span><b>${ortK} kcal</b></div>
      <div class="kv"><span>Hedefi tutturduğun gün</span><b>${hedefTutan} / ${gunKeys.length}</b></div>

    <div class="card">

    <button class="btn ghost sm" id="goHist">Antrenman geçmişi</button>`;
  view.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ state.donem=b.dataset.d; renderStats(); });
  document.getElementById("goHist").onclick=()=>{ state.tab="history"; render(); scrollTo(0,0); };
}

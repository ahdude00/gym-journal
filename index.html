      <p class="muted small">Veriler telefon hafızasına yazılır ve uygulama açılınca otomatik okunur. İstersen antrenman bitince İndirilenler klasörüne yedek dosya da iner.</p>
      <div class="switch"><span>Bitirince dosyaya da yaz</span><button id="tgl" class="${state.otoDosya?"on":""}"><i></i></button></div>
      <div class="kv"><span>Kayıt yeri</span><b>${kayitYeri}</b></div>
      <div class="kv"><span>Kayıtlı antrenman</span><b>${state.sessions.length}</b></div>
      <div class="kv"><span>Beslenme kaydı olan gün</span><b>${gunSay}</b></div>
    </div>
    <div class="card">
      <h3>Fotoğraf analizi</h3>
      <p class="muted small">Yemek fotoğrafından protein ve kalori tahmini. Anahtar yalnızca bu cihazda saklanır, yedek dosyasına yazılmaz.</p>
      <div class="seg sm" style="margin-top:10px">
        ${Object.keys(SAGLAYICI).map(k=>`<button data-sag="${k}" class="${state.saglayici===k?"on":""}">${SAGLAYICI[k].ad}</button>`).join("")}
      </div>
      <p class="muted small" style="margin-top:8px">${aktifSag().ad} — ${aktifSag().ucretsiz}</p>
      <div class="filters" style="margin-top:8px">
        <select id="apiModel">
          ${aktifSag().modeller.map(m=>{
            const dolu=(state.kotaDolu||{})[m.id]===gunKey();
            const secili=((state.modeller||{})[state.saglayici]||aktifSag().varsayilanModel)===m.id;
            return `<option value="${m.id}" ${secili?"selected":""}>${m.ad}${m.not?" · "+m.not:""}${dolu?" · bugün doldu":""}</option>`;
          }).join("")}
        </select>
      </div>
      <p class="muted small" style="margin-top:6px">Buradan başlanır; kota dolarsa alttaki modele kendiliğinden geçilir.
        Kendi limitlerini <a href="https://aistudio.google.com/rate-limit" target="_blank" rel="noopener">AI Studio kota sayfasından</a> görebilirsin.</p>
      <div class="kv"><span>Anahtar</span><b>${apiAnahtar()?"kayıtlı":"yok"}</b></div>
      <div class="row" style="gap:8px;margin-top:12px">
        <button class="btn quiet sm" id="apiDuzenle">${apiAnahtar()?"Anahtarı değiştir":"Anahtar gir"}</button>
        <button class="btn quiet sm" id="apiSina" ${apiAnahtar()?"":"disabled"}>Bağlantıyı sına</button>
      </div>
    </div>
    <div class="card">
      <h3>Dinlenme bildirimi</h3>
      <p class="muted small">Uygulama arka plandayken sayaç bitince bildirim gönderir. Telefonda başka bir uygulamadayken işe yarar.</p>
      <div class="switch"><span>Sayaç bitince bildir</span><button id="tglBildirim" class="${state.bildirim?"on":""}"><i></i></button></div>
      <div class="kv"><span>İzin durumu</span><b>${bildirimDurum()}</b></div>
      ${("Notification" in window) && Notification.permission==="denied"
        ? `<p class="muted small" style="margin:8px 0 0">Bildirim izni tarayıcı ayarlarından reddedilmiş; oradan izin vermen gerekiyor.</p>` : ""}
    </div>
    <div class="card">
      <h3>Hareket veritabanı</h3>
      <div class="kv"><span>Hareket sayısı</span><b>${RAW.length}</b></div>
      <div class="kv"><span>Programların</span><b>${state.programs.length}</b></div>
      <button class="btn quiet sm" id="goProg2" style="margin-top:12px">Programları düzenle</button>
      ${ATIF}
    </div>
    <div class="card">
      <h3>Yedek al</h3>
      <p class="muted small">Antrenman geçmişin, programların ve beslenme kayıtların tek dosyaya iner.</p>
      <button class="btn" id="exp">Dosyaya aktar</button>
    </div>
    <div class="card">
      <h3>Dosyadan geri yükle</h3>
      <p class="muted small">Kayıtlar mevcutlara eklenir, aynı gün iki kez yazılmaz.</p>
      <input type="file" id="imp" accept="application/json,.json" class="text">
    </div>`;
  document.getElementById("back").onclick=()=>{ state.tab="home"; render(); };
  view.querySelectorAll("[data-tsec]").forEach(b=>b.onclick=async()=>{
    state.tema=temaUygula(b.dataset.tsec);
    await saveAll();
    renderData();
    toast(TEMALAR[state.tema].ad+" teması");
  });
  document.getElementById("apiDuzenle").onclick=anahtarSor;
  document.getElementById("apiSina").onclick=baglantiSina;
  view.querySelectorAll("[data-sag]").forEach(b=>b.onclick=async()=>{
    state.saglayici=b.dataset.sag; await saveAll(); renderData();
  });
  document.getElementById("apiModel").onchange=async e=>{
    state.modeller=Object.assign({},state.modeller,{[state.saglayici]:e.target.value});
    await saveAll(); renderData(); toast(e.target.value+" seçildi");
  };
  document.getElementById("goProg2").onclick=()=>{ state.tab="programs"; render(); scrollTo(0,0); };
  document.getElementById("hedef").onchange=async e=>{ const v=+e.target.value; if(v>=50&&v<=400){ state.hedefProtein=v; await saveAll(); toast("Hedef "+v+" g olarak kaydedildi"); } };
  document.getElementById("tgl").onclick=async()=>{ state.otoDosya=!state.otoDosya; await saveAll(); renderData(); };
  /* İzin isteme kullanıcı hareketi gerektirdiği için tam burada yapılıyor. */
  document.getElementById("tglBildirim").onclick=async()=>{
    if(state.bildirim){ state.bildirim=false; await saveAll(); renderData(); return; }
    if(!("Notification" in window)){ toast("Bu tarayıcı bildirimi desteklemiyor"); return; }
    let izin=Notification.permission;
    if(izin==="default"){ try{ izin=await Notification.requestPermission(); }catch(e){ izin="denied"; } }
    if(izin!=="granted"){ toast("Bildirim izni verilmedi"); renderData(); return; }
    state.bildirim=true; await saveAll(); renderData();
    toast("Sayaç bitince bildirim gelecek");
  };
  document.getElementById("exp").onclick=()=>dosyayaAktar(false);
  document.getElementById("imp").onchange=dosyadanYukle;
}
function dosyayaAktar(sessiz){
  try{
    const blob=new Blob([JSON.stringify({v:3,hedefProtein:state.hedefProtein,programs:state.programs,sessions:state.sessions,meals:state.meals},null,1)],{type:"application/json"});
    const d=new Date(), ad=`salon-defteri-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ad; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(!sessiz) toast("İndirilenler klasörüne kaydedildi");
  }catch(e){ if(!sessiz) toast("Dosya kaydedilemedi"); }
}

function dosyadanYukle(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result), gelen=Array.isArray(d)?d:(d.sessions||[]);
      const varOlan=new Set(state.sessions.map(s=>s.id)); let eklenen=0;
      gelen.forEach(s=>{ if(s&&s.id&&!varOlan.has(s.id)){ state.sessions.push(s); eklenen++; } });
      state.sessions.sort((a,b)=>new Date(a.tarih)-new Date(b.tarih));
      let gun=0;
      if(d.meals) Object.keys(d.meals).forEach(k=>{ if(!state.meals[k]){ state.meals[k]=d.meals[k]; gun++; } });
      let prog=0;
      if(Array.isArray(d.programs)){
        const pid=new Set(state.programs.map(p=>p.id));
        d.programs.forEach(p=>{ if(p&&p.id&&!pid.has(p.id)&&Array.isArray(p.hareketler)){ state.programs.push(p); prog++; } });
      }
      if(d.hedefProtein) state.hedefProtein=d.hedefProtein;
      migrasyonYap();
      await saveAll();
      toast(`${eklenen} antrenman, ${gun} beslenme günü, ${prog} program eklendi`);
      state.tab="home"; render();
    }catch(err){ toast("Dosya okunamadı. Doğru json dosyasını seçtiğinden emin ol."); }
  };
  r.readAsText(f);
}
/* ==========================================================
   6. BAŞLAT
   ========================================================== */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    state.tab=b.dataset.tab;
    state.openEx=null; state.besinTarih=null;
    state.duzenle=null; state.secici=null;
    render(); scrollTo(0,0);
  };
});
/* Uygulama arka plana alınırken ya da kapanırken yarım antrenmanı yaz. */
document.addEventListener("visibilitychange",()=>{ if(document.hidden && state.active) saveAll(); });
window.addEventListener("pagehide",()=>{ if(state.active) saveAll(); });

(async()=>{
  await loadAll();
  if(state.active){
    saatBaslat();
    /* Sayaç kendiliğinden çalışıyor gibi görünmesin: neden sürdüğünü söyle. */
    const gecen=Math.floor((Date.now()-state.active.baslangic)/60000);
    setTimeout(()=>toast(`Yarım kalan antrenman sürüyor · ${gecen} dk önce başladı`),400);
  }
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) { console.log("SW yok:", e); });
  });
}
</script>
</body>

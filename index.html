/* Tek bir set satiri. Hem ilk cizimde hem "+ Set ekle" ile kullaniliyor. */
function setSatiri(st,i,h,birim){
  return `
          <div class="setrow ${st.done?"done":""}">
            <div class="setno">${i+1}</div>
            ${h.tip==="kg"
              ? `<div class="kgbox">
                   <button type="button" data-kg="-1" data-set="${i}" aria-label="2,5 kg azalt">−</button>
                   <input type="number" inputmode="decimal" step="0.5" data-f="kg" data-set="${i}" value="${st.kg??""}">
                   <button type="button" data-kg="1" data-set="${i}" aria-label="2,5 kg artır">+</button>
                 </div>`
              : `<div class="tick" style="border-style:dashed;font-size:13px">${h.tip==="sure"?"süre":"vücut"}</div>`}
            <input type="number" inputmode="numeric" data-f="tekrar" data-set="${i}" value="${st.tekrar??""}">
            <button class="tick" data-done="${i}">${st.done?"✓":"○"}</button>
          </div>`;
}
/* Ustteki birim satiri. Satirlarin disinda duruyor: "- Set cikar" sondaki
   cocugu siliyor, basliga dokunmasin. */
function setBasligi(h,birim){
  return `<div class="sethead"><span>Set</span>`
       + `<span>${h.tip==="kg"?"kg":""}</span><span>${birim}</span><span></span></div>`;
}
/* Rozet, programdaki hedefi degil ekrandaki gercek set sayisini gosterir. */
function setEtiketi(kayit,h){
  return kayit.setler.length+" × "+h.tekrar+(h.tip==="sure"?" sn":"");
}
function renderWorkout(){
  if(!state.active){
    clearInterval(clockTimer);
    document.getElementById("title").textContent="Antrenman";
    const prog=sonrakiProgram();
    if(!prog){
      view.innerHTML=`
        <div class="card">
          <h2>Henüz program yok</h2>
          <p class="muted small" style="margin-top:6px">Bir program oluştur, sonra Hareketler sekmesinden içine hareket ekle.</p>
          <button class="btn" id="goProg" style="margin-top:12px">Program oluştur</button>
        </div>`;
      document.getElementById("goProg").onclick=()=>{ state.tab="programs"; render(); scrollTo(0,0); };
      return;
    }
    const digerleri=state.programs.filter(p=>p.id!==prog.id);
    // haftanın günleri: antrenman yapılan günler işaretli
    const hb=haftaBasi(new Date()), bugun=gunKey();
    const yapilan=new Set(state.sessions.filter(s=>new Date(s.tarih)>=hb).map(s=>gunKey(new Date(s.tarih))));
    const serit=[0,1,2,3,4,5,6].map(i=>{
      const d=new Date(hb.getTime()+i*864e5), k=gunKey(d);
      return `<div class="${k===bugun?"bugun":""} ${yapilan.has(k)?"yapildi":""}"><small>${GUNLER[d.getDay()]}</small><b>${d.getDate()}</b></div>`;
    }).join("");
    const haftaHedef=Math.max(1,state.programs.filter(p=>!p.opsiyonel).length);
    document.getElementById("ust").textContent=`Bu hafta ${yapilan.size} / ${haftaHedef} tamamlandı`;
    view.innerHTML=`
      <div class="gunserit" aria-label="Bu hafta">${serit}</div>
      <div class="card">
        <div class="kbas"><span class="ek">Sıradaki · ${progKisa(prog.ad)}</span><span class="pill on">${progOzet(prog).replace(/^Opsiyonel · /,"")}</span></div>
        <h2 style="margin-top:8px">${progBaslik(prog.ad)}</h2>
        ${programNotu(prog)}
        <p class="muted small" style="margin:6px 0 4px">${state.sessions.length?"Son antrenman: "+tarihTR(state.sessions[state.sessions.length-1].tarih):"İlk antrenmanın. Kutulardaki değerler başlangıç önerisi — kolay gelirse artır."}</p>
        ${prog.hareketler.length? prog.hareketler.map(h=>{
            const e=EX[h.ex], sk=sonKayit(h.ex), o=oneriOf(h.ex), br=h.tip==="sure"?" sn":"";
            const oner = sk ? ((sk.kg?sk.kg+" kg × ":"")+sk.tekrar+br)
                            : ((o.kg?o.kg+" kg × ":"")+(o.tekrar!=null?o.tekrar:10)+br);
            return `<div class="exitem">
              ${plakaIc(e,52)}
              <span class="nm"><b>${exAd(h.ex)}</b><span class="muted small">${sk?"Son: ":"Öneri: "}${oner}</span></span>
              <span class="muted small" style="font-weight:800">${h.set} set</span>
            </div>`;}).join("")
        : `<p class="muted small">Bu programda hareket yok.</p>`}
        <button class="btn ikon" id="startBtn" style="margin-top:14px" ${prog.hareketler.length?"":"disabled"}>${IKON.oynat}Antrenmanı başlat</button>
      </div>
      ${digerleri.length?`<h3 class="bolumbas">Diğer programlar</h3>
      <div class="card" style="padding:6px 18px">
        ${digerleri.map(p=>`<div class="exitem">
          <span class="progbas ${p.opsiyonel?"ops":""}">${p.opsiyonel?"+":(String(progKisa(p.ad)).match(/\d+/)||[progKisa(p.ad).charAt(0)])[0]}</span>
          <span class="nm"><b>${progBaslik(p.ad)}</b><span class="muted small">${progOzet(p)}</span></span>
          <button class="minibtn" data-start="${p.id}">Başlat</button></div>`).join("")}
      </div>`:""}
      <button class="satirlink" id="goHist">${IKON.saat.replace("<svg",'<svg class="ok" style="stroke:var(--done)"')}<span>Antrenman geçmişi</span><span class="muted small" style="flex:none">${state.sessions.length} kayıt</span>${IKON.ok}</button>
      <button class="satirlink" id="goProg">${IKON.kalem.replace("<svg",'<svg class="ok" style="stroke:var(--accent)"')}<span>Programları düzenle</span>${IKON.ok}</button>`;
    const sb=document.getElementById("startBtn");
    if(prog.hareketler.length) sb.onclick=()=>startSession(prog);
    view.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startSession(progById(b.dataset.start)));
    document.getElementById("goProg").onclick=()=>{ state.tab="programs"; render(); scrollTo(0,0); };
    document.getElementById("goHist").onclick=()=>{ state.tab="history"; render(); scrollTo(0,0); };
    return;
  }

  const s=state.active, h=s.hareketler[state.exIndex], e=EX[h.ex], kayit=s.kayitlar[state.exIndex];
  const o=ov(h.ex), birim=h.tip==="sure"?"sn":"tekrar";
  const gecen=gecenSeferMetni(h.ex,h.tip);
  document.getElementById("title").textContent=progKisa(s.program.ad);
  view.innerHTML=`
    ${programNotu(s.program)}
    <p class="muted small" style="margin:0 0 6px">Hareket ${state.exIndex+1} / ${s.hareketler.length}</p>
    <div class="progress">${s.hareketler.map((x,i)=>
      `<button type="button" data-git="${i}" class="${i<=state.exIndex?"on":""} ${i===state.exIndex?"simdi":""}"
        aria-label="${i+1}. hareket: ${String(exAd(x.ex)).replace(/"/g,"&quot;")}"
        title="${i+1}. ${String(exAd(x.ex)).replace(/"/g,"&quot;")}"></button>`).join("")}</div>
    <div class="card">
      <div class="stage">
        ${sahneIc(e)}
        <div class="stage-cap"><span>${e?kasTR(e.t):""}</span><span>${e?ekipTR(e.q):""}</span></div>
      </div>
      <div class="row between" style="margin-top:12px"><h2>${exAd(h.ex)}</h2><span class="pill" id="setPill">${setEtiketi(kayit,h)}</span></div>
      <p class="muted small" style="margin-top:4px">${o&&o.ipucu?o.ipucu:(e?bolgeTR(e.c):"")}${gecen?" · "+gecen:" · İlk kez yapıyorsun — kutulardaki sayılar öneri, değiştirebilirsin"}</p>
      ${setBasligi(h,birim)}
      <div id="setler">
        ${kayit.setler.map((st,i)=>setSatiri(st,i,h,birim)).join("")}
      </div>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn quiet sm" id="setSil">− Set çıkar</button>
        <button class="btn quiet sm" id="setEkle">+ Set ekle</button>
      </div>
      ${e?`<details style="margin-top:12px"><summary class="muted small">Nasıl yapılır</summary>
        <ol class="steps small" style="margin-top:8px">${e.d.map(a=>`<li>${a}</li>`).join("")}</ol>
        ${o&&o.hatalar?`<h3 style="margin-top:12px">Sık yapılan hatalar</h3>
        <ul class="warn small">${o.hatalar.map(a=>`<li>${a}</li>`).join("")}</ul>`:""}</details>`:""}
    </div>
    <div class="row" style="gap:8px">
      <button class="btn quiet" id="prevEx" ${state.exIndex===0?"disabled":""}>Önceki</button>
      <button class="btn" id="nextEx">${state.exIndex===s.hareketler.length-1?"Son hareket":"Sonraki"}</button>
    </div>
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn ghost sm" id="exCikar">Hareketi çıkar</button>
      <button class="btn ghost sm" id="exEkle">+ Hareket ekle</button>
    </div>
    <button class="btn ghost" id="finish" style="margin-top:10px">Antrenmanı bitir</button>`;

  /* Dinleyiciler tek tek satirlara degil kapsayiciya baglaniyor: sonradan
     eklenen set satirlari icin yeniden baglama gerekmiyor, ve set
     isaretlenince tum ekrani yeniden cizmedigimiz icin GIF bastan baslamiyor. */
  const setKutu=document.getElementById("setler");
  setKutu.oninput=ev=>{
    const inp=ev.target;
    if(!inp.dataset||inp.dataset.f===undefined) return;
    kayit.setler[+inp.dataset.set][inp.dataset.f]= inp.value===""?null:+inp.value;
  };
  /* Seti tamamlar: sn verilirse gerçekleşen süreyi kutuya yazar. */
  const setiBitir=(i,sn)=>{
    const st=kayit.setler[i], satir=setKutu.querySelectorAll(".setrow")[i];
    if(sn!=null){
      st.tekrar=sn;
      const inp=satir.querySelector('[data-f="tekrar"]');
      if(inp) inp.value=sn;
    }
    st.done=true;
    satir.classList.add("done");
    satir.querySelector("[data-done]").textContent="✓";
    saveAll();
    const bilgi=sonrakiBilgi(s,state.exIndex,kayit);
    /* Mola 0 ise (isinma/soguma'da olabilir) dinlenme ekranini hic acma. */
    if(h.mola>0){
      startRest(h.mola, bilgi.baslik, bilgi);
      /* Serit ekranin altini kapatiyor ve tam da yeni isaretlenen satirin
         uzerine gelebiliyor. Siradaki seti (yoksa biten seti) goruntuye
         aliyoruz; satirin scroll-margin-bottom degeri serit + alt menu
         payini birakiyor, boylece kiloyu duzeltmek icin seridi kapatmak
         gerekmiyor. */
      if(document.getElementById("rest").classList.contains("serit")){
        /* Son satiri hedefliyoruz: scroll-margin payiyla birlikte TUM set
           listesi seridin ustune cikiyor, yalnizca siradaki set degil.
           "nearest" oldugu icin zaten goruntudeyse hic kaydirmaz. */
        const satirlar=setKutu.querySelectorAll(".setrow");
        const hedef=satirlar[satirlar.length-1];
        const yumusak=!matchMedia("(prefers-reduced-motion:reduce)").matches;
        if(hedef) hedef.scrollIntoView({behavior:yumusak?"smooth":"auto",block:"nearest"});
      }
    }
  };
  setKutu.onclick=ev=>{
    /* Kilo adimlayici. 2.5 kg: dambıl ve plaka artışlarının standart adımı.
       Yalnızca dokunulan seti değiştirir; başka bir set istersen onun
       kendi düğmelerini kullanırsın. İşaretli sette de çalışır - yanlış
       girilen ağırlık sonradan düzeltilebilsin diye. */
    const adim=ev.target.closest("[data-kg]");
    if(adim){
      const i=+adim.dataset.set, st=kayit.setler[i];
      const yeni=Math.max(0, Math.round(((+st.kg||0)+(+adim.dataset.kg)*2.5)*10)/10);
      st.kg=yeni;
      const inp=adim.closest(".setrow").querySelector('[data-f="kg"]');
      if(inp) inp.value=yeni;
      kaydetYakinda();
      return;
    }
    const b=ev.target.closest("[data-done]");
    if(!b) return;
    const i=+b.dataset.done, st=kayit.setler[i];
    if(st.done){                                  // işareti geri al
      st.done=false;
      b.closest(".setrow").classList.remove("done");
      b.textContent="○";
      saveAll();
      return;
    }
    /* Boş set işaretlenmesin: tekrar yazılmadan tiklenirse kayıt sessizce
       0 hacimle düşer ve istatistik bozulur. Süreli harekette hedef boş
       kalabilir - startHold zaten programdaki değere düşüyor. */
    if(h.tip!=="sure"){
      const eksik = (st.tekrar==null || +st.tekrar<=0) ? "tekrar"
                  : (h.tip==="kg" && st.kg==null)      ? "kg" : null;
      if(eksik){
        const inp=b.closest(".setrow").querySelector('[data-f="'+eksik+'"]');
        if(inp){ inp.focus(); try{ inp.select(); }catch(e){} }
        toast(eksik==="kg" ? "Önce ağırlığı gir" : "Önce tekrar sayısını gir");
        return;
      }
    }
    /* Plank gibi süreli hareketlerde tik önce sayacı başlatır; set, süre
       dolunca ya da "Bitir"e basılınca geçen süreyle kapanır. */
    if(h.tip==="sure"){
      const hedef=Math.max(1, +st.tekrar || parseInt(h.tekrar,10) || 30);
      startHold(hedef, `${exAd(h.ex)} · set ${i+1}`, gecen=>setiBitir(i,gecen));
      return;
    }
    setiBitir(i,null);
  };
  const setSilBtn=document.getElementById("setSil");
  const setDurum=()=>{
    document.getElementById("setPill").textContent=setEtiketi(kayit,h);
    setSilBtn.disabled = kayit.setler.length<=1;
  };
  setDurum();
  document.getElementById("setEkle").onclick=()=>{
    if(kayit.setler.length>=20){ toast("Bir harekette en fazla 20 set"); return; }
    const son=kayit.setler[kayit.setler.length-1]||{};
    kayit.setler.push({kg:son.kg??null, tekrar:son.tekrar??null, done:false});
    const i=kayit.setler.length-1;
    setKutu.insertAdjacentHTML("beforeend", setSatiri(kayit.setler[i],i,h,birim));
    setDurum(); saveAll();
  };
  /* Sondaki seti cikarir; en az bir set kalir. */
  setSilBtn.onclick=()=>{
    if(kayit.setler.length<=1) return;
    const cikan=kayit.setler.pop();
    setKutu.lastElementChild.remove();
    setDurum(); saveAll();
    if(cikan.done) toast("İşaretli set çıkarıldı");
  };
  /* Ilerleme cubugundan dogrudan atlama: 16 hareketlik bir gunde uzaktaki
     bir harekete gitmek icin "Sonraki"ye defalarca basmak gerekmesin. */
  view.querySelectorAll("[data-git]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.git;
    if(i===state.exIndex) return;
    state.exIndex=i; saveAll(); renderWorkout(); scrollTo(0,0);
  });
  document.getElementById("prevEx").onclick=()=>{ if(state.exIndex>0){state.exIndex--;saveAll();renderWorkout();scrollTo(0,0);} };
  document.getElementById("nextEx").onclick=()=>{
    if(state.exIndex<s.hareketler.length-1){ state.exIndex++; saveAll(); renderWorkout(); scrollTo(0,0); }
    else bitirSor();
  };
  /* Antrenman sürerken programa değil, yalnızca bu seansa dokunur. */
  document.getElementById("exEkle").onclick=()=>{
    state.secici={seans:true};
    state.tab="guide"; state.kat.limit=60; state.openEx=null;
    render(); scrollTo(0,0);
  };
  document.getElementById("exCikar").onclick=()=>{
    if(s.hareketler.length<=1){ toast("Antrenmanda en az bir hareket kalmalı"); return; }
    const cikar=()=>{
      s.hareketler.splice(state.exIndex,1);
      s.kayitlar.splice(state.exIndex,1);
      if(state.exIndex>=s.hareketler.length) state.exIndex=s.hareketler.length-1;
      saveAll(); renderWorkout(); scrollTo(0,0);
      toast("Hareket antrenmandan çıkarıldı");
    };
    const yapilan=kayit.setler.filter(x=>x.done).length;
    if(!yapilan) return cikar();
    modalAc(`
      <h2>Hareketi çıkar</h2>
      <p class="muted small">${exAd(h.ex)} için ${yapilan} işaretli set var, bu kayıt silinecek.</p>
      <button class="btn danger" id="hEvet">Çıkar</button>
      <button class="btn ghost" id="hHayir">Vazgeç</button>`);
    document.getElementById("hEvet").onclick=()=>{ modalKapat(); cikar(); };
    document.getElementById("hHayir").onclick=modalKapat;
  };
  document.getElementById("finish").onclick=bitirSor;
}

/* Bir hareket icin seans kaydi. adet verilmezse gecen antrenmandaki set
   sayisi, o da yoksa programdaki hedef kullanilir. Kilo ve tekrar her zaman
   gecen antrenmandan set set tasinir. */
function kayitOlustur(h,adet,hedefleriKullan=false){
  const onceki=hedefleriKullan ? null : sonKayitBilgi(h.ex), o=oneriOf(h.ex);
  const gecmis = onceki ? onceki.setler : null;
  const n = adet!=null ? adet : (gecmis ? gecmis.length : h.set);
  return { id:h.ex, tip:h.tip, setler:Array.from({length:n},(_,i)=>{
    const ref = gecmis ? (gecmis[i]||gecmis[gecmis.length-1]) : null;
    const kg = h.tip==="kg" ? (ref&&ref.kg!=null?ref.kg:(o.kg!=null?o.kg:null)) : null;
    const hedef=String(h.tekrar||"").match(/^\d+/);
    const tk = ref&&ref.tekrar!=null ? ref.tekrar : (hedef ? +hedef[0] : (o.tekrar!=null?o.tekrar:null));
    return {kg,tekrar:tk,done:false};
  })};
}

function startSession(prog){
  if(!prog||!prog.hareketler.length) return;
  /* Program anlık kopyalanır: seans sürerken programı düzenlemek seansı bozmaz. */
  /* mola: 0 gecerli bir deger (isinma/soguma'da molasiz gecis istenebilir),
     o yuzden "||60" yerine null kontrolu. */
  const hareketler=prog.hareketler.map(h=>({
    ex:h.ex, set:Math.max(1,+h.set||1), tekrar:h.tekrar,
    mola:(h.mola==null ? 60 : Math.max(0,Math.min(600,+h.mola||0))),
    tip:h.tip||tipOf(h.ex)
  }));
  state.active={
    id:"s"+Date.now(), tarih:new Date().toISOString(),
    gun:prog.id, program:{id:prog.id,ad:prog.ad,not:prog.not,opsiyonel:prog.opsiyonel}, hareketler,
    baslangic:Date.now(), sure:0,
    /* Gecen antrenmanda ne yaptiysan onunla basla: set sayisi, kilo ve
       tekrar set set birebir tasinir. Programi o antrenmandan SONRA
       duzenlediysen programdaki hedef gecerli olur. */
    kayitlar:hareketler.map(h=>{
      /* Program duzenlemesi yalnizca SET SAYISINI belirler; kilo ve tekrar
         her zaman gecen antrenmandan gelir. */
      const onceki=sonKayitBilgi(h.ex);
      const programDahaYeni = prog.duzenlendi && (!onceki || prog.duzenlendi > Date.parse(onceki.tarih));
      return kayitOlustur(h, prog.opsiyonel || programDahaYeni ? h.set : null, !!prog.opsiyonel);
    })
  };
  state.exIndex=0; state.tab="workout"; state.duzenle=null; state.secici=null; state.openEx=null;
  saatBaslat();
  ekranAcikTut();
  render(); scrollTo(0,0);
}

/* Süre başlangıç anından hesaplanıyor, tik sayısından değil; uygulama arka
   planda kalsa da geri dönünce doğru süreyi gösterir. */
function saatBaslat(){
  clearInterval(clockTimer);
  const yaz=()=>{
    if(!state.active) return;
    const el=document.getElementById("clock");
    if(el) el.textContent=mmss(Math.floor((Date.now()-state.active.baslangic)/1000));
  };
  yaz();
  clockTimer=setInterval(yaz,1000);
}

function bitirSor(){
  const s=state.active; if(!s) return;
  const yapilan=s.kayitlar.reduce((a,k)=>a+k.setler.filter(x=>x.done).length,0);
  const sure=mmss(Math.floor((Date.now()-s.baslangic)/1000));
  modalAc(`
    <h2>Antrenmanı bitir</h2>
    <p class="muted small">${yapilan} set işaretledin · ${sure} sürdü.</p>
    ${yapilan?`<button class="btn" id="mSave">Kaydet ve bitir</button>`:`<p class="muted small">Hiç set işaretlemedin, kaydedecek bir şey yok.</p>`}
    <button class="btn quiet" id="mDrop">Kaydetmeden çık</button>
    <button class="btn ghost" id="mBack">Vazgeç, devam et</button>`);
  const sv=document.getElementById("mSave"); if(sv) sv.onclick=()=>{ modalKapat(); kaydetVeBitir(); };
  document.getElementById("mDrop").onclick=async()=>{
    modalKapat();
    state.active=null; clearInterval(clockTimer); ekranBirak();
    /* Diskteki yarım seans kopyasını da sil; yoksa her yenilemede geri gelir. */
    await saveAll();
    state.tab="home"; render(); toast("Antrenman kaydedilmedi");
  };
  document.getElementById("mBack").onclick=modalKapat;
}

async function kaydetVeBitir(){
  const s=state.active;
  s.sure=Math.floor((Date.now()-s.baslangic)/1000);
  s.kayitlar.forEach(k=>{ k.setler=k.setler.filter(x=>x.done); });
  s.kayitlar=s.kayitlar.filter(k=>k.setler.length);
  s.hacim=s.kayitlar.reduce((a,k)=>a+k.setler.reduce((b,x)=>b+((x.kg||0)*(x.tekrar||0)),0),0);
  delete s.hareketler;
  state.sessions.push(s);
  state.active=null;
  clearInterval(clockTimer);
  ekranBirak();
  const ok=await saveAll();
  if(state.otoDosya) dosyayaAktar(true);
  state.tab="stats"; render();
  toast(ok?`Kaydedildi · ${mmss(s.sure)}`:"Kaydedildi, ama telefon hafızası kapalı. Veri sekmesinden dosyaya aktar.");
}

  document.getElementById("back").onclick=()=>{ state.duzenle=null; render(); scrollTo(0,0); };
  const ad=document.getElementById("pAd");

     sekme değiştirildiğinde ad kaydedilmeden gidiyordu. Yazarken gecikmeli
     kaydediyoruz, boş bırakılırsa varsayılana odak çıkınca dönüyor. */
  ad.oninput=()=>{ p.ad=ad.value; kaydetYakinda(); };

    render(); scrollTo(0,0);

      <button class="btn danger" id="sEvet">Sil</button>

    document.getElementById("sEvet").onclick=async()=>{
      state.programs=state.programs.filter(x=>x.id!==p.id);
      await saveAll(); modalKapat(); state.duzenle=null; render(); toast("Program silindi");
    };
    document.getElementById("sHayir").onclick=modalKapat;
  };
}

/* Sürükleyerek sıralama.
   HTML5 drag-and-drop telefonda çalışmıyor, bu yüzden pointer olaylarıyla
   yapılıyor. Sürükleme sırasında yalnızca tutulan satır parmağı takip
   ediyor; diğerleri yerinde kalıyor ve bırakma yeri ince bir çizgiyle
   gösteriliyor. Satırları canlı kaydırmak daha gösterişli olurdu ama liste
   bölüm başlıklarıyla bölündüğü için o hesap kırılgan oluyor.
   Tutamak klavyeyle de çalışıyor: yukarı/aşağı ok tuşları hareketi taşır. */
function siralamaBagla(p, tasi){
  let satirlar=[], kaynak=-1, hedef=-1, basY=0, aktifSatir=null, cizgi=null;
  const sayfaY=ev=>ev.clientY+window.scrollY;   /* sürüklerken sayfa kayabilir */
  const liste=view.querySelector(".proglist");
  if(!liste) return;

  const temizle=()=>{
    view.querySelectorAll(".progrow").forEach(r=>{
      r.classList.remove("suruklenen");
      r.style.transform="";
    });
    if(cizgi){ cizgi.remove(); cizgi=null; }
  };
  /* İmleç hangi satırın önüne denk geliyor? Satırlar sürükleme boyunca
     yerinde durduğu için ölçüler başta bir kez alınıyor. */
  const hedefHesapla=y=>{
    for(let i=0;i<satirlar.length;i++) if(y<satirlar[i].orta) return i;
    return satirlar.length;
  };
  /* hedef, kaynak listeden çıkarılmadan ÖNCEki konuma göre; kaynak
     yukarıdaysa bir basamak kayıyor. */
  const varisIndeksi=()=>hedef>kaynak?hedef-1:hedef;
  const isaretle=()=>{
    if(!cizgi) return;
    if(varisIndeksi()===kaynak){ cizgi.style.display="none"; return; }  /* yerinde kalacak */
    cizgi.style.display="block";
    const son=satirlar[satirlar.length-1];
    const y = hedef>=satirlar.length ? son.alt : satirlar[hedef].ust;
    cizgi.style.top=(y-1.5)+"px";
  };

  view.querySelectorAll("[data-tut]").forEach(tut=>{
    tut.onpointerdown=ev=>{
      if(ev.button!=null && ev.button!==0) return;
      ev.preventDefault();
      kaynak=+tut.dataset.tut;
      aktifSatir=tut.closest(".progrow");
      basY=sayfaY(ev);
      /* ust/alt listeye göre (çizgiyi konumlandırmak için), orta sayfaya
         göre (imleçle karşılaştırmak için). İkisi de aynı anda alınıyor. */
      const lr=liste.getBoundingClientRect();
      satirlar=[...view.querySelectorAll(".progrow")].map(r=>{
        const b=r.getBoundingClientRect();
        return {ust:b.top-lr.top, alt:b.bottom-lr.top, orta:b.top+window.scrollY+b.height/2};
      });
      hedef=kaynak;
      aktifSatir.classList.add("suruklenen");
      cizgi=document.createElement("div");
      cizgi.className="birakma";
      liste.appendChild(cizgi);
      isaretle();
      try{ tut.setPointerCapture(ev.pointerId); }catch(e){}
    };
    tut.onpointermove=ev=>{
      if(kaynak<0) return;
      ev.preventDefault();
      aktifSatir.style.transform="translateY("+(sayfaY(ev)-basY)+"px)";
      hedef=hedefHesapla(sayfaY(ev));
      isaretle();
    };
    const bitir=ev=>{
      if(kaynak<0) return;
      try{ tut.releasePointerCapture(ev.pointerId); }catch(e){}
      const k=kaynak, j=Math.max(0,Math.min(p.hareketler.length-1,varisIndeksi()));
      kaynak=-1;
      temizle();
      if(j!==k) tasi(k,j);
    };
    tut.onpointerup=bitir;
    tut.onpointercancel=bitir;
    tut.onkeydown=ev=>{
      const i=+tut.dataset.tut;
      if(ev.key==="ArrowUp" && i>0){ ev.preventDefault(); tasi(i,i-1,true); }
      else if(ev.key==="ArrowDown" && i<p.hareketler.length-1){ ev.preventDefault(); tasi(i,i+1,true); }
    };
  });
}

/* set / tekrar / mola / sayım tipi düzenleme sayfası */
function hareketAyarSheet(p,i){
  const h=p.hareketler[i], e=EX[h.ex];
  const snap=JSON.parse(JSON.stringify(h));
  const ciz=()=>{
    modalAc(`
      <h2>${exAd(h.ex)}</h2>
      <p class="muted small">${e?bolgeTR(e.c)+" · "+ekipTR(e.q):""}</p>
      <p class="muted small" style="margin:12px 0 6px">Nasıl sayılsın?</p>
      <div class="seg sm">
        <button data-t="kg" class="${h.tip==="kg"?"on":""}">Ağırlıklı</button>
        <button data-t="vucut" class="${h.tip==="vucut"?"on":""}">Vücut ağırlığı</button>
        <button data-t="sure" class="${h.tip==="sure"?"on":""}">Süre</button>
      </div>
      <div class="editgrid">
        <div><label>Set</label><input type="number" inputmode="numeric" id="aSet" value="${h.set}"></div>
        <div><label>${h.tip==="sure"?"Saniye":"Tekrar"}</label><input type="text" id="aTek" value="${String(h.tekrar).replace(/"/g,"&quot;")}"></div>
        <div><label>Mola (sn)</label><input type="number" inputmode="numeric" id="aMola" value="${h.mola}"></div>
      </div>
      <button class="btn" id="aOk">Kaydet</button>
      <button class="btn ghost" id="aIptal">Vazgeç</button>`);
    const sheet=document.getElementById("modalBody");
    const oku=()=>{
      h.set=Math.max(1,Math.min(20,+sheet.querySelector("#aSet").value||1));
      h.tekrar=sheet.querySelector("#aTek").value.trim()||"10";
      /* 0 geçerli bir mola (ısınma/soğumada molasız geçiş istenebilir ve
         startSession bunu destekliyor). "||60" sıfırı yutuyordu; boş kutuyu
         ayrı ele alıyoruz. */
      h.mola=molaOku(sheet.querySelector("#aMola").value, h.mola);
    };
    sheet.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ oku(); h.tip=b.dataset.t; ciz(); });
    sheet.querySelector("#aOk").onclick=async()=>{
      oku();
      p.duzenlendi=Date.now();   // program artik gecmisten daha yeni
      await saveAll(); modalKapat(); render();
    };
    sheet.querySelector("#aIptal").onclick=()=>{ Object.assign(h,snap); modalKapat(); };
  };
  ciz();
}

/* katalogdan seçilen hareketi bir programa ekler */
function ekleSheet(exId){
  /* Sürmekte olan antrenmana mı, bir programa mı ekleniyor? */
  const seansaMi = !!(state.secici && state.secici.seans && state.active);
  const hedefProg=(!seansaMi && state.secici)?progById(state.secici.progId):null;
  if(!seansaMi && !hedefProg && !state.programs.length){ toast("Önce bir program oluştur"); return; }
  const o=oneriOf(exId);
  const y={ tip:tipOf(exId), set:3, tekrar:"", mola:0 };
  y.tekrar=String(y.tip==="sure"?(o.tekrar!=null?o.tekrar:30):(o.tekrar!=null?o.tekrar:10));
  y.mola=y.tip==="kg"?90:60;
  let secilen=hedefProg?hedefProg.id:(state.programs[0]?state.programs[0].id:null);

  const ciz=()=>{
    modalAc(`
      <h2>Programa ekle</h2>
      <p class="muted small">${exAd(exId)}</p>
      ${seansaMi?`<p class="small" style="margin-top:12px">Sürmekte olan antrenmana eklenecek</p>`
        :hedefProg?`<p class="small" style="margin-top:12px">Program: <b>${hedefProg.ad}</b></p>`
        :`<p class="muted small" style="margin:12px 0 6px">Hangi programa?</p>
          <div class="seg sm" style="flex-wrap:wrap">${state.programs.map(p=>`<button data-p="${p.id}" class="${p.id===secilen?"on":""}">${progKisa(p.ad)}</button>`).join("")}</div>`}
      <p class="muted small" style="margin:12px 0 6px">Nasıl sayılsın?</p>
      <div class="seg sm">
        <button data-t="kg" class="${y.tip==="kg"?"on":""}">Ağırlıklı</button>
        <button data-t="vucut" class="${y.tip==="vucut"?"on":""}">Vücut ağırlığı</button>
        <button data-t="sure" class="${y.tip==="sure"?"on":""}">Süre</button>
      </div>
      <div class="editgrid">
        <div><label>Set</label><input type="number" inputmode="numeric" id="nSet" value="${y.set}"></div>
        <div><label>${y.tip==="sure"?"Saniye":"Tekrar"}</label><input type="text" id="nTek" value="${String(y.tekrar).replace(/"/g,"&quot;")}"></div>
        <div><label>Mola (sn)</label><input type="number" inputmode="numeric" id="nMola" value="${y.mola}"></div>
      </div>
      <button class="btn" id="nOk">Ekle</button>
      <button class="btn ghost" id="nIptal">Vazgeç</button>`);
    const sheet=document.getElementById("modalBody");
    const oku=()=>{
      y.set=Math.max(1,Math.min(20,+sheet.querySelector("#nSet").value||3));
      y.tekrar=sheet.querySelector("#nTek").value.trim()||"10";
      y.mola=molaOku(sheet.querySelector("#nMola").value, y.mola);
    };
    sheet.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ oku(); secilen=b.dataset.p; ciz(); });
    sheet.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ oku(); y.tip=b.dataset.t; ciz(); });
    sheet.querySelector("#nOk").onclick=async()=>{
      oku();
      if(seansaMi){
        const h={ex:exId,set:y.set,tekrar:y.tekrar,mola:y.mola,tip:y.tip};
        state.active.hareketler.push(h);
        state.active.kayitlar.push(kayitOlustur(h,y.set));
        state.exIndex=state.active.hareketler.length-1;   // yeni harekete geç
        await saveAll();
        modalKapat();
        toast(exAd(exId)+" antrenmana eklendi");
        state.secici=null; state.openEx=null; state.tab="workout";
        render(); scrollTo(0,0);
        return;
      }
      const p=progById(secilen);
      if(!p){ toast("Program bulunamadı"); return; }
      p.hareketler.push({ex:exId,set:y.set,tekrar:y.tekrar,mola:y.mola,tip:y.tip});
      p.duzenlendi=Date.now();
      await saveAll();
      modalKapat();
      toast(exAd(exId)+" → "+p.ad);
      if(state.secici){ state.secici=null; state.openEx=null; state.duzenle=p.id; state.tab="programs"; }
      render(); scrollTo(0,0);
    };
    sheet.querySelector("#nIptal").onclick=modalKapat;
  };
  ciz();
}
/* --- DİNLENME VE SÜRE SAYACI --- */
/* Aynı tam ekran sayaç iki iş görüyor: setler arası dinlenme, ve plank gibi
   süreli hareketlerde setin kendisi. Fark etiketlerde ve bitişte olanda. */
/* --- EKRAN KILIDI ---
   Antrenman surerken ekranin kararmasini engeller: molada sayaci gormek ya
   da sonraki seti isaretlemek icin telefonu tekrar acmak gerekmesin.
   Kilit yalnizca seans surerken tutuluyor - katalogda gezinirken ekrani
   zorla acik tutmanin karsiligi yok, pili bosa yakar.
   Tarayici sekme gizlenince kilidi kendiliginden birakiyor, o yuzden geri
   donuste yeniden isteniyor (asagidaki visibilitychange).
   API yalnizca HTTPS ve localhost'ta var; file:// ile acildiginda ya da eski
   tarayicilarda sessizce devre disi kalir, hata gosterilmez. */
let ekranKilidi=null;
function ekranKilidiDestekli(){ return "wakeLock" in navigator; }
async function ekranAcikTut(){
  if(!state.ekranAcik || !state.active || !ekranKilidiDestekli()) return;
  if(ekranKilidi) return;
  let k;
  /* Istek reddedilebilir: izin yok, pil tasarrufu acik, sekme gizli.
     Hepsi normal - kullaniciya hata gostermeye deger bir sey degil. */
  try{ k=await navigator.wakeLock.request("screen"); }catch(e){ return; }
  /* Istek beklenirken antrenman bitmis olabilir; kilidi tutma. */
  if(!state.active || !state.ekranAcik){ try{ k.release(); }catch(e){} return; }
  k.addEventListener("release",()=>{ if(ekranKilidi===k) ekranKilidi=null; });
  ekranKilidi=k;
}
function ekranBirak(){
  const k=ekranKilidi; ekranKilidi=null;
  if(k) try{ k.release(); }catch(e){}
}

/* --- BİLDİRİM ---
   Sayaç bittiğinde uygulama arka plandaysa bildirim gönderir. Android'de
   new Notification() desteklenmiyor, service worker üzerinden göndermek
   gerekiyor; masaüstünde ikisi de çalışıyor, SW yoksa geri düşüyoruz. */
function bildirimDurum(){
  if(!("Notification" in window)) return "desteklenmiyor";
  return {granted:"verildi", denied:"reddedildi", "default":"sorulmadı"}[Notification.permission] || Notification.permission;
}
async function bildirimGonder(baslik,govde){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const ayar={body:govde, icon:"icon-192.png", badge:"icon-192.png",
              tag:"salon-sayac", renotify:true, vibrate:TITRESIM.sayac};
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){ await reg.showNotification(baslik,ayar); return; }
  }catch(e){}
  try{ new Notification(baslik,ayar); }catch(e){}
}

/* --- AYRI PENCERE ---
   Document Picture-in-Picture: sayacı, diğer pencerelerin üstünde duran
   küçük bir pencereye taşır. Masaüstü Chrome/Edge'de çalışır. Android'de
   tarayıcılar bir web sayfasının başka uygulamaların üstünde durmasına izin
   vermiyor; orada düğme hiç görünmüyor. */
let pipPencere=null;
function pipDestekli(){ return "documentPictureInPicture" in window; }
function pipGuncelle(){
  if(!pipPencere) return;
  const d=pipPencere.document;
  const yaz=(id,v)=>{ const e=d.getElementById(id); if(e) e.textContent=v; };
  yaz("l", document.getElementById("restLbl").textContent);
  yaz("n", document.getElementById("restNum").textContent);
  const alt=document.getElementById("restNext");
  yaz("a", alt.dataset.tam || alt.textContent);
}
async function pipAc(){
  if(!pipDestekli()){ toast("Bu tarayıcı ayrı pencereyi desteklemiyor"); return; }
  if(pipPencere){ pipPencere.focus(); return; }
  try{
    const w=await window.documentPictureInPicture.requestWindow({width:260,height:200});
    const st=w.document.createElement("style");
    st.textContent=`body{margin:0;height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;background:#141A1F;color:#E8EEF2;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;user-select:none}
      #l{color:#8D9BA8;font-size:13px;letter-spacing:.05em}
      #n{font-size:76px;font-weight:700;line-height:1;color:#E0A32E;font-variant-numeric:tabular-nums}
      #a{color:#8D9BA8;font-size:12px;text-align:center;padding:0 12px}`;
    w.document.head.appendChild(st);
    w.document.body.innerHTML=`<div id="l"></div><div id="n">0</div><div id="a"></div>`;
    w.addEventListener("pagehide",()=>{ pipPencere=null; });
    pipPencere=w;
    pipGuncelle();
  }catch(e){ toast("Ayrı pencere açılamadı"); }
}

/* Sayaç duvar saatine göre çalışır. Tarayıcı arka plandaki sekmenin
   setInterval'ini kıstığında geri sayım kaymaz; uygulamaya dönünce doğru
   değere atlar. Bitiş anı restBitis'te tutulur, tik sayısında değil. */
/* Dinlenme seritte mi tam ekranda mi acilsin? Kullanicinin son tercihi
   uygulama acik kaldigi surece hatirlaniyor; diske yazmaya deger bir ayar
   degil, salonda bir kez secilir ve o seansta oyle kalir. */
let seritMod=true;
function sayacBoy(serit){
  const k=document.getElementById("rest");
  k.classList.toggle("serit",!!serit);
  /* Sayfanin alti seridin arkasinda kalmasin - ama sayaç kapaliyken bosluk
     eklemenin anlami yok. */
  document.body.classList.toggle("seritli", !!serit && !k.classList.contains("hidden"));
  const b=document.getElementById("restBoy");
  if(b){ b.textContent=serit?"▲":"▼"; b.title=serit?"Büyüt":"Küçült"; }
}

function sayacCiz(){
  const kalan=Math.max(0, Math.round((restBitis-Date.now())/1000));
  document.getElementById("restNum").textContent=kalan;
  pipGuncelle();
  if(kalan<=0) sayacKapat(true);
}
function sayacAc(tip,sn,not,bitince,onizleme){
  sayacTipi=tip;
  sayacBitti=bitince||null;
  sayacBas=Date.now();
  restBitis=Date.now()+sn*1000;
  document.getElementById("restLbl").textContent = tip==="sure" ? "Süre" : "Dinlenme";
  /* Dugme, molanin sonunda gidilecek yeri soylesin: "Devam et" bu harekette
     set kaldigini, "Sonraki hareket" hareketin bittigini anlatiyor. Boylece
     bir dokunus yetiyor - once sayaci kapatip sonra "Sonraki"ye basmak yok. */
  sayacGecis = (tip==="dinlenme" && onizleme) ? (onizleme.gecis||null) : null;
  document.getElementById("restSkip").textContent =
      tip==="sure"            ? "Bitir"
    : sayacGecis==="bitir"    ? "Antrenmanı bitir"
    : sayacGecis==="hareket"  ? "Sonraki hareket"
    :                           "Devam et";
  const alt=document.getElementById("restNext");
  alt.textContent=not||"";
  onizlemeYaz(onizleme, alt);
  document.getElementById("rest").classList.remove("hidden");
  /* Süreli hareket sayacı her zaman tam ekran: o saniyeler hareketin
     kendisi. Dinlenme seritte açılır (ya da kullanıcı büyüttüyse öyle). */
  sayacBoy(tip==="dinlenme" ? seritMod : false);
  clearInterval(restTimer);
  sayacCiz();
  restTimer=setInterval(sayacCiz,250);
}
/* Geçen süreyi duvar saatinden ölçüyoruz; "+15 sn" ve erken bitirme
   ikisinde de gerçek süre kaydedilsin diye. */
function sayacKapat(suresiDoldu){
  clearInterval(restTimer);
  document.getElementById("rest").classList.add("hidden");
  document.body.classList.remove("seritli");
  /* Geri cagri yeni bir sayac acabilir (sureli hareket -> dinlenme);
     eski gecis bilgisi onun uzerine binmesin diye once temizliyoruz. */
  sayacGecis=null;
  if(suresiDoldu){
    titret(TITRESIM.sayac);
    if(pipPencere){
      const l=pipPencere.document.getElementById("l");
      if(l) l.textContent="Bitti";
    }
    /* Ekrandaysan zaten görüyorsun; bildirim sadece arka plandayken. */
    if(state.bildirim && document.hidden){
      bildirimGonder(sayacTipi==="sure" ? "Süre doldu" : "Dinlenme bitti",
                     document.getElementById("restNext").textContent || "Salon Defteri");
    }
  }
  const bit=sayacBitti; sayacBitti=null;
  if(bit) bit(Math.max(1,Math.round((Date.now()-sayacBas)/1000)));
}
function startRest(sn,not,onizleme){ sayacAc("dinlenme",sn,not,null,onizleme); }

/* Önizleme kartını doldurur. Ayrı pencere yalnızca metni gösterdiği için
   tam metni restNext üzerinde saklıyoruz. */
function onizlemeYaz(bilgi, altEl){
  const kutu=document.getElementById("restOnizleme");
  /* Seritte önizleme kartı görünmüyor; aynı bilgi tek satıra sığdırılıyor. */
  const kisa=document.getElementById("restKisa");
  const e=bilgi&&bilgi.ex?EX[bilgi.ex]:null;
  if(!bilgi||!e){
    kutu.classList.add("hidden");
    altEl.dataset.tam=altEl.textContent;
    kisa.textContent=altEl.textContent;
    return;
  }
  kutu.classList.remove("hidden");
  /* Medyasi olmayan hareketlerde (c003-c005) kare, bas harfli yer tutucuya doner. */
  const plaka=kutu.querySelector(".plate"), img=document.getElementById("restImg");
  if(medyaVar(e)){ plaka.classList.remove("bos"); img.classList.remove("hidden"); img.src=exImg(e); }
  else{ plaka.classList.add("bos"); img.classList.add("hidden"); img.removeAttribute("src"); }
  plaka.dataset.harf=basHarf(e);
  document.getElementById("restAd").textContent=e.n;
  document.getElementById("restAlt").textContent=bilgi.alt||"";
  altEl.dataset.tam=(altEl.textContent?altEl.textContent+": ":"")+e.n;
  kisa.textContent=(altEl.textContent?altEl.textContent+" · ":"")+e.n
    +(bilgi.alt?" · "+bilgi.alt:"");
}
function startHold(sn,not,bitince){ sayacAc("sure",sn,not,bitince); }
document.getElementById("restSkip").onclick=()=>{
  /* Gecis bilgisini sayacKapat temizlemeden once aliyoruz. */
  const gecis=sayacGecis;
  sayacKapat(false);
  if(!state.active || !gecis) return;
  if(gecis==="hareket" && state.exIndex<state.active.hareketler.length-1){
    state.exIndex++;
    state.tab="workout";
    saveAll();
    render(); scrollTo(0,0);
  }else if(gecis==="bitir"){
    state.tab="workout";
    render();
    bitirSor();
  }
};
document.getElementById("restBoy").onclick=()=>{
  const serit=!document.getElementById("rest").classList.contains("serit");
  if(sayacTipi==="dinlenme") seritMod=serit;
  sayacBoy(serit);
};
/* Seride dokunmak buyutur. Dugmelere dokunus kendi isini yapsin. */
document.getElementById("rest").onclick=ev=>{
  const k=document.getElementById("rest");
  if(!k.classList.contains("serit")) return;
  if(ev.target.closest("button")) return;
  if(sayacTipi==="dinlenme") seritMod=false;
  sayacBoy(false);
};
document.getElementById("restPip").onclick=pipAc;
if(pipDestekli()) document.getElementById("restPip").classList.remove("hidden");
document.getElementById("restPlus").onclick=()=>{ restBitis+=15000; sayacCiz(); };
/* Arka plandan dönünce sayaç beklemeden doğru değere atlasın. Ekran kilidi
   de burada geri alınıyor: tarayıcı sekme gizlenince onu düşürüyor, yoksa bir
   kez arka plana alınca özellik sessizce ölürdü. */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  if(restTimer) sayacCiz();
  ekranAcikTut();
});

/* --- HAREKET KATALOĞU --- */
const ATIF=`<p class="attrib">Hareket görselleri © <a href="https://gymvisual.com/" target="_blank" rel="noopener">Gym visual</a> · veri: exercises-dataset (MIT)</p>`;

function renderGuide(){
  if(state.openEx) return renderExDetay();
  const secim=!!state.secici;
  document.getElementById("title").textContent=secim?"Hareket seç":"Hareketler";
  if(!RAW.length){
    view.innerHTML=`<div class="card"><h3>Hareket veritabanı yüklenemedi</h3>
      <p class="muted small" style="margin-top:6px">data/exercises.js okunamadı. Sayfayı yenilemeyi dene.</p></div>`;
    return;
  }
  const k=state.kat;
  const qEn=(k.q||"").trim().toLowerCase(), qTr=(k.q||"").trim().toLocaleLowerCase("tr");
  const liste=RAW.filter(e=>{
    if(k.bolge && e.c!==k.bolge) return false;
    if(k.ekip && e.q!==k.ekip) return false;
    if(!qEn) return true;
    return e.n.toLowerCase().includes(qEn)
        || e.t.toLowerCase().includes(qEn)
        || kasTR(e.t).toLocaleLowerCase("tr").includes(qTr)
        || ekipTR(e.q).toLocaleLowerCase("tr").includes(qTr)
        || bolgeTR(e.c).toLocaleLowerCase("tr").includes(qTr);
  });
  const goster=liste.slice(0,k.limit);
  const bolgeler=Object.keys(BOLGE).filter(c=>RAW.some(e=>e.c===c));
  const ekipler=[...new Set(RAW.map(e=>e.q))].sort((a,b)=>ekipTR(a).localeCompare(ekipTR(b),"tr"));

  view.innerHTML=`
    ${secim?`<div class="card" style="padding:12px 16px;margin-bottom:10px">
      <div class="row between"><span class="small">${state.secici.seans
        ? "Sürmekte olan <b>antrenmana</b> ekleniyor"
        : "Eklenecek program: <b>"+(progById(state.secici.progId)?progById(state.secici.progId).ad:"?")+"</b>"}</span>
      <button class="pill" id="vazgec">Vazgeç</button></div></div>`:""}
    <input type="search" class="text" id="kAra" placeholder="Ara: bench press, squat, omuz, dambıl..." value="${String(k.q||"").replace(/"/g,"&quot;")}">
    <div class="katlar" role="group" aria-label="Bölge">
      <button data-bolge="" class="${k.bolge?"":"on"}">Tümü</button>
      ${bolgeler.map(c=>`<button data-bolge="${c}" class="${k.bolge===c?"on":""}">${bolgeTR(c)}</button>`).join("")}
    </div>
    <div class="filters">
      <select id="kEkip">
        <option value="">Tüm ekipmanlar</option>
        ${ekipler.map(q=>`<option value="${q}" ${k.ekip===q?"selected":""}>${ekipTR(q)}</option>`).join("")}
      </select>
    </div>
    <div class="count">${liste.length} hareket${liste.length>goster.length?" · ilk "+goster.length+" gösteriliyor":""}</div>
    ${goster.length?`<div class="exgrid">${goster.map(e=>`
      <button class="excard" data-ex="${e.i}">
        ${plakaIc(e)}
        <span class="nm"><b>${e.n}</b><span>${kasTR(e.t)} · ${ekipTR(e.q)}</span></span>
        ${secim?`<span class="pill on ekle">Ekle</span>`:""}</button>`).join("")}</div>`
    :`<div class="card"><h3>Sonuç yok</h3><p class="muted small" style="margin-top:6px">Aramayı ya da filtreleri değiştir.</p></div>`}
    ${liste.length>goster.length?`<button class="btn quiet sm" id="daha">Daha fazla göster</button>`:""}
    ${ATIF}`;

  const ara=document.getElementById("kAra");
  ara.oninput=()=>{
    state.kat.q=ara.value; state.kat.limit=60;
    const p=ara.selectionStart; renderGuide();
    const y=document.getElementById("kAra"); y.focus(); y.setSelectionRange(p,p);
  };
  view.querySelectorAll("[data-bolge]").forEach(b=>b.onclick=()=>{ state.kat.bolge=b.dataset.bolge; state.kat.limit=60; renderGuide(); });
  document.getElementById("kEkip").onchange=ev=>{ state.kat.ekip=ev.target.value; state.kat.limit=60; renderGuide(); };
  const daha=document.getElementById("daha");
  if(daha) daha.onclick=()=>{ state.kat.limit+=60; renderGuide(); };
  const vz=document.getElementById("vazgec");
  if(vz) vz.onclick=()=>{
    const seans=state.secici.seans, pid=state.secici.progId;
    state.secici=null;
    if(seans){ state.tab="workout"; }
    else { state.duzenle=pid; state.tab="programs"; }
    render(); scrollTo(0,0);
  };
  view.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{
    if(secim){ ekleSheet(b.dataset.ex); return; }
    state.openEx=b.dataset.ex; render(); scrollTo(0,0);
  });
}

function renderExDetay(){
  const e=EX[state.openEx];
  if(!e){ state.openEx=null; return renderGuide(); }
  document.getElementById("title").textContent="Hareket";
  const o=ov(e.i);
  view.innerHTML=`
    <button class="btn ghost sm" id="back" style="margin-bottom:12px">Listeye dön</button>
    <div class="card">
      <div class="stage">
        ${sahneIc(e)}
        <div class="stage-cap"><span>${bolgeTR(e.c)}</span><span>${ekipTR(e.q)}</span></div>
      </div>
      <h2 style="margin-top:12px">${e.n}</h2>
      <p class="muted small">Hedef: ${kasTR(e.t)}${e.s&&e.s.length?" · Yardımcı: "+e.s.map(kasTR).join(", "):""}</p>
      ${o&&o.ipucu?`<p class="small" style="margin-top:8px">${o.ipucu}</p>`:""}
      <h3 style="margin-top:14px">Nasıl yapılır</h3>
      <ol class="steps">${e.d.map(a=>`<li>${a}</li>`).join("")}</ol>
      ${o&&o.hatalar?`<h3 style="margin-top:14px">Sık yapılan hatalar</h3>
      <ul class="warn small">${o.hatalar.map(a=>`<li>${a}</li>`).join("")}</ul>`:""}
      ${ATIF}
    </div>
    <button class="btn" id="add">Programa ekle</button>`;
  document.getElementById("back").onclick=()=>{ state.openEx=null; render(); scrollTo(0,0); };
  document.getElementById("add").onclick=()=>ekleSheet(e.i);
}
/* --- İSTATİSTİK --- */
function donemBaslangic(){
  const now=new Date();
  if(state.donem==="hafta") return haftaBasi(now);
  if(state.donem==="ay") return new Date(now.getFullYear(),now.getMonth(),1);
  return new Date(2000,0,1);
}
function renderStats(){
  document.getElementById("title").textContent="İstatistik";
  const bas=donemBaslangic();
  const ss=state.sessions.filter(s=>new Date(s.tarih)>=bas);
  const setSay=ss.reduce((a,s)=>a+s.kayitlar.reduce((b,k)=>b+k.setler.length,0),0);
  const sureDk=Math.round(ss.reduce((a,s)=>a+(s.sure||0),0)/60);
  const hacim=Math.round(ss.reduce((a,s)=>a+(s.hacim||0),0));
  const ortDk=ss.length?Math.round(sureDk/ss.length):0;
  const tekrarSay=ss.reduce((a,s)=>a+s.kayitlar.reduce((b,k)=>b+k.setler.reduce((c,x)=>c+(x.tekrar||0),0),0),0);

  // beslenme
  const gunKeys=Object.keys(state.meals).filter(k=>keyToDate(k)>=bas).sort();
  let topP=0,topK=0,hedefTutan=0;
  gunKeys.forEach(k=>{ const g=gunToplam(k); topP+=g.p; topK+=g.k; if(g.p>=state.hedefProtein) hedefTutan++; });
  const ortP=gunKeys.length?Math.round(topP/gunKeys.length):0;
  const ortK=gunKeys.length?Math.round(topK/gunKeys.length):0;

  const enIyi={};
  ss.forEach(s=>s.kayitlar.forEach(k=>k.setler.forEach(x=>{
    const skor=(x.kg||0)*1000+(x.tekrar||0);
    if(!enIyi[k.id]||skor>enIyi[k.id].skor) enIyi[k.id]={skor,kg:x.kg,tekrar:x.tekrar,tip:k.tip||tipOf(k.id)};
  })));

  let bars=[];
  if(state.donem==="tum"){
    const b=new Date();
    for(let i=5;i>=0;i--){
      const d=new Date(b.getFullYear(),b.getMonth()-i,1), son=new Date(d.getFullYear(),d.getMonth()+1,1);
      bars.push({etiket:AYLAR[d.getMonth()], n:state.sessions.filter(s=>{const x=new Date(s.tarih);return x>=d&&x<son;}).length});
    }
  }else{
    const b=new Date();
    for(let i=7;i>=0;i--){
      const h=haftaBasi(new Date(b.getTime()-i*7*864e5)), son=new Date(h.getTime()+7*864e5);
      bars.push({etiket:h.getDate()+"."+(h.getMonth()+1), n:state.sessions.filter(s=>{const d=new Date(s.tarih);return d>=h&&d<son;}).length});
    }
  }
  const enB=Math.max(1,...bars.map(b=>b.n));

  // son 7 gün protein
  let pBars=[];
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*864e5), k=gunKey(d);
    pBars.push({etiket:GUNLER[d.getDay()][0], p:gunToplam(k).p});
  }
  const enP=Math.max(state.hedefProtein,...pBars.map(x=>x.p));

  view.innerHTML=`
    <div class="seg">
      <button data-d="hafta" class="${state.donem==="hafta"?"on":""}">Bu hafta</button>
      <button data-d="ay" class="${state.donem==="ay"?"on":""}">Bu ay</button>
      <button data-d="tum" class="${state.donem==="tum"?"on":""}">Tüm zamanlar</button>
    </div>

    <div class="stats">
      <div class="stat"><b>${ss.length}</b><span>antrenman</span></div>
      <div class="stat"><b>${sureDk}</b><span>dakika</span></div>
      <div class="stat"><b>${setSay}</b><span>set</span></div>
    </div>

    <div class="card">
      <h3>${state.donem==="tum"?"Aylara göre":"Haftalara göre"} antrenman</h3>
      <div class="bars">${bars.map(b=>`<div><i class="${b.n?"":"empty"}" style="height:${b.n?Math.round(b.n/enB*88)+"%":"3px"}"></i><small>${b.etiket}</small></div>`).join("")}</div>
    </div>

    <div class="card">
      <h3>Beslenme</h3>
      <div class="bars" style="height:90px">${pBars.map(x=>`<div><i class="p ${x.p?"":"empty"}" style="height:${x.p?Math.round(x.p/enP*88)+"%":"3px"}"></i><small>${x.etiket}</small></div>`).join("")}</div>
      <p class="muted small" style="margin:2px 0 10px">Son 7 gün protein</p>
      <div class="kv"><span>Ortalama günlük protein</span><b>${ortP} g</b></div>
      <div class="kv"><span>Ortalama günlük kalori</span><b>${ortK} kcal</b></div>
      <div class="kv"><span>Hedefi tutturduğun gün</span><b>${hedefTutan} / ${gunKeys.length}</b></div>
    </div>

    <div class="card">
      <h3>Antrenman özeti</h3>
      <div class="kv"><span>Ortalama antrenman süresi</span><b>${ortDk} dk</b></div>
      <div class="kv"><span>Toplam tekrar</span><b>${tekrarSay}</b></div>
      <div class="kv"><span>Toplam kaldırılan ağırlık</span><b>${hacim.toLocaleString("tr-TR")} kg</b></div>
    </div>

    ${Object.keys(enIyi).length?`<div class="card"><h3>Hareket bazlı en iyi set</h3>
      ${Object.keys(enIyi).map(id=>`<div class="kv"><span>${exAd(id)}</span><b>${(enIyi[id].kg?enIyi[id].kg+" kg × ":"")+(enIyi[id].tekrar||0)}${enIyi[id].tip==="sure"?" sn":""}</b></div>`).join("")}</div>`:""}

    <button class="satirlink" id="goHist"><span>Antrenman geçmişi</span><span class="muted small" style="flex:none">${state.sessions.length} kayıt</span>${IKON.ok}</button>`;
  view.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ state.donem=b.dataset.d; renderStats(); });
  document.getElementById("goHist").onclick=()=>{ state.tab="history"; render(); scrollTo(0,0); };
}

/* --- GEÇMİŞ --- */
function renderHistory(){
  document.getElementById("title").textContent="Geçmiş";
  const ss=state.sessions;
  view.innerHTML=`<button class="btn ghost sm" id="back" style="margin-bottom:12px">İstatistiğe dön</button>`+
    (ss.length? `<div class="card">${[...ss].reverse().map(s=>{
      const setSayisi=s.kayitlar.reduce((a,k)=>a+k.setler.length,0), acik=state.openHist===s.id;
      return `<div class="hist">
        <button class="histbas" data-h="${s.id}">
          <div class="row between">
            <span><b style="font-family:var(--cond);font-size:18px">${tarihTR(s.tarih)}</b><span class="pill" style="margin-left:8px">${s.program?progKisa(s.program.ad):("Gün "+s.gun)}</span></span>
            <span class="muted small">${mmss(s.sure||0)} · ${setSayisi} set</span>
          </div>
        </button>
        ${acik?`<div class="histdetay">
          ${s.kayitlar.map((k,ki)=>`
            <div class="hsatir">
              <span class="had">${exAd(k.id)}</span>
              <div class="hsetler">${k.setler.map((x,si)=>`
                <span class="hset">
                  ${k.tip==="kg"?`<input type="number" inputmode="decimal" step="0.5" data-sd="${s.id}" data-k="${ki}" data-i="${si}" data-f="kg" value="${x.kg??""}">×`:""}
                  <input type="number" inputmode="numeric" data-sd="${s.id}" data-k="${ki}" data-i="${si}" data-f="tekrar" value="${x.tekrar??""}">${k.tip==="sure"?"sn":""}
                </span>`).join("")}</div>
            </div>`).join("")}
          <p class="muted small" style="margin:12px 0 0">Yanlış girdiğin bir değeri buradan düzeltebilirsin; düzeltme "geçen sefer" önerisine de yansır.</p>
          <button class="btn danger sm" data-sessil="${s.id}" style="margin-top:10px">Bu antrenmanı sil</button>
        </div>`:""}
      </div>`;}).join("")}</div>`
    : `<div class="card"><h3>Henüz kayıt yok</h3><p class="muted small">İlk antrenmanını bitirdiğinde burada listelenir.</p></div>`);
  document.getElementById("back").onclick=()=>{ state.tab="stats"; render(); };
  view.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ state.openHist=state.openHist===b.dataset.h?null:b.dataset.h; renderHistory(); });
  /* Set değerini düzeltme. change (blur) üzerinden: her tuş vuruşunda diske
     yazmak gereksiz. Hacim kayıtlardan türetildiği için yeniden hesaplanıyor,
     yoksa istatistikteki "toplam kaldırılan ağırlık" eski değerde kalırdı. */
  view.querySelectorAll(".histdetay input").forEach(inp=>inp.onchange=async()=>{
    const s=state.sessions.find(x=>x.id===inp.dataset.sd); if(!s) return;
    const k=s.kayitlar[+inp.dataset.k]; if(!k) return;
    const st=k.setler[+inp.dataset.i]; if(!st) return;
    const ham=inp.value.trim();
    const v=ham===""?null:Math.max(0,+ham);
    st[inp.dataset.f]=(v==null||isNaN(v))?null:v;
    if(st[inp.dataset.f]!=null) inp.value=st[inp.dataset.f];
    s.hacim=s.kayitlar.reduce((a,kk)=>a+kk.setler.reduce((b,x)=>b+((x.kg||0)*(x.tekrar||0)),0),0);
    await saveAll();
    toast("Kayıt güncellendi");
  });
  view.querySelectorAll("[data-sessil]").forEach(b=>b.onclick=()=>{
    const s=state.sessions.find(x=>x.id===b.dataset.sessil); if(!s) return;
    modalAc(`
      <h2>Antrenmanı sil</h2>
      <p class="muted small">${tarihTR(s.tarih)} · ${s.program?progKisa(s.program.ad):("Gün "+s.gun)} kaydı silinecek. Bu işlem geri alınamaz.</p>
      <button class="btn danger" id="asEvet">Sil</button>
      <button class="btn ghost" id="asHayir">Vazgeç</button>`);
    document.getElementById("asEvet").onclick=async()=>{
      state.sessions=state.sessions.filter(x=>x.id!==s.id);
      if(state.openHist===s.id) state.openHist=null;
      await saveAll(); modalKapat(); renderHistory(); toast("Antrenman silindi");
    };
    document.getElementById("asHayir").onclick=modalKapat;
  });
}

async function dosyayaAktar(sessiz){
  try{
    const photos=sessiz?[]:await fotoSureSinirli(fotoIslem("readonly",d=>d.getAll()),15000);
    const blob=new Blob([JSON.stringify({v:4,hedefProtein:state.hedefProtein,hedefKalori:state.hedefKalori,programs:state.programs,sessions:state.sessions,meals:state.meals,favorites:state.favorites,photos},null,1)],{type:"application/json"});
    const d=new Date(), ad=`salon-defteri-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ad; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(!sessiz) toast("İndirilenler klasörüne kaydedildi");
  }catch(e){ if(!sessiz) toast("Dosya kaydedilemedi"); }
}

function dosyadanYukle(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result), gelen=Array.isArray(d)?d:(d.sessions||[]);
      const varOlan=new Set(state.sessions.map(s=>s.id)); let eklenen=0;
      gelen.forEach(s=>{ if(s&&s.id&&!varOlan.has(s.id)){ state.sessions.push(s); eklenen++; } });
      state.sessions.sort((a,b)=>new Date(a.tarih)-new Date(b.tarih));
      /* Kimlikli öğünleri id ile birleştir; aynı yiyeceğin ayrı öğünlerini
         koru. Çok eski, kimliksiz kayıtlarda içerik üzerinden eşleştir. */
      let gun=0, birlesen=0;
      const ogunAnahtar=x=>x.id ? "id:"+x.id : [x.ad,x.por,x.p,x.k,x.adet].join("\u0001");
      if(d.meals) Object.keys(d.meals).forEach(k=>{
        const gelen=d.meals[k];
        if(!Array.isArray(gelen)||!gelen.length) return;
        if(!state.meals[k]){ state.meals[k]=gelen; gun++; return; }
        const varOlan=new Set(state.meals[k].map(ogunAnahtar));
        let eklendi=0;
        gelen.forEach(x=>{ if(!varOlan.has(ogunAnahtar(x))){ state.meals[k].push(x); varOlan.add(ogunAnahtar(x)); eklendi++; } });
        if(eklendi) birlesen++;
      });
      let prog=0;
      if(Array.isArray(d.programs)){
        const pid=new Set(state.programs.map(p=>p.id));
        d.programs.forEach(p=>{ if(p&&p.id&&!pid.has(p.id)&&Array.isArray(p.hareketler)){ state.programs.push(p); prog++; } });
      }
      if(Array.isArray(d.favorites)){
        const ids=new Set(state.favorites.map(x=>x.id));
        d.favorites.forEach(x=>{if(x&&x.id&&!ids.has(x.id)){state.favorites.push(x);ids.add(x.id);}});
      }
      let fotoSorunu=false;
      if(Array.isArray(d.photos)&&d.photos.length){
        try{
          await fotoSureSinirli(fotoIslem("readwrite",store=>{d.photos.forEach(x=>{
            if(x&&x.id&&Array.isArray(x.oncekiler)&&Array.isArray(x.kalanlar)&&[...x.oncekiler,...x.kalanlar].every(b=>typeof b==="string"&&/^[A-Za-z0-9+/=]+$/.test(b)))store.put(x);
          });}),15000);
        }catch(e){fotoSorunu=true;}
      }
      if(d.hedefProtein) state.hedefProtein=d.hedefProtein;
      if(d.hedefKalori) state.hedefKalori=d.hedefKalori;
      migrasyonYap();
      await saveAll();
      toast(`${eklenen} antrenman, ${gun} beslenme günü, ${prog} program eklendi`
            + (birlesen?` · ${birlesen} gün birleştirildi`:""));
      if(fotoSorunu)toast("Öğünler yüklendi; fotoğraflar cihaz hafızasına yazılamadı.");
      state.tab="home"; render();
    }catch(err){ toast("Dosya okunamadı. Doğru json dosyasını seçtiğinden emin ol."); }
  };
  r.readAsText(f);
}
/* ==========================================================
   6. BAŞLAT
   ========================================================== */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    state.tab=b.dataset.tab;
    state.openEx=null; state.besinTarih=null;
    state.duzenle=null; state.secici=null;
    render(); scrollTo(0,0);
  };
});
/* Uygulama arka plana alınırken ya da kapanırken yarım antrenmanı yaz. */
document.addEventListener("visibilitychange",()=>{ if(document.hidden && state.active) saveAll(); });
window.addEventListener("pagehide",()=>{ if(state.active) saveAll(); });

(async()=>{
  await loadAll();
  // Fotoğraf arşivi kalıcı; gün değişince silinmez.
  if(state.active){
    saatBaslat();
    ekranAcikTut();
    /* Sayaç kendiliğinden çalışıyor gibi görünmesin: neden sürdüğünü söyle. */
    const gecen=Math.floor((Date.now()-state.active.baslangic)/60000);
    setTimeout(()=>toast(`Yarım kalan antrenman sürüyor · ${gecen} dk önce başladı`),400);
  }
  render();
})();
</script>

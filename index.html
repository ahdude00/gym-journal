<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A1F">
<title>Salon Defteri</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141A1F; --panel:#1C242B; --field:#232D36; --line:#2E3A44;
  --text:#E8EEF2; --dim:#8D9BA8; --brass:#E0A32E; --done:#5FBF8B; --prot:#6FA8DC;
  /* GIF/JPG'lerin zemini saf beyaz; plaka da beyaz olunca dikis gorunmuyor */
  --plate:#FFFFFF;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --tabbar:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:18px}
p{margin:0 0 10px}
button{font-family:var(--sans);font-size:16px;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:var(--cond);font-size:22px;font-weight:600;color:var(--text);background:var(--field);
  border:1px solid var(--line);border-radius:10px;text-align:center;width:100%;padding:9px 4px;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input[type=search],input.text{font-family:var(--sans);font-size:16px;font-weight:400;text-align:left;padding:12px 14px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::-webkit-search-cancel-button{-webkit-appearance:none}
input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:12px 14px 26px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 14px 4px;max-width:560px;margin:0 auto}
.topbar .clock{font-family:var(--cond);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--dim)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--brass);color:#141A1F;font-weight:600;font-size:17px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.quiet{background:var(--field);color:var(--text)}
.btn.sm{padding:11px;font-size:15px}
.btn.danger{background:transparent;border:1px solid var(--line);color:#E08A8A}
.btn[disabled]{opacity:.45}

/* Hareket görseli. Dataset GIF'leri beyaz zeminli, o yüzden açık plaka üstünde. */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage .media{background:var(--plate);display:flex;align-items:center;justify-content:center;padding:12px;min-height:212px}
.stage .media img{width:min(100%,236px);height:auto;aspect-ratio:1;object-fit:contain;display:block}
.stage-cap{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.plate img{width:100%;height:100%;object-fit:contain;display:block}
.attrib{color:var(--dim);font-size:11px;margin-top:10px}
.attrib a{color:var(--dim)}

.setrow{display:grid;grid-template-columns:56px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.setno{font-family:var(--cond);font-size:17px;color:var(--dim)}
.unit{position:relative}
.unit span{position:absolute;right:7px;bottom:6px;font-size:11px;color:var(--dim);pointer-events:none}
.tick{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:20px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.setrow.done .tick{background:var(--done);border-color:var(--done);color:#12261C}
.setrow.done input{opacity:.55}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--dim)}
.pill.on{background:var(--brass);border-color:var(--brass);color:#141A1F}
.progress{display:flex;gap:4px;margin:6px 0 10px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--brass)}

/* protein çubuğu */
.meter{height:12px;border-radius:6px;background:var(--field);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--prot);border-radius:6px}
.meter i.full{background:var(--done)}
.bignum{font-family:var(--cond);font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:17px;font-weight:500;color:var(--dim)}

.rest{position:fixed;inset:0;background:rgba(12,16,20,.97);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px}
.rest .num{font-family:var(--cond);font-weight:700;font-size:106px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--brass)}
.rest .lbl{color:var(--dim);letter-spacing:.05em}
.rest .acts{display:flex;gap:10px;margin-top:22px;width:100%;max-width:340px}

.modal{position:fixed;inset:0;background:rgba(10,14,18,.82);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow:auto}
.modal .sheet .btn{margin-top:10px}
.chips{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chips button{flex:1;min-width:60px;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-family:var(--cond);font-size:18px}
.chips button.on{background:var(--brass);border-color:var(--brass);color:#141A1F}

.exitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.exitem:first-child{border-top:none}
.exitem .plate{width:56px;height:56px}
.exitem .nm{flex:1;min-width:0}
.exitem .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.steps{margin:0;padding-left:20px} ol.steps li{margin-bottom:7px}
ul.warn{margin:0;padding-left:18px;color:var(--dim)} ul.warn li{margin-bottom:6px}

/* hareket kataloğu */
.filters{display:flex;gap:8px;margin:10px 0 2px}
.filters select{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 10px;font-family:var(--sans);font-size:14px;-webkit-appearance:none;appearance:none}
.count{color:var(--dim);font-size:13px;padding:8px 0 2px}

/* program düzenleyici */
.progrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.progrow:first-of-type{border-top:none}
.progrow .plate{width:44px;height:44px}
.progrow .nm{flex:1;min-width:0;text-align:left}
.progrow .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:32px;height:32px;flex:none;border-radius:9px;background:var(--field);border:1px solid var(--line);
  color:var(--dim);font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn[disabled]{opacity:.3}
.editgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.editgrid label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.editgrid input{font-size:18px;padding:8px 4px}

/* beslenme kaydı */
.logrow{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.logrow:first-of-type{border-top:none}
.logrow .val{font-family:var(--cond);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.logrow .del{width:34px;height:34px;border-radius:9px;background:var(--field);border:1px solid var(--line);color:var(--dim);font-size:16px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datenav button{width:46px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:18px}
.datenav b{font-family:var(--cond);font-size:19px}

.hist{width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--cond);font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass);line-height:1.1}
.stat span{font-size:12px;color:var(--dim);display:block;line-height:1.25}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;color:var(--dim);font-size:14px;background:var(--panel)}
.seg button.on{background:var(--brass);border-color:var(--brass);color:#141A1F;font-weight:600}
.seg.sm{margin-bottom:0}
.seg.sm button{font-size:13px;padding:8px 3px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin:6px 0 2px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars i{display:block;width:100%;background:var(--brass);border-radius:4px 4px 0 0;min-height:3px}
.bars i.empty{background:var(--line)}
.bars i.p{background:var(--prot)}
.bars small{color:var(--dim);font-size:11px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:none}
.kv b{font-family:var(--cond);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch button{width:52px;height:30px;border-radius:999px;background:var(--field);border:1px solid var(--line);position:relative;flex:none}
.switch button i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
.switch button.on{background:var(--brass);border-color:var(--brass)}
.switch button.on i{left:26px;background:#141A1F}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#10161B;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px}
nav button.on{color:var(--brass)}
nav button i{font-style:normal;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 16px);z-index:70;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;max-width:88%;text-align:center}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <h1 id="title">Salon Defteri</h1>
  <div class="clock hidden" id="clock">00:00</div>
</header>

<main class="wrap" id="view"></main>

<nav><div>
  <button data-tab="home" class="on"><i>◉</i>Özet</button>
  <button data-tab="workout"><i>▣</i>Antrenman</button>
  <button data-tab="food"><i>◍</i>Beslenme</button>
  <button data-tab="guide"><i>◈</i>Hareketler</button>
  <button data-tab="stats"><i>◪</i>İstatistik</button>
</div></nav>

<div id="rest" class="rest hidden">
  <div class="lbl" id="restLbl">Dinlenme</div>
  <div class="num" id="restNum">90</div>
  <div class="lbl small" id="restNext"></div>
  <div class="acts">
    <button class="btn quiet" id="restPlus">+15 sn</button>
    <button class="btn" id="restSkip">Devam et</button>
  </div>
  <button class="btn ghost sm hidden" id="restPip" style="width:100%;max-width:340px;margin-top:10px">Ayrı pencerede göster</button>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="modalBody"></div></div>

<script src="data/exercises.js"></script>
<script src="data/custom.js"></script>
<script>
/* ==========================================================
   1. HAREKET VERİTABANI
   Veri (isim, bölge, ekipman, kas, Türkçe adımlar): exercises-dataset — MIT
   Medya (images/, videos/): © Gym visual — https://gymvisual.com/
     180×180 sınırı ve atıf zorunluluğu için bkz. NOTICE.md
   ========================================================== */
const RAW = Array.isArray(window.EXDATA) ? window.EXDATA : [];
/* custom.js kendi kayitlarini sona ekliyor; katalog alfabetik olsun */
RAW.sort((a, b) => a.n.toLowerCase().localeCompare(b.n.toLowerCase(), "en"));
const EX = {};
RAW.forEach(e => { EX[e.i] = e; });

const BOLGE = {
  "back":"Sırt", "cardio":"Kardiyo", "chest":"Göğüs", "lower arms":"Ön kol",
  "lower legs":"Baldır", "neck":"Boyun", "shoulders":"Omuz",
  "upper arms":"Kol", "upper legs":"Bacak", "waist":"Karın ve bel"
};
const KAS = {
  "abs":"karın", "abductors":"kalça dış", "adductors":"iç bacak", "biceps":"biceps",
  "calves":"baldır", "cardiovascular system":"kondisyon", "delts":"omuz",
  "forearms":"ön kol", "glutes":"kalça", "hamstrings":"arka bacak", "lats":"kanat",
  "levator scapulae":"boyun", "pectorals":"göğüs", "quads":"ön bacak",
  "serratus anterior":"yan karın", "spine":"bel", "traps":"trapez",
  "triceps":"triceps", "upper back":"üst sırt"
};
const EKIP = {
  "assisted":"destekli", "band":"lastik", "barbell":"halter", "body weight":"vücut ağırlığı",
  "bosu ball":"bosu topu", "cable":"kablo", "dumbbell":"dambıl",
  "elliptical machine":"eliptik", "ez barbell":"Z bar", "hammer":"çekiç",
  "kettlebell":"kettlebell", "leverage machine":"makine", "medicine ball":"sağlık topu",
  "olympic barbell":"olimpik halter", "resistance band":"direnç lastiği", "roller":"roller",
  "rope":"ip", "skierg machine":"skierg", "sled machine":"kızak makinesi",
  "smith machine":"smith makinesi", "stability ball":"pilates topu", "stationary bike":"sabit bisiklet",
  "stepmill machine":"step makinesi", "tire":"lastik tekerlek", "trap bar":"trap bar",
  "upper body ergometer":"kol ergometresi", "weighted":"ağırlıklı", "wheel roller":"karın tekerleği"
};
const bolgeTR = c => BOLGE[c] || c;
const kasTR   = t => KAS[t] || t;
const ekipTR  = q => EKIP[q] || q;

function exImg(e){ return "images/" + e.i + "-" + e.m + ".jpg"; }
function exGif(e){ return "videos/" + e.i + "-" + e.m + ".gif"; }
function exAd(id){ return EX[id] ? EX[id].n : id; }
function exAltyazi(id){ const e = EX[id]; return e ? kasTR(e.t) + " · " + ekipTR(e.q) : ""; }
/* Dataset "bu hareket ağırlıklı mı" bilgisini taşımıyor; ekipmandan tahmin ediyoruz. */
function varsayilanTip(e){ return (e && (e.q === "body weight" || e.q === "assisted")) ? "vucut" : "kg"; }

/* Çekirdek hareketler için elle yazılmış Türkçe ipucu, sık hatalar ve
   başlangıç önerisi — dataset'te bu üç alan yok. Anahtar = dataset id. */
const OVERLAY = {
  "0289":{ tip:"kg", oneri:{kg:10,tekrar:8},
    ipucu:"Barbell yerine dambıl: omuz için daha güvenli.",
    hatalar:["Dirsekleri 90 derece yana açmak — omuzu zorlar.","Kalçayı bench'ten kaldırmak.","Aşağıda zıplatarak sektirmek."] },
  "0405":{ tip:"kg", oneri:{kg:8,tekrar:8},
    ipucu:"Oturarak yap, sırtın desteklensin.",
    hatalar:["Beli aşırı kavis yaptırıp göğüs press'e çevirmek.","Dambılları kulak hizasının çok altına indirmek.","Yukarıda dambılları birbirine çarpmak."] },
  "0334":{ tip:"kg", oneri:{kg:4,tekrar:12},
    ipucu:"Omuz genişliğinin ana hareketi. Hafif başla, sallanma.",
    hatalar:["Sallanarak momentumla kaldırmak — ağırlık fazla demektir.","Elleri omuzdan yukarı çıkarmak.","Omuzları kulaklara doğru kaldırmak."] },
  "0279":{ tip:"vucut", oneri:{tekrar:8},
    ipucu:"Ayaklar yüksekte şınav — yük üst göğüse ve ön omuza kayar.",
    hatalar:["Kalçanın çökmesi ya da havaya fırlaması.","Dirsekleri tamamen yana açmak.","Göğsü indirmeden yarım tekrar yapmak."] },
  "0489":{ tip:"vucut", oneri:{tekrar:12},
    ipucu:"Yukarıda vücut düz çizgi olunca dur, geriye kavis yapma.",
    hatalar:["Yukarıda geriye doğru aşırı açılmak.","Sırtı yuvarlayarak inmek.","Sallanarak hızlı tekrar yapmak."] },
  "0276":{ tip:"vucut", oneri:{tekrar:10},
    ipucu:"Asıl iş belini yere yapışık tutmakta.",
    hatalar:["Belin yerden kalkması — o an dur, daha az uzat.","Nefesi tutmak.","Hızlı yapmak; bu hareket yavaş yapılır."] },
  "0652":{ tip:"vucut", oneri:{tekrar:3},
    ipucu:"Yapamıyorsan negatif çalış: yukarıdan 5 saniyede in.",
    hatalar:["Sallanarak momentum almak.","Yarım tekrar yapıp aşağı tam inmemek.","Omuzları kulaklara gömülü bırakmak."] },
  "0292":{ tip:"kg", oneri:{kg:12,tekrar:10},
    ipucu:"Dambılı göğse değil, kalçaya doğru çek.",
    hatalar:["Gövdeyi çevirerek çekmek.","Dirseği yana açmak.","Sırtı yuvarlamak."] },
  "0383":{ tip:"kg", oneri:{kg:5,tekrar:15},
    ipucu:"Duruşun için programın en değerli hareketlerinden.",
    hatalar:["Ağır dambılla biceps curl'e çevirmek.","Sırtı yuvarlamak.","Hareketi sallayarak yapmak."] },
  "1760":{ tip:"kg", oneri:{kg:12,tekrar:10},
    ipucu:"Bacak koruma hareketi. Abartmana gerek yok.",
    hatalar:["Topuğun yerden kalkması.","Dizlerin içeri çökmesi.","Aşağıda belin yuvarlanması."] },
  "2135":{ tip:"sure", oneri:{tekrar:30},
    ipucu:"Süre tut. Ağırlıksız başla; form bozulunca bitir, süreyi zorlama.",
    hatalar:["Kalçanın yukarı fırlaması veya belin çökmesi.","Nefesi tutmak.","Boynu yukarı kaldırmak — bak yere."] },
  "3679":{ tip:"vucut", oneri:{tekrar:15},
    ipucu:"Ayaklarını sabitleme, tam oturma pozisyonuna kadar çıkma.",
    hatalar:["Ayakları sabitleyip kalçadan çekmek.","Boynu elle öne çekmek.","Hızlı ve sekerek yapmak."] },
  /* data/custom.js'teki iki hareket — dataset'te karşılıkları yok */
  "c001":{ tip:"sure", oneri:{tekrar:30},
    ipucu:"Süre tut. Form bozulunca bitir, süreyi zorlama.",
    hatalar:["Kalçanın yukarı fırlaması veya belin çökmesi.","Nefesi tutmak.","Boynu yukarı kaldırmak — bak yere."] },
  "c002":{ tip:"vucut", oneri:{tekrar:8},
    ipucu:"Zorlaşsın istersen ayaklarını sandalyeye koy.",
    hatalar:["Kalçayı düşürüp normal şınava çevirmek.","Dirsekleri tamamen yana açmak.","Boynu öne uzatıp kambur kalmak."] }
};
function ov(id){ return OVERLAY[id] || null; }
function oneriOf(id){ const o = ov(id); return (o && o.oneri) ? o.oneri : { tekrar:10 }; }
function tipOf(id){ const o = ov(id); return (o && o.tip) ? o.tip : varsayilanTip(EX[id]); }

/* Eski sürüm hareketleri slug ile tutuyordu; kayıtlar dataset id'sine taşınıyor. */
const ESKI_ID = {
  "gogus-press":"0289", "omuz-press":"0405", "yan-kaldiris":"0334", "pike-sinav":"c002",

const KEY="salonDefteri.v1";
let state={tab:"home",sessions:[],meals:{},hedefProtein:150,besinTarih:null,
  programs:[],active:null,exIndex:0,openEx:null,openHist:null,donem:"hafta",otoDosya:true,
  kat:{q:"",bolge:"",ekip:"",limit:60},duzenle:null,secici:null,bildirim:false,saglayici:"gemini",modeller:{},kotaDolu:{}};
let restTimer=null,restBitis=0,sayacBas=0,sayacBitti=null,sayacTipi="dinlenme",clockTimer=null,kayitYeri="yok";

function lsGet(k){ try{ return window.localStorage ? localStorage.getItem(k) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ if(window.localStorage){ localStorage.setItem(k,v); return true; } }catch(e){} return false; }

/* Eski kayitlari yeni semaya tasir: slug -> dataset id, program bilgisi, set tipi. */
function migrasyonYap(){
  let degisti=false;
  state.sessions.forEach(s=>{
    if(!s.program){
      const ad=(s.gun==="A"||s.gun==="B")?("G\u00fcn "+s.gun):String(s.gun||"Antrenman");
      s.program={id:String(s.gun||"?"),ad}; degisti=true;
    }
    (s.kayitlar||[]).forEach(k=>{
      if(ESKI_ID[k.id]){ k.id=ESKI_ID[k.id]; degisti=true; }
      if(!k.tip){ k.tip=tipOf(k.id); degisti=true; }
    });
  });
  return degisti;
}

async function loadAll(){
  let ham=null;
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value){ ham=r.value; kayitYeri="uygulama haf\u0131zas\u0131"; } } }catch(e){}
  if(!ham){ const l=lsGet(KEY); if(l){ ham=l; kayitYeri="telefon haf\u0131zas\u0131"; } }
  if(ham){ try{
    const d=JSON.parse(ham);
    state.sessions=d.sessions||[];
    state.meals=d.meals||{};
    if(d.hedefProtein) state.hedefProtein=d.hedefProtein;
    if(typeof d.otoDosya==="boolean") state.otoDosya=d.otoDosya;
    if(typeof d.bildirim==="boolean") state.bildirim=d.bildirim;
    if(d.saglayici&&SAGLAYICI[d.saglayici]) state.saglayici=d.saglayici;
    if(d.modeller&&typeof d.modeller==="object") state.modeller=d.modeller;
    if(d.kotaDolu&&typeof d.kotaDolu==="object") state.kotaDolu=d.kotaDolu;
    if(Array.isArray(d.programs)&&d.programs.length) state.programs=d.programs;
    /* Yarım kalan antrenman. Sayfa yenilenirse (ekran döndürme, tarayıcının
       sekmeyi bellekten atması, uygulamanın kapanıp açılması) kaldığı
       yerden devam eder. 12 saatten eskiyse unutulur. */
    if(d.aktif && d.aktif.baslangic && Date.now()-d.aktif.baslangic < 12*3600*1000){
      state.active=d.aktif;
      const n=(d.aktif.hareketler||[]).length;
      state.exIndex=Math.max(0, Math.min(+d.aktifIndex||0, n-1));
    }
  }catch(e){} }
  if(!state.programs.length) state.programs=varsayilanProgramlar();
  if(migrasyonYap()) await saveAll();
  if(kayitYeri==="yok" && lsSet(KEY+".test","1")) kayitYeri="telefon haf\u0131zas\u0131";
}
async function saveAll(){
  const paket=JSON.stringify({v:3,otoDosya:state.otoDosya,bildirim:state.bildirim,saglayici:state.saglayici,modeller:state.modeller,kotaDolu:state.kotaDolu,hedefProtein:state.hedefProtein,
    programs:state.programs,sessions:state.sessions,meals:state.meals,
    aktif:state.active,aktifIndex:state.exIndex});
  let ok=false;
  try{ if(window.storage){ await window.storage.set(KEY,paket); ok=true; } }catch(e){}
  if(lsSet(KEY,paket)) ok=true;
  return ok;
}

const pad=n=>String(n).padStart(2,"0");
const mmss=s=>pad(Math.floor(s/60))+":"+pad(s%60);
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUNLER=["Paz","Pzt","Sal","Çrş","Prş","Cum","Cmt"];
function gunKey(d){ d=d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function keyToDate(k){ const [y,m,g]=k.split("-").map(Number); return new Date(y,m-1,g); }
function tarihTR(iso){ const d=new Date(iso); return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`; }
function gunAdi(k){
  const d=keyToDate(k), b=gunKey();
  if(k===b) return "Bugün";
  if(k===gunKey(new Date(Date.now()-864e5))) return "Dün";
  return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`;
}
function haftaBasi(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function progById(id){ return state.programs.find(p=>p.id===id)||null; }
function yeniProgId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function progOzet(p){ return p.hareketler.length+" hareket \u00b7 "+p.hareketler.reduce((a,h)=>a+(+h.set||0),0)+" set"; }
function progKisa(ad){ return String(ad||"").split("\u2014")[0].trim()||"Program"; }
/* Son antrenmandan sonraki program; liste sonunda basa doner. */
function sonrakiProgram(){
  if(!state.programs.length) return null;
  const son=state.sessions.length?state.sessions[state.sessions.length-1]:null;
  if(!son) return state.programs[0];
  const pid=(son.program&&son.program.id)||son.gun;
  const i=state.programs.findIndex(p=>p.id===pid);
  return i<0 ? state.programs[0] : state.programs[(i+1)%state.programs.length];
}
/* Bir hareketin en son yapildigi antrenmandaki setleri ve o seansin tarihi. */
function sonKayitBilgi(exId){
  for(let i=state.sessions.length-1;i>=0;i--){
    const s=state.sessions[i];
    const e=(s.kayitlar||[]).find(k=>k.id===exId);
    if(e&&e.setler){ const d=e.setler.filter(x=>x.done); if(d.length) return {setler:d,tarih:s.tarih}; }
  }
  return null;
}
function sonKayit(exId){ const b=sonKayitBilgi(exId); return b?b.setler[b.setler.length-1]:null; }
function gunToplam(k){
  const l=state.meals[k]||[];
  return { p:l.reduce((a,x)=>a+x.p*x.adet,0), k:l.reduce((a,x)=>a+x.k*x.adet,0), n:l.length };
}
function yuvarla(n){ return Math.round(n*10)/10; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function modalAc(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); }
function modalKapat(){ document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") modalKapat(); };

/* --- ANA SAYFA --- */
function renderHome(){
  const bugun=gunKey(), t=gunToplam(bugun), hedef=state.hedefProtein;
  const oran=Math.min(100,Math.round(t.p/hedef*100));
  const prog=sonrakiProgram();
  const hb=haftaBasi(new Date());
  const buHafta=state.sessions.filter(s=>new Date(s.tarih)>=hb).length;
  const sonAnt=state.sessions.length?state.sessions[state.sessions.length-1]:null;
  // bu haftanın protein ortalaması
  let gunler=[],topP=0,say=0;
  for(let i=0;i<7;i++){
    const d=new Date(hb.getTime()+i*864e5);
    if(d>new Date()) break;
    const k=gunKey(d), g=gunToplam(k);
    gunler.push({etiket:GUNLER[d.getDay()][0], p:g.p});
    if(g.n){ topP+=g.p; say++; }
  }
  const ortP=say?Math.round(topP/say):0;
  const enB=Math.max(hedef,...gunler.map(x=>x.p));

  const d=new Date();
  document.getElementById("title").textContent="Özet";
  view.innerHTML=`
    <div class="card">
      <div class="row between"><h3>Bugünün proteini</h3><span class="muted small">${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}</span></div>
      <div class="bignum" style="margin-top:6px;color:${t.p>=hedef?"var(--done)":"var(--prot)"}">${yuvarla(t.p)} <small>/ ${hedef} g</small></div>
      <div class="meter"><i class="${t.p>=hedef?"full":""}" style="width:${oran}%"></i></div>
      <div class="row between small muted">
        <span>${t.p>=hedef?"Hedef tamam":yuvarla(hedef-t.p)+" g kaldı"}</span>
        <span>${Math.round(t.k)} kcal · ${t.n} kayıt</span>
      </div>
      <button class="btn sm" id="goFood" style="margin-top:12px">Yemek ekle</button>
    </div>

    <div class="card">
      <div class="row between"><h3>Sıradaki antrenman</h3>${prog?`<span class="pill on">${progKisa(prog.ad)}</span>`:""}</div>
      ${prog?`<p class="muted small" style="margin-top:6px">${progOzet(prog)}${sonAnt?" · son antrenman "+tarihTR(sonAnt.tarih):""}</p>
      <button class="btn" id="goWorkout">${state.active?"Antrenmana dön":"Antrenmanı başlat"}</button>`
      :`<p class="muted small" style="margin-top:6px">Henüz bir programın yok.</p>
      <button class="btn" id="goWorkout">Program oluştur</button>`}
    </div>

    <div class="card">
      <h3>Bu hafta</h3>
      <div class="stats" style="margin:10px 0 6px">
        <div class="stat"><b>${buHafta}</b><span>antrenman</span></div>
        <div class="stat"><b>${ortP}</b><span>ort. protein</span></div>
        <div class="stat"><b>${gunler.filter(x=>x.p>=hedef).length}</b><span>hedef tutan gün</span></div>
      </div>
      <div class="bars" style="height:80px">${gunler.map(x=>`<div><i class="p ${x.p?"":"empty"}" style="height:${x.p?Math.round(x.p/enB*88)+"%":"3px"}"></i><small>${x.etiket}</small></div>`).join("")}</div>
    </div>

    <button class="btn ghost sm" id="goData">Veri ve yedek</button>`;
  document.getElementById("goFood").onclick=()=>{ state.tab="food"; render(); scrollTo(0,0); };
  document.getElementById("goWorkout").onclick=()=>{
    if(!prog){ state.tab="programs"; render(); scrollTo(0,0); return; }
    if(!state.active) startSession(prog); else { state.tab="workout"; render(); }
  };
  document.getElementById("goData").onclick=()=>{ state.tab="data"; render(); scrollTo(0,0); };
}

/* ==========================================================
   FOTOĞRAFTAN BESİN TAHMİNİ
   Yemek fotoğrafı bir görsel modele gönderilip protein ve kalori tahmini
   alınır. İstersen ikinci bir fotoğrafla (tabakta kalanlar) gerçekten ne
   kadar yediğini hesaplatabilirsin. Tek çevrimiçi özellik; uygulamanın
   geri kalanı çevrimdışı çalışmaya devam eder.

   İki sağlayıcı var. Gemini'nin ücretsiz katmanı olduğu için varsayılan;
   Claude daha iyi sonuç veriyor ama kredi gerektiriyor. İkisi de aynı JSON
   şemasını döndürüyor, üst katman aradaki farkı görmüyor.

   API anahtarı ayrı localStorage kayıtlarında durur: yedek dosyasına ve
   uygulama verisine karışmaz. Uygulama statik bir sayfa olduğu için istek
   tarayıcıdan doğrudan sağlayıcıya gider; anahtar cihazdan çıkmaz ama
   cihazı paylaşan herkes erişebilir.
   ========================================================== */
const SAGLAYICI={
  gemini:{ ad:"Gemini", key:"salonDefteri.geminiKey", onek:/^AIza/,
    konsol:"https://aistudio.google.com/apikey", konsolAd:"Google AI Studio",
    ucretsiz:"ücretsiz katmanı var",
    /* Lite sürümler yüksek hacim için tasarlandığından ücretsiz kotaları
       daha geniş; ağır olanlar daha iyi görsel muhakeme yapıyor. Kesin
       günlük limitler hesaba göre değiştiği için seçimi kullanıcıya
       bırakıyoruz - AI Studio'daki kota sayfası doğrusunu gösteriyor. */
    /* Sıra aynı zamanda düşme zinciri: en iyiden başlar, kota bitince bir
       alttakine geçilir. Aşağı indikçe kota genişliyor, muhakeme zayıflıyor. */
    modeller:[
      {id:"gemini-3.8-flash",      ad:"3.8 Flash", not:"en iyi, dar kota"},
      {id:"gemini-3.5-flash-lite", ad:"3.5 Flash Lite"},
      {id:"gemini-3.1-flash-lite", ad:"3.1 Flash Lite"},
      {id:"gemini-2.5-flash",      ad:"2.5 Flash"},
      {id:"gemini-2.5-flash-lite", ad:"2.5 Flash Lite", not:"en geniş kota"}
    ], varsayilanModel:"gemini-3.8-flash" },
  claude:{ ad:"Claude", key:"salonDefteri.apiKey", onek:/^sk-ant-/,
    konsol:"https://platform.claude.com/settings/keys", konsolAd:"Console → API keys",
    ucretsiz:"kredi gerektirir",
    modeller:[{id:"claude-opus-5", ad:"Opus 5", not:"en iyi"}, {id:"claude-sonnet-5", ad:"Sonnet 5", not:"daha ucuz"}],
    varsayilanModel:"claude-opus-5" }
};
/* Seçilen modelden başlayıp listenin altına inen sıra. Bugün kotası
   dolduğu bilinen modeller atlanıyor; kota günlük sıfırlandığı için
   işaret tarihle tutuluyor. */
function modelZinciri(){
  const sag=aktifSag();
  const hepsi=sag.modeller.map(m=>m.id);
  const secili=(state.modeller||{})[state.saglayici];
  let bas=hepsi.indexOf(secili);
  if(bas<0) bas=Math.max(0,hepsi.indexOf(sag.varsayilanModel));
  const sira=hepsi.slice(bas);
  const bugun=gunKey(), dolu=state.kotaDolu||{};
  const acik=sira.filter(id=>dolu[id]!==bugun);
  return acik.length?acik:sira;   // hepsi doluysa yine de dene, belki sıfırlanmıştır
}
const aktifModel=()=>modelZinciri()[0];
function modelAdi(id){
  const m=aktifSag().modeller.filter(x=>x.id===id)[0];
  return m?m.ad:id;
}
function kotayiIsaretle(id){
  state.kotaDolu=Object.assign({},state.kotaDolu,{[id]:gunKey()});
  saveAll();
}
const aktifSag=()=>SAGLAYICI[state.saglayici]||SAGLAYICI.gemini;
const apiAnahtar=sag=>lsGet((sag||aktifSag()).key)||"";

const OLCEK_KURALI=`Porsiyonu gözünle tahmin etme. Fotoğrafta boyutu bilinen bir nesne ara ve onu ölçek olarak kullan. Öncelik sırası:
1. Çatal, kaşık, bıçak (yemek kaşığı ve çatal ~19 cm, çay kaşığı ~13 cm)
2. Tabak veya kase (yemek tabağı ~26 cm, kase ~15 cm çap)
3. Bardak, kupa, kutu içecek (çay bardağı ~8 cm, kutu ~12 cm yükseklik)
4. El veya parmak (yetişkin avuç içi ~10 cm, başparmak ~6 cm)
Hangisini kullandığını "olcek" alanında yaz. Ölçek alınacak hiçbir nesne yoksa "olcek" alanına "ölçek nesnesi yok" yaz, tipik bir porsiyon varsay ve "guven" değerini "dusuk" yap.`;

const NOT_KURALI=`Kullanıcı bir not yazmışsa ona mutlaka uy - not, fotoğrafta görünmeyen ama tahmini doğrudan değiştiren bilgiyi taşır:
- Pişirme şekli ("yağsız", "tuzsuz", "kızartma", "tereyağlı") kaloriyi değiştirir.
- Paylaşım ("ikimiz yiyeceğiz", "üç kişiyiz") varsa YALNIZCA kullanıcının payını ver ve bunu "porsiyon" alanında belirt.
- Miktar düzeltmesi ("yarısını yedim", "iki kaşık aldım") varsa onu esas al.

Sana önceki bir tahmin ve kullanıcının düzeltmesi verilirse, düzeltmeyi uygulayıp tahmini yeniden hesapla. Kullanıcının değinmediği kalemleri olduğu gibi koru.`;

const SISTEM_TEK=`Sana gönderilen yemek fotoğrafındaki porsiyonun protein ve kalori miktarını tahmin ediyorsun.

${OLCEK_KURALI}

Tabaktaki her yiyeceği "kalemler" dizisine ayrı ayrı yaz: adı, tahmini porsiyonu, proteini ve kalorisi. Tek bir yiyecek varsa da tek elemanlı dizi ver. "protein_g" ve "kalori" alanları kalemlerin toplamı olmalı. "ad" alanına tabakta ne olduğunu kısaca yaz. Pişirme yağı, sos ve garnitürleri de hesaba kat.

${NOT_KURALI}

"not" alanına tahmini nasıl yaptığını bir cümleyle açıkla.`;

const SISTEM_KALAN=`Sana aynı öğünün iki fotoğrafı gönderiliyor: birincisi yemeğe başlamadan önceki tabak, ikincisi yemekten sonra kalanlar.

İkisini karşılaştır ve YENEN miktarın protein ve kalorisini ver - tabağın tamamını değil. Aynı öğün olduğu için ölçek iki fotoğrafta da aynıdır; önce birinci fotoğraftaki toplamı belirle, sonra ikincide ne kaldığını çıkar.

${OLCEK_KURALI}

Yenen oranı "yenen_yuzde" alanına yaz (0-100). Tabak boşaldıysa 100, hiç dokunulmadıysa 0.
"ad" alanına yemeğin adını, "porsiyon" alanına yenen miktarı yaz (örn. "tabağın ~%70'i, ~220 g").
Yenen kısmı "kalemler" dizisinde yiyecek yiyecek de ayır; "protein_g" ve "kalori" bu kalemlerin toplamı olmalı.

${NOT_KURALI}

"not" alanına iki fotoğrafı nasıl karşılaştırdığını bir cümleyle açıkla.`;

const SISTEM_METIN=`Kullanıcı ne yediğini yazıyor; protein ve kalori miktarını tahmin ediyorsun.

Yazdığı miktar birimlerini esas al ("bir kase", "iki dilim", "bir avuç", "yarım tabak"). Türkiye'de tipik porsiyonlar:
- yemek kaşığı ~15 g, çay bardağı ~100 ml, su bardağı ~200 ml
- bir dilim ekmek ~25 g, bir kase çorba ~250 ml, bir avuç kuruyemiş ~30 g
- bir porsiyon et/tavuk ~150 g, bir porsiyon pilav/makarna ~180 g, bir orta boy yumurta ~50 g

Miktar hiç belirtilmemişse tipik bir porsiyon varsay ve "guven" değerini "dusuk" yap.
"olcek" alanına neye dayandığını yaz (örn. "yazdığın miktarlar" ya da "tipik porsiyonlar").

Yazdığı her yiyeceği "kalemler" dizisine ayrı ayrı koy: adı, varsaydığın porsiyonu, proteini ve kalorisi. "protein_g" ve "kalori" bu kalemlerin toplamı olmalı. "ad" alanına öğünün kısa adını yaz. Pişirme yağı ve sosları da hesaba kat.

${NOT_KURALI}

"not" alanına tahmini neye göre yaptığını bir cümleyle açıkla.`;

function fotoSema(kalanVar){
  const alan={
    ad:{type:"string",description:"Yemeğin kısa adı"},
    porsiyon:{type:"string",description:"Tahmini miktar"},
    olcek:{type:"string",description:"Ölçek olarak kullanılan nesne"},
    protein_g:{type:"number"}, kalori:{type:"number"},
    guven:{type:"string",enum:["yuksek","orta","dusuk"]},
    not:{type:"string"},
    kalemler:{type:"array",description:"Tabaktaki yiyecekler tek tek",
      items:{type:"object",properties:{
        ad:{type:"string"}, porsiyon:{type:"string"},
        protein_g:{type:"number"}, kalori:{type:"number"}
      },required:["ad","porsiyon","protein_g","kalori"]}}
  };
  const gerekli=["ad","porsiyon","olcek","protein_g","kalori","guven","not","kalemler"];
  if(kalanVar){ alan.yenen_yuzde={type:"number",description:"Yenen oran, 0-100"}; gerekli.push("yenen_yuzde"); }
  return {type:"object",properties:alan,required:gerekli};
}

/* Sağlayıcıdan bağımsız iç biçim: [{metin},{gorsel}] */
function istekGovdesi(model, parcalar, sema, sistem, maxTokens, anahtar){
  if(state.saglayici==="claude"){
    return {url:"https://api.anthropic.com/v1/messages", ayar:{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":anahtar,
        "anthropic-version":"2023-06-01",
        /* tarayıcıdan doğrudan çağrı için gerekli; bu başlık olmadan
           istek CORS'a takılır ve sunucuya hiç ulaşmaz */
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:model,
        max_tokens:maxTokens||4000,
        system:sistem,
        output_config:{format:{type:"json_schema",schema:sema}},
        messages:[{role:"user",content:parcalar.map(p=>p.gorsel
          ? {type:"image",source:{type:"base64",media_type:"image/jpeg",data:p.gorsel}}
          : {type:"text",text:p.metin})}]
      })
    }};
  }
  /* Gemini: sistem istemi ilk metin parçası olarak gidiyor, ayrı alanı yok */
  return {url:"https://generativelanguage.googleapis.com/v1beta/interactions", ayar:{
    method:"POST",
    headers:{"content-type":"application/json","x-goog-api-key":anahtar},
    body:JSON.stringify({
      model:model,
      input:[{type:"text",text:sistem}].concat(parcalar.map(p=>p.gorsel
        ? {type:"image",data:p.gorsel,mime_type:"image/jpeg"}
        : {type:"text",text:p.metin})),
      response_format:{type:"text",mime_type:"application/json",schema:sema}
    })
  }};
}

async function hataMetni(yanit, sag, model){
  let ek="";
  try{
    const h=await yanit.json();
    /* Gemini hatayı dizi içinde döndürebiliyor */
    const g=Array.isArray(h)?h[0]:h;
    ek=(g&&g.error&&g.error.message)||"";
  }catch(e){}
  if(/credit balance/i.test(ek))
    return `Anahtar geçerli ama ${sag.ad} hesabında kredi yok.`;
  if(/API key not valid|API key expired|API_KEY_INVALID|api key is invalid/i.test(ek))
    return `Anahtar kabul edilmedi — ${sag.konsolAd}'den yeni bir anahtar al.`;
  if(yanit.status===429)
    return "Kota ya da hız sınırına takıldı ("+(model||aktifModel())+")."+(ek?" — "+ek:"");
  if(yanit.status===404||/not found|not supported|does not exist/i.test(ek))
    return "Model bulunamadı ya da bu isteği desteklemiyor ("+(model||aktifModel())
      +")."+(ek?" — "+ek:"");
  const on={401:"Anahtar kabul edilmedi", 403:"Bu anahtarın yetkisi yok",
            400:"İstek reddedildi",
            503:"Sunucu yoğun. Birkaç kez denedim, hepsi meşgul döndü - biraz bekleyip tekrar dene",
            529:"Sunucu yoğun, biraz bekleyip tekrar dene"}[yanit.status]
            || ("API hatası "+yanit.status);
  /* Sağlayıcının kendi açıklaması teşhis için en değerli bilgi, saklama */
  return on+(ek?" — "+ek:"");
}

const uyu=ms=>new Promise(r=>setTimeout(r,ms));
/* Ücretsiz katmanda model yoğunken 503 sık geliyor ve geçici; elle tekrar
   denemek yerine kendimiz deniyoruz. 4xx'lerin çoğu kalıcı, onları denemiyoruz. */
const GECICI_DURUM=[408,429,500,502,503,504,529];

async function tekModelIstek(model, parcalar, sema, sistem, maxTokens, anahtar, sag, ilerle){
  const istek=istekGovdesi(model,parcalar,sema,sistem,maxTokens,anahtar);
  const enFazla=3;
  for(let deneme=1;;deneme++){
    let yanit;
    try{ yanit=await fetch(istek.url,istek.ayar); }
    catch(e){
      if(deneme<enFazla){ if(ilerle) ilerle("Bağlanılamadı, yeniden deneniyor ("+(deneme+1)+"/"+enFazla+")"); await uyu(800*deneme); continue; }
      throw new Error("Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.");
    }
    if(yanit.ok){
      const d=await yanit.json();
      if(d.stop_reason==="refusal") throw new Error("Model bu fotoğrafı değerlendirmedi");
      return jsonAyikla(yanitMetni(d));
    }
    /* 429 ve "model yok" durumlarını zincire bildiriyoruz: bu modelde
       ısrar etmek yerine bir alttakine geçmek daha hızlı çözüm. */
    if(yanit.status===429||yanit.status===404){
      const hata=new Error(await hataMetni(yanit,sag,model));
      hata.modelDegistir=true;
      hata.gunlukKota=yanit.status===429;
      throw hata;
    }
    if(GECICI_DURUM.indexOf(yanit.status)>=0 && deneme<enFazla){
      /* sunucu ne kadar bekleneceğini söylüyorsa ona uy */
      const sonra=yanit.headers&&yanit.headers.get?+(yanit.headers.get("retry-after")||0):0;
      if(ilerle) ilerle("Sunucu meşguldü, yeniden deneniyor ("+(deneme+1)+"/"+enFazla+")");
      await uyu(Math.max(sonra*1000, 900*Math.pow(2,deneme-1)));
      continue;
    }
    throw new Error(await hataMetni(yanit,sag,model));
  }
}

async function yzIstek(parcalar, sema, sistem, maxTokens, ilerle){
  const sag=aktifSag(), anahtar=apiAnahtar(sag);
  if(!anahtar) throw new Error(sag.ad+" anahtarı girilmemiş");
  const zincir=modelZinciri();
  let son=null;
  for(let i=0;i<zincir.length;i++){
    try{
      return await tekModelIstek(zincir[i],parcalar,sema,sistem,maxTokens,anahtar,sag,ilerle);
    }catch(e){
      son=e;
      if(!e.modelDegistir || i===zincir.length-1) throw e;
      if(e.gunlukKota) kotayiIsaretle(zincir[i]);
      if(ilerle) ilerle(modelAdi(zincir[i])+" kotası doldu, "+modelAdi(zincir[i+1])+" deneniyor");
      await uyu(300);
    }
  }
  throw son;
}

/* Claude metni content[] içinde; Gemini yanıtı adımlara bölüyor ve metin
   model_output adımının content[]'inde duruyor (düşünme adımları ayrı). */
function yanitMetni(d){
  if(state.saglayici==="claude")
    return (d.content||[]).filter(c=>c&&c.type==="text").map(c=>c.text).join("");
  const adimlar=Array.isArray(d.steps)?d.steps:[];
  const metin=adimlar
    .filter(a=>a&&a.type==="model_output")
    .reduce((t,a)=>t.concat(Array.isArray(a.content)?a.content:[]),[])
    .filter(c=>c&&c.type==="text")
    .map(c=>c.text).join("");
  return metin || d.output_text || "";
}

/* Şema istesek de model JSON'u ``` içine alabiliyor ya da başına bir cümle
   ekleyebiliyor; kabuğu soyup öyle ayrıştırıyoruz. Hiç olmazsa gelen metnin
   başını hataya koyuyoruz, yoksa sorun teşhis edilemiyor. */
function jsonAyikla(metin){
  const t=String(metin||"").trim();
  const cit=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const ham=cit?cit[1].trim():t;
  try{ return JSON.parse(ham); }catch(e){}
  const ilk=ham.indexOf("{"), son=ham.lastIndexOf("}");
  if(ilk>=0&&son>ilk){ try{ return JSON.parse(ham.slice(ilk,son+1)); }catch(e){} }
  const ornek=ham.slice(0,140).replace(/\s+/g," ");
  throw new Error("Yanıt okunamadı"+(ornek?" — gelen: "+ornek:" — yanıt boş geldi"));
}

/* Uzun kenarı 1024 px'e indirip JPEG'e çevirir: yemek fotoğrafı için
   fazlasıyla yeterli, istek boyutunu ve görsel token maliyetini düşürür. */
function fotoKucult(dosya, uzunKenar=1024, kalite=0.8){
  return new Promise((coz,yan)=>{
    const img=new Image(), url=URL.createObjectURL(dosya);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const olcek=Math.min(1, uzunKenar/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*olcek)), h=Math.max(1,Math.round(img.height*olcek));
      const c=document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const veri=c.toDataURL("image/jpeg",kalite);
      coz(veri.slice(veri.indexOf(",")+1));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); yan(new Error("Fotoğraf okunamadı")); };
    img.src=url;
  });
}

/* Kamera/galeri seçici. Kullanıcı hareketi içinde çağrılmalı. */
function fotoSec(){
  return new Promise(coz=>{
    const inp=document.createElement("input");
    inp.type="file"; inp.accept="image/*"; inp.capture="environment";
    inp.onchange=()=>coz(inp.files&&inp.files[0]||null);
    inp.click();
  });
}

        const yeni=await durum.yeniden({onceki:sonuc,duzeltme:metin});

/* --- ANTRENMAN --- */
/* Tek bir set satiri. Hem ilk cizimde hem "+ Set ekle" ile kullaniliyor. */
function setSatiri(st,i,h,birim){
  return `
          <div class="setrow ${st.done?"done":""}">
            <div class="setno">Set ${i+1}</div>
            <div class="unit">${h.tip==="kg"
              ? `<input type="number" inputmode="decimal" step="0.5" data-f="kg" data-set="${i}" value="${st.kg??""}"><span>kg</span>`
              : `<div class="tick" style="border-style:dashed;font-size:13px">${h.tip==="sure"?"süre":"vücut"}</div>`}</div>
            <div class="unit"><input type="number" inputmode="numeric" data-f="tekrar" data-set="${i}" value="${st.tekrar??""}"><span>${birim}</span></div>
            <button class="tick" data-done="${i}">${st.done?"✓":"○"}</button>
          </div>`;
}
/* Rozet, programdaki hedefi degil ekrandaki gercek set sayisini gosterir. */
function setEtiketi(kayit,h){
  return kayit.setler.length+" × "+h.tekrar+(h.tip==="sure"?" sn":"");
}
function renderWorkout(){
  if(!state.active){
    clearInterval(clockTimer);
    document.getElementById("title").textContent="Antrenman";
    const prog=sonrakiProgram();
    if(!prog){
      view.innerHTML=`
        <div class="card">
          <h2>Henüz program yok</h2>
          <p class="muted small" style="margin-top:6px">Bir program oluştur, sonra Hareketler sekmesinden içine hareket ekle.</p>
          <button class="btn" id="goProg" style="margin-top:12px">Program oluştur</button>
        </div>`;
      document.getElementById("goProg").onclick=()=>{ state.tab="programs"; render(); scrollTo(0,0); };
      return;
    }
    const digerleri=state.programs.filter(p=>p.id!==prog.id);
    view.innerHTML=`
      <div class="card">
        <div class="row between"><h2>${prog.ad}</h2><span class="pill on">Sıradaki</span></div>
        <p class="muted small" style="margin:6px 0 4px">${state.sessions.length?"Son antrenman: "+tarihTR(state.sessions[state.sessions.length-1].tarih):"İlk antrenmanın. Kutulardaki değerler başlangıç önerisi — kolay gelirse artır."}</p>
        ${prog.hareketler.length? prog.hareketler.map(h=>{
          const e=EX[h.ex], sk=sonKayit(h.ex), o=oneriOf(h.ex), br=h.tip==="sure"?" sn":"";
          const oner = sk ? ((sk.kg?sk.kg+" kg × ":"")+sk.tekrar+br)
                          : ((o.kg?o.kg+" kg × ":"")+(o.tekrar!=null?o.tekrar:10)+br);
          return `<div class="exitem">
            <span class="plate" style="width:44px;height:44px">${e?`<img src="${exImg(e)}" loading="lazy" alt="" onerror="this.style.display='none'">`:""}</span>
            <span class="nm"><b>${exAd(h.ex)}</b><span class="muted small">${h.set} set · ${oner}</span></span>
          </div>`;}).join("")
        : `<p class="muted small">Bu programda hareket yok.</p>`}
        <button class="btn" id="startBtn" style="margin-top:14px" ${prog.hareketler.length?"":"disabled"}>Antrenmanı başlat</button>
      </div>
      ${digerleri.length?`<div class="card">
        <h3 style="margin-bottom:4px">Diğer programlar</h3>
        ${digerleri.map(p=>`<button class="exitem" data-start="${p.id}">
          <span class="nm"><b>${p.ad}</b><span class="muted small">${progOzet(p)}</span></span>
          <span class="muted">Başlat ›</span></button>`).join("")}
      </div>`:""}
      <button class="btn ghost sm" id="goProg">Programları düzenle</button>`;
    const sb=document.getElementById("startBtn");
    if(prog.hareketler.length) sb.onclick=()=>startSession(prog);
    view.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startSession(progById(b.dataset.start)));
    document.getElementById("goProg").onclick=()=>{ state.tab="programs"; render(); scrollTo(0,0); };
    return;
  }

  const s=state.active, h=s.hareketler[state.exIndex], e=EX[h.ex], kayit=s.kayitlar[state.exIndex];
  const sk=sonKayit(h.ex), o=ov(h.ex), birim=h.tip==="sure"?"sn":"tekrar";
  document.getElementById("title").textContent=progKisa(s.program.ad);
  view.innerHTML=`
    <div class="progress">${s.hareketler.map((_,i)=>`<i class="${i<=state.exIndex?"on":""}"></i>`).join("")}</div>
    <div class="card">
      <div class="stage">
        <div class="media">${e?`<img src="${exGif(e)}" alt="${exAd(h.ex)}" onerror="this.style.display='none'">`:""}</div>
        <div class="stage-cap"><span>${e?kasTR(e.t):""}</span><span>${e?ekipTR(e.q):""}</span></div>
      </div>
      <div class="row between" style="margin-top:12px"><h2>${exAd(h.ex)}</h2><span class="pill" id="setPill">${setEtiketi(kayit,h)}</span></div>
      <p class="muted small" style="margin-top:4px">${o&&o.ipucu?o.ipucu:(e?bolgeTR(e.c):"")}${sk?" · Geçen sefer: "+(sk.kg?sk.kg+" kg × ":"")+sk.tekrar+" "+birim:" · Kutularda başlangıç önerisi var"}</p>
      <div id="setler" style="margin-top:12px">
        ${kayit.setler.map((st,i)=>setSatiri(st,i,h,birim)).join("")}
      </div>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn quiet sm" id="setSil">− Set çıkar</button>
        <button class="btn quiet sm" id="setEkle">+ Set ekle</button>
      </div>
      ${e?`<details style="margin-top:12px"><summary class="muted small">Nasıl yapılır</summary>
        <ol class="steps small" style="margin-top:8px">${e.d.map(a=>`<li>${a}</li>`).join("")}</ol>
        ${o&&o.hatalar?`<h3 style="margin-top:12px">Sık yapılan hatalar</h3>
        <ul class="warn small">${o.hatalar.map(a=>`<li>${a}</li>`).join("")}</ul>`:""}</details>`:""}
    </div>
    <div class="row" style="gap:8px">
      <button class="btn quiet" id="prevEx" ${state.exIndex===0?"disabled":""}>Önceki</button>
      <button class="btn" id="nextEx">${state.exIndex===s.hareketler.length-1?"Son hareket":"Sonraki"}</button>
    </div>
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn ghost sm" id="exCikar">Hareketi çıkar</button>
      <button class="btn ghost sm" id="exEkle">+ Hareket ekle</button>
    </div>
    <button class="btn ghost" id="finish" style="margin-top:10px">Antrenmanı bitir</button>`;

  /* Dinleyiciler tek tek satirlara degil kapsayiciya baglaniyor: sonradan
     eklenen set satirlari icin yeniden baglama gerekmiyor, ve set
     isaretlenince tum ekrani yeniden cizmedigimiz icin GIF bastan baslamiyor. */
  const setKutu=document.getElementById("setler");
  setKutu.oninput=ev=>{
    const inp=ev.target;
    if(!inp.dataset||inp.dataset.f===undefined) return;
    kayit.setler[+inp.dataset.set][inp.dataset.f]= inp.value===""?null:+inp.value;
  };
  /* Seti tamamlar: sn verilirse gerçekleşen süreyi kutuya yazar. */
  const setiBitir=(i,sn)=>{
    const st=kayit.setler[i], satir=setKutu.querySelectorAll(".setrow")[i];
    if(sn!=null){
      st.tekrar=sn;
      const inp=satir.querySelector('[data-f="tekrar"]');
      if(inp) inp.value=sn;
    }
    st.done=true;
    satir.classList.add("done");
    satir.querySelector("[data-done]").textContent="✓";
    const kalan=kayit.setler.filter(x=>!x.done).length;
    saveAll();
    startRest(h.mola, kalan>0?`Sonraki: ${exAd(h.ex)} · set ${i+2}`:"Bu hareket bitti");
  };
  setKutu.onclick=ev=>{
    const b=ev.target.closest("[data-done]");
    if(!b) return;
    const i=+b.dataset.done, st=kayit.setler[i];
    if(st.done){                                  // işareti geri al
      st.done=false;
      b.closest(".setrow").classList.remove("done");
      b.textContent="○";
      saveAll();
      return;
    }
    /* Plank gibi süreli hareketlerde tik önce sayacı başlatır; set, süre
       dolunca ya da "Bitir"e basılınca geçen süreyle kapanır. */
    if(h.tip==="sure"){
      const hedef=Math.max(1, +st.tekrar || parseInt(h.tekrar,10) || 30);
      startHold(hedef, `${exAd(h.ex)} · set ${i+1}`, gecen=>setiBitir(i,gecen));
      return;
    }
    setiBitir(i,null);
  };
  const setSilBtn=document.getElementById("setSil");
  const setDurum=()=>{
    document.getElementById("setPill").textContent=setEtiketi(kayit,h);
    setSilBtn.disabled = kayit.setler.length<=1;
  };
  setDurum();
  document.getElementById("setEkle").onclick=()=>{
    if(kayit.setler.length>=20){ toast("Bir harekette en fazla 20 set"); return; }
    const son=kayit.setler[kayit.setler.length-1]||{};
    kayit.setler.push({kg:son.kg??null, tekrar:son.tekrar??null, done:false});
    const i=kayit.setler.length-1;
    setKutu.insertAdjacentHTML("beforeend", setSatiri(kayit.setler[i],i,h,birim));
    setDurum(); saveAll();
  };
  /* Sondaki seti cikarir; en az bir set kalir. */
  setSilBtn.onclick=()=>{
    if(kayit.setler.length<=1) return;
    const cikan=kayit.setler.pop();
    setKutu.lastElementChild.remove();
    setDurum(); saveAll();
    if(cikan.done) toast("İşaretli set çıkarıldı");
  };
  document.getElementById("prevEx").onclick=()=>{ if(state.exIndex>0){state.exIndex--;saveAll();renderWorkout();scrollTo(0,0);} };
  document.getElementById("nextEx").onclick=()=>{
    if(state.exIndex<s.hareketler.length-1){ state.exIndex++; saveAll(); renderWorkout(); scrollTo(0,0); }
    else bitirSor();
  };
  /* Antrenman sürerken programa değil, yalnızca bu seansa dokunur. */
  document.getElementById("exEkle").onclick=()=>{
    state.secici={seans:true};
    state.tab="guide"; state.kat.limit=60; state.openEx=null;
    render(); scrollTo(0,0);
  };
  document.getElementById("exCikar").onclick=()=>{
    if(s.hareketler.length<=1){ toast("Antrenmanda en az bir hareket kalmalı"); return; }
    const cikar=()=>{
      s.hareketler.splice(state.exIndex,1);
      s.kayitlar.splice(state.exIndex,1);
      if(state.exIndex>=s.hareketler.length) state.exIndex=s.hareketler.length-1;
      saveAll(); renderWorkout(); scrollTo(0,0);
      toast("Hareket antrenmandan çıkarıldı");
    };
    const yapilan=kayit.setler.filter(x=>x.done).length;
    if(!yapilan) return cikar();
    modalAc(`
      <h2>Hareketi çıkar</h2>
      <p class="muted small">${exAd(h.ex)} için ${yapilan} işaretli set var, bu kayıt silinecek.</p>
      <button class="btn danger" id="hEvet">Çıkar</button>
      <button class="btn ghost" id="hHayir">Vazgeç</button>`);
    document.getElementById("hEvet").onclick=()=>{ modalKapat(); cikar(); };
    document.getElementById("hHayir").onclick=modalKapat;
  };
  document.getElementById("finish").onclick=bitirSor;
}

/* Bir hareket icin seans kaydi. adet verilmezse gecen antrenmandaki set
   sayisi, o da yoksa programdaki hedef kullanilir. Kilo ve tekrar her zaman
   gecen antrenmandan set set tasinir. */
function kayitOlustur(h,adet){
  const onceki=sonKayitBilgi(h.ex), o=oneriOf(h.ex);
  const gecmis = onceki ? onceki.setler : null;
  const n = adet!=null ? adet : (gecmis ? gecmis.length : h.set);
  return { id:h.ex, tip:h.tip, setler:Array.from({length:n},(_,i)=>{
    const ref = gecmis ? (gecmis[i]||gecmis[gecmis.length-1]) : null;
    const kg = h.tip==="kg" ? (ref&&ref.kg!=null?ref.kg:(o.kg!=null?o.kg:null)) : null;
    const tk = ref&&ref.tekrar!=null ? ref.tekrar : (o.tekrar!=null?o.tekrar:null);
    return {kg,tekrar:tk,done:false};
  })};
}

function startSession(prog){
  if(!prog||!prog.hareketler.length) return;
  /* Program anlık kopyalanır: seans sürerken programı düzenlemek seansı bozmaz. */
  const hareketler=prog.hareketler.map(h=>({
    ex:h.ex, set:Math.max(1,+h.set||1), tekrar:h.tekrar, mola:Math.max(0,+h.mola||60), tip:h.tip||tipOf(h.ex)
  }));
  state.active={
    id:"s"+Date.now(), tarih:new Date().toISOString(),
    gun:prog.id, program:{id:prog.id,ad:prog.ad}, hareketler,
    baslangic:Date.now(), sure:0,
    /* Gecen antrenmanda ne yaptiysan onunla basla: set sayisi, kilo ve
       tekrar set set birebir tasinir. Programi o antrenmandan SONRA
       duzenlediysen programdaki hedef gecerli olur. */
    kayitlar:hareketler.map(h=>{
      /* Program duzenlemesi yalnizca SET SAYISINI belirler; kilo ve tekrar
         her zaman gecen antrenmandan gelir. */
      const onceki=sonKayitBilgi(h.ex);
      const programDahaYeni = prog.duzenlendi && (!onceki || prog.duzenlendi > Date.parse(onceki.tarih));
      return kayitOlustur(h, programDahaYeni ? h.set : null);
    })
  };
  state.exIndex=0; state.tab="workout"; state.duzenle=null; state.secici=null; state.openEx=null;
  saatBaslat();
  render(); scrollTo(0,0);
}

/* Süre başlangıç anından hesaplanıyor, tik sayısından değil; uygulama arka
   planda kalsa da geri dönünce doğru süreyi gösterir. */
function saatBaslat(){
  clearInterval(clockTimer);
  const yaz=()=>{
    if(!state.active) return;
    const el=document.getElementById("clock");
    if(el) el.textContent=mmss(Math.floor((Date.now()-state.active.baslangic)/1000));
  };
  yaz();
  clockTimer=setInterval(yaz,1000);
}

function bitirSor(){
  const s=state.active; if(!s) return;
  const yapilan=s.kayitlar.reduce((a,k)=>a+k.setler.filter(x=>x.done).length,0);
  const sure=mmss(Math.floor((Date.now()-s.baslangic)/1000));
  modalAc(`
    <h2>Antrenmanı bitir</h2>
    <p class="muted small">${yapilan} set işaretledin · ${sure} sürdü.</p>
    ${yapilan?`<button class="btn" id="mSave">Kaydet ve bitir</button>`:`<p class="muted small">Hiç set işaretlemedin, kaydedecek bir şey yok.</p>`}
    <button class="btn quiet" id="mDrop">Kaydetmeden çık</button>
    <button class="btn ghost" id="mBack">Vazgeç, devam et</button>`);
  const sv=document.getElementById("mSave"); if(sv) sv.onclick=()=>{ modalKapat(); kaydetVeBitir(); };
  document.getElementById("mDrop").onclick=async()=>{
    modalKapat();
    state.active=null; clearInterval(clockTimer);
    /* Diskteki yarım seans kopyasını da sil; yoksa her yenilemede geri gelir. */
    await saveAll();
    state.tab="home"; render(); toast("Antrenman kaydedilmedi");
  };
  document.getElementById("mBack").onclick=modalKapat;
}

async function kaydetVeBitir(){
  const s=state.active;
  s.sure=Math.floor((Date.now()-s.baslangic)/1000);
  s.kayitlar.forEach(k=>{ k.setler=k.setler.filter(x=>x.done); });
  s.kayitlar=s.kayitlar.filter(k=>k.setler.length);
  s.hacim=s.kayitlar.reduce((a,k)=>a+k.setler.reduce((b,x)=>b+((x.kg||0)*(x.tekrar||0)),0),0);
  delete s.hareketler;
  state.sessions.push(s);
  state.active=null;
  clearInterval(clockTimer);
  const ok=await saveAll();
  if(state.otoDosya) dosyayaAktar(true);
  state.tab="stats"; render();
  toast(ok?`Kaydedildi · ${mmss(s.sure)}`:"Kaydedildi, ama telefon hafızası kapalı. Veri sekmesinden dosyaya aktar.");
}

/* --- PROGRAMLAR --- */
function renderPrograms(){
  if(state.duzenle) return renderProgramDuzenle();

/* katalogdan seçilen hareketi bir programa ekler */
function ekleSheet(exId){
  /* Sürmekte olan antrenmana mı, bir programa mı ekleniyor? */
  const seansaMi = !!(state.secici && state.secici.seans && state.active);
  const hedefProg=(!seansaMi && state.secici)?progById(state.secici.progId):null;
  if(!seansaMi && !hedefProg && !state.programs.length){ toast("Önce bir program oluştur"); return; }
  const o=oneriOf(exId);
  const y={ tip:tipOf(exId), set:3, tekrar:"", mola:0 };
  y.tekrar=String(y.tip==="sure"?(o.tekrar!=null?o.tekrar:30):(o.tekrar!=null?o.tekrar:10));
  y.mola=y.tip==="kg"?90:60;
  let secilen=hedefProg?hedefProg.id:(state.programs[0]?state.programs[0].id:null);

  const ciz=()=>{
    modalAc(`
      <h2>Programa ekle</h2>
      <p class="muted small">${exAd(exId)}</p>
      ${seansaMi?`<p class="small" style="margin-top:12px">Sürmekte olan antrenmana eklenecek</p>`
        :hedefProg?`<p class="small" style="margin-top:12px">Program: <b>${hedefProg.ad}</b></p>`
        :`<p class="muted small" style="margin:12px 0 6px">Hangi programa?</p>
          <div class="seg sm" style="flex-wrap:wrap">${state.programs.map(p=>`<button data-p="${p.id}" class="${p.id===secilen?"on":""}">${progKisa(p.ad)}</button>`).join("")}</div>`}
      <p class="muted small" style="margin:12px 0 6px">Nasıl sayılsın?</p>
      <div class="seg sm">
        <button data-t="kg" class="${y.tip==="kg"?"on":""}">Ağırlıklı</button>
        <button data-t="vucut" class="${y.tip==="vucut"?"on":""}">Vücut ağırlığı</button>
        <button data-t="sure" class="${y.tip==="sure"?"on":""}">Süre</button>
      </div>
      <div class="editgrid">
        <div><label>Set</label><input type="number" inputmode="numeric" id="nSet" value="${y.set}"></div>
        <div><label>${y.tip==="sure"?"Saniye":"Tekrar"}</label><input type="text" id="nTek" value="${String(y.tekrar).replace(/"/g,"&quot;")}"></div>
        <div><label>Mola (sn)</label><input type="number" inputmode="numeric" id="nMola" value="${y.mola}"></div>
      </div>
      <button class="btn" id="nOk">Ekle</button>
      <button class="btn ghost" id="nIptal">Vazgeç</button>`);
    const sheet=document.getElementById("modalBody");
    const oku=()=>{
      y.set=Math.max(1,Math.min(20,+sheet.querySelector("#nSet").value||3));
      y.tekrar=sheet.querySelector("#nTek").value.trim()||"10";
      y.mola=Math.max(0,Math.min(600,+sheet.querySelector("#nMola").value||60));
    };
    sheet.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ oku(); secilen=b.dataset.p; ciz(); });
    sheet.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ oku(); y.tip=b.dataset.t; ciz(); });
    sheet.querySelector("#nOk").onclick=async()=>{
      oku();
      if(seansaMi){
        const h={ex:exId,set:y.set,tekrar:y.tekrar,mola:y.mola,tip:y.tip};
        state.active.hareketler.push(h);
        state.active.kayitlar.push(kayitOlustur(h,y.set));
        state.exIndex=state.active.hareketler.length-1;   // yeni harekete geç
        await saveAll();
        modalKapat();
        toast(exAd(exId)+" antrenmana eklendi");
        state.secici=null; state.openEx=null; state.tab="workout";
        render(); scrollTo(0,0);
        return;
      }
      const p=progById(secilen);
      if(!p){ toast("Program bulunamadı"); return; }
      p.hareketler.push({ex:exId,set:y.set,tekrar:y.tekrar,mola:y.mola,tip:y.tip});
      p.duzenlendi=Date.now();
      await saveAll();
      modalKapat();
      toast(exAd(exId)+" → "+p.ad);
      if(state.secici){ state.secici=null; state.openEx=null; state.duzenle=p.id; state.tab="programs"; }
      render(); scrollTo(0,0);
    };
    sheet.querySelector("#nIptal").onclick=modalKapat;
  };
  ciz();
}
/* --- DİNLENME VE SÜRE SAYACI --- */
/* Aynı tam ekran sayaç iki iş görüyor: setler arası dinlenme, ve plank gibi
   süreli hareketlerde setin kendisi. Fark etiketlerde ve bitişte olanda. */
/* --- BİLDİRİM ---
   Sayaç bittiğinde uygulama arka plandaysa bildirim gönderir. Android'de
   new Notification() desteklenmiyor, service worker üzerinden göndermek
   gerekiyor; masaüstünde ikisi de çalışıyor, SW yoksa geri düşüyoruz. */
function bildirimDurum(){
  if(!("Notification" in window)) return "desteklenmiyor";
  return {granted:"verildi", denied:"reddedildi", "default":"sorulmadı"}[Notification.permission] || Notification.permission;
}
async function bildirimGonder(baslik,govde){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const ayar={body:govde, icon:"icon-192.png", badge:"icon-192.png",
              tag:"salon-sayac", renotify:true, vibrate:[120,80,120]};
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){ await reg.showNotification(baslik,ayar); return; }
  }catch(e){}
  try{ new Notification(baslik,ayar); }catch(e){}
}

/* --- AYRI PENCERE ---
   Document Picture-in-Picture: sayacı, diğer pencerelerin üstünde duran
   küçük bir pencereye taşır. Masaüstü Chrome/Edge'de çalışır. Android'de
   tarayıcılar bir web sayfasının başka uygulamaların üstünde durmasına izin
   vermiyor; orada düğme hiç görünmüyor. */
let pipPencere=null;
function pipDestekli(){ return "documentPictureInPicture" in window; }
function pipGuncelle(){
  if(!pipPencere) return;
  const d=pipPencere.document;
  const yaz=(id,v)=>{ const e=d.getElementById(id); if(e) e.textContent=v; };
  yaz("l", document.getElementById("restLbl").textContent);
  yaz("n", document.getElementById("restNum").textContent);
  yaz("a", document.getElementById("restNext").textContent);
}
async function pipAc(){
  if(!pipDestekli()){ toast("Bu tarayıcı ayrı pencereyi desteklemiyor"); return; }
  if(pipPencere){ pipPencere.focus(); return; }
  try{
    const w=await window.documentPictureInPicture.requestWindow({width:260,height:200});
    const st=w.document.createElement("style");
    st.textContent=`body{margin:0;height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;background:#141A1F;color:#E8EEF2;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;user-select:none}
      #l{color:#8D9BA8;font-size:13px;letter-spacing:.05em}
      #n{font-size:76px;font-weight:700;line-height:1;color:#E0A32E;font-variant-numeric:tabular-nums}
      #a{color:#8D9BA8;font-size:12px;text-align:center;padding:0 12px}`;
    w.document.head.appendChild(st);
    w.document.body.innerHTML=`<div id="l"></div><div id="n">0</div><div id="a"></div>`;
    w.addEventListener("pagehide",()=>{ pipPencere=null; });
    pipPencere=w;
    pipGuncelle();
  }catch(e){ toast("Ayrı pencere açılamadı"); }
}

/* Sayaç duvar saatine göre çalışır. Tarayıcı arka plandaki sekmenin
   setInterval'ini kıstığında geri sayım kaymaz; uygulamaya dönünce doğru
   değere atlar. Bitiş anı restBitis'te tutulur, tik sayısında değil. */
function sayacCiz(){
  const kalan=Math.max(0, Math.round((restBitis-Date.now())/1000));
  document.getElementById("restNum").textContent=kalan;
  pipGuncelle();
  if(kalan<=0) sayacKapat(true);
}
function sayacAc(tip,sn,not,bitince){
  sayacTipi=tip;
  sayacBitti=bitince||null;
  sayacBas=Date.now();
  restBitis=Date.now()+sn*1000;
  document.getElementById("restLbl").textContent = tip==="sure" ? "Süre" : "Dinlenme";
  document.getElementById("restSkip").textContent = tip==="sure" ? "Bitir" : "Devam et";
  document.getElementById("restNext").textContent=not||"";
  document.getElementById("rest").classList.remove("hidden");
  clearInterval(restTimer);
  sayacCiz();
  restTimer=setInterval(sayacCiz,250);
}
/* Geçen süreyi duvar saatinden ölçüyoruz; "+15 sn" ve erken bitirme
   ikisinde de gerçek süre kaydedilsin diye. */
function sayacKapat(suresiDoldu){
  clearInterval(restTimer);
  document.getElementById("rest").classList.add("hidden");
  if(suresiDoldu){
    if(navigator.vibrate) navigator.vibrate([120,80,120]);
    if(pipPencere){
      const l=pipPencere.document.getElementById("l");
      if(l) l.textContent="Bitti";
    }
    /* Ekrandaysan zaten görüyorsun; bildirim sadece arka plandayken. */
    if(state.bildirim && document.hidden){
      bildirimGonder(sayacTipi==="sure" ? "Süre doldu" : "Dinlenme bitti",
                     document.getElementById("restNext").textContent || "Salon Defteri");
    }
  }
  const bit=sayacBitti; sayacBitti=null;
  if(bit) bit(Math.max(1,Math.round((Date.now()-sayacBas)/1000)));
}
function startRest(sn,not){ sayacAc("dinlenme",sn,not,null); }
function startHold(sn,not,bitince){ sayacAc("sure",sn,not,bitince); }
document.getElementById("restSkip").onclick=()=>sayacKapat(false);
document.getElementById("restPip").onclick=pipAc;
if(pipDestekli()) document.getElementById("restPip").classList.remove("hidden");
document.getElementById("restPlus").onclick=()=>{ restBitis+=15000; sayacCiz(); };
/* Arka plandan dönünce sayaç beklemeden doğru değere atlasın. */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && restTimer) sayacCiz(); });

const ATIF=`<p class="attrib">Hareket görselleri © <a href="https://gymvisual.com/" target="_blank" rel="noopener">Gym visual</a> · veri: exercises-dataset (MIT)</p>`;

function renderGuide(){

    return;

  const k=state.kat;
  const qEn=(k.q||"").trim().toLowerCase(), qTr=(k.q||"").trim().toLocaleLowerCase("tr");
  const liste=RAW.filter(e=>{
    if(k.bolge && e.c!==k.bolge) return false;
    if(k.ekip && e.q!==k.ekip) return false;
    if(!qEn) return true;
    return e.n.toLowerCase().includes(qEn)
        || e.t.toLowerCase().includes(qEn)
        || kasTR(e.t).toLocaleLowerCase("tr").includes(qTr)
        || ekipTR(e.q).toLocaleLowerCase("tr").includes(qTr)
        || bolgeTR(e.c).toLocaleLowerCase("tr").includes(qTr);
  });
  const goster=liste.slice(0,k.limit);
  const bolgeler=Object.keys(BOLGE).filter(c=>RAW.some(e=>e.c===c));
  const ekipler=[...new Set(RAW.map(e=>e.q))].sort((a,b)=>ekipTR(a).localeCompare(ekipTR(b),"tr"));

  view.innerHTML=`
    ${secim?`<div class="card" style="padding:12px 16px;margin-bottom:10px">
      <div class="row between"><span class="small">${state.secici.seans
        ? "Sürmekte olan <b>antrenmana</b> ekleniyor"
        : "Eklenecek program: <b>"+(progById(state.secici.progId)?progById(state.secici.progId).ad:"?")+"</b>"}</span>
      <button class="pill" id="vazgec">Vazgeç</button></div></div>`:""}

    <div class="filters">
      <select id="kBolge">
        <option value="">Tüm bölgeler</option>
        ${bolgeler.map(c=>`<option value="${c}" ${k.bolge===c?"selected":""}>${bolgeTR(c)}</option>`).join("")}
      </select>
      <select id="kEkip">
        <option value="">Tüm ekipmanlar</option>
        ${ekipler.map(q=>`<option value="${q}" ${k.ekip===q?"selected":""}>${ekipTR(q)}</option>`).join("")}
      </select>
    </div>
    <div class="count">${liste.length} hareket${liste.length>goster.length?" · ilk "+goster.length+" gösteriliyor":""}</div>
    ${goster.length?`<div class="card">${goster.map(e=>`
      <button class="exitem" data-ex="${e.i}">
        <span class="plate"><img src="${exImg(e)}" loading="lazy" alt="" onerror="this.style.display='none'"></span>
        <span class="nm"><b>${e.n}</b><span class="muted small">${kasTR(e.t)} · ${ekipTR(e.q)}</span></span>
        <span class="muted">${secim?"Ekle":"›"}</span></button>`).join("")}</div>`
    :`<div class="card"><h3>Sonuç yok</h3><p class="muted small" style="margin-top:6px">Aramayı ya da filtreleri değiştir.</p></div>`}
    ${liste.length>goster.length?`<button class="btn quiet sm" id="daha">Daha fazla göster</button>`:""}
    ${ATIF}`;

  const ara=document.getElementById("kAra");
  ara.oninput=()=>{
    state.kat.q=ara.value; state.kat.limit=60;
    const p=ara.selectionStart; renderGuide();
    const y=document.getElementById("kAra"); y.focus(); y.setSelectionRange(p,p);
  };
  document.getElementById("kBolge").onchange=ev=>{ state.kat.bolge=ev.target.value; state.kat.limit=60; renderGuide(); };
  document.getElementById("kEkip").onchange=ev=>{ state.kat.ekip=ev.target.value; state.kat.limit=60; renderGuide(); };
  const daha=document.getElementById("daha");
  if(daha) daha.onclick=()=>{ state.kat.limit+=60; renderGuide(); };
  const vz=document.getElementById("vazgec");
  if(vz) vz.onclick=()=>{
    const seans=state.secici.seans, pid=state.secici.progId;
    state.secici=null;
    if(seans){ state.tab="workout"; }
    else { state.duzenle=pid; state.tab="programs"; }
    render(); scrollTo(0,0);
  };
  view.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{
    if(secim){ ekleSheet(b.dataset.ex); return; }
    state.openEx=b.dataset.ex; render(); scrollTo(0,0);
  });
}

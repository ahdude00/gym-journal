<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Salon Defteri</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   TEMA JETONLARI
   Her tema ayni jeton kumesini doldurur; asagidaki kurallarin
   hicbiri sabit renk kullanmaz. Tema <html data-tema="..."> ile
   secilir, "sistem" secilirse prefers-color-scheme'e birakilir.
   --plate her temada acik kalir: dataset GIF/JPG'lerinin zemini
   saf beyaz, koyu plaka uzerinde dikis gorunurdu.
   ========================================================== */
:root,
:root[data-tema="gece"]{
  color-scheme:dark;
  --bg:#000000; --panel:#17181B; --field:#24252A; --line:#2C2E33; --track:#2A2C31;
  --text:#F3F4F6; --dim:#A2A5AD;
  --accent:#6B9BFF; --accent-ink:#08101F; --accent-soft:#1A2540;
  --done:#3DDC8F; --prot:#6B9BFF; --kcal:#FF9B52;
  --nav:#000000; --overlay:rgba(0,0,0,.72); --uyari:#FF8A8A;
  --golge-1:none;
  --golge-2:0 14px 38px rgba(0,0,0,.6);
}
:root[data-tema="okyanus"]{
  color-scheme:dark;
  --bg:#08151E; --panel:#10222E; --field:#173040; --line:#203A4A; --track:#1C3545;
  --text:#E4F0F6; --dim:#98B0BF;
  --accent:#33C9DA; --accent-ink:#03191D; --accent-soft:#0E3541;
  --done:#52E0A0; --prot:#33C9DA; --kcal:#FFB067;
  --nav:#08151E; --overlay:rgba(4,12,18,.78); --uyari:#FF9AA5;
  --golge-1:none;
  --golge-2:0 14px 38px rgba(0,0,0,.55);
}
:root[data-tema="acik"]{
  color-scheme:light;
  --bg:#F2F3F5; --panel:#FFFFFF; --field:#EDEFF2; --line:#E1E3E8; --track:#E9EBEF;
  --text:#121418; --dim:#5C6168;
  --accent:#2459D8; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC;
  --done:#0E8F5A; --prot:#2459D8; --kcal:#D2600F;
  --nav:#F2F3F5; --overlay:rgba(18,20,24,.45); --uyari:#C5362F;
  --golge-1:none;
  --golge-2:0 14px 34px rgba(18,20,24,.14);
}
:root[data-tema="nane"]{
  color-scheme:light;
  --bg:#EAF3EF; --panel:#FFFFFF; --field:#E2EEE9; --line:#D5E4DE; --track:#DFEBE6;
  --text:#0E1E19; --dim:#51625B;
  --accent:#0A7458; --accent-ink:#FFFFFF; --accent-soft:#D3ECE3;
  --done:#0A7458; --prot:#2A62C9; --kcal:#C85A1E;
  --nav:#EAF3EF; --overlay:rgba(14,30,25,.45); --uyari:#B9382C;
  --golge-1:none;
  --golge-2:0 14px 34px rgba(14,30,25,.14);
}
:root[data-tema="gunbatimi"]{
  color-scheme:light;
  --bg:#F8F0E9; --panel:#FFFFFF; --field:#F3E7DD; --line:#EADBCD; --track:#F0E4DA;
  --text:#25170E; --dim:#6C584A;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE2D2;
  --done:#157A3B; --prot:#2F5FC4; --kcal:#C2410C;
  --nav:#F8F0E9; --overlay:rgba(37,23,14,.45); --uyari:#B4302A;
  --golge-1:none;
  --golge-2:0 14px 34px rgba(80,50,30,.16);
}
/* "sistem": cihaz acik moddaysa Acik paletine gec, degilse Gece kalir. */
@media (prefers-color-scheme:light){
  :root[data-tema="sistem"]{
    color-scheme:light;
    --bg:#F2F3F5; --panel:#FFFFFF; --field:#EDEFF2; --line:#E1E3E8; --track:#E9EBEF;
    --text:#121418; --dim:#5C6168;
    --accent:#2459D8; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC;
    --done:#0E8F5A; --prot:#2459D8; --kcal:#D2600F;
    --nav:#F2F3F5; --overlay:rgba(18,20,24,.45); --uyari:#C5362F;
    --golge-1:none;
    --golge-2:0 14px 34px rgba(18,20,24,.14);
  }
}
:root{
  --plate:#FFFFFF;                    /* dataset gorselleri beyaz zeminli */
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:var(--sans);
  --tabbar:72px; --serit:112px;      /* alt serit yuksekligi (dinlenme sayaci) */
  --r-s:14px; --r-m:20px; --r-l:28px;  /* kose yaricaplari */
  --gecis:.16s cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;transition:background var(--gecis),color var(--gecis)}
h1,h2,h3{font-family:var(--sans);font-weight:800;margin:0;letter-spacing:-.01em}
h1{font-size:30px;letter-spacing:-.02em} h2{font-size:21px} h3{font-size:17px}
p{margin:0 0 10px}
a{color:var(--accent)}
button{font-family:var(--sans);font-size:16px;color:inherit;background:none;border:none;cursor:pointer}

input{font-family:var(--sans);font-size:22px;font-weight:800;color:var(--text);background:var(--field);
  border:1px solid var(--line);border-radius:var(--r-s);text-align:center;width:100%;padding:10px 4px;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;transition:border-color var(--gecis),box-shadow var(--gecis)}
input[type=search],input.text{font-family:var(--sans);font-size:16px;font-weight:600;text-align:left;padding:14px 18px}
input[type=search]{border-radius:999px;background:var(--panel);border-color:transparent}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::-webkit-search-cancel-button{-webkit-appearance:none}
input::placeholder{color:var(--dim)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:10px 16px 28px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:calc(30px + env(safe-area-inset-top)) 20px 14px;max-width:560px;margin:0 auto}
.topbar .ust{font-size:14px;font-weight:600;color:var(--dim)}
.topbar .ust:empty{display:none}
.topbar .clock{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);
  background:var(--panel);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:7px}
.topbar .clock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--done)}
.card{background:var(--panel);border:none;border-radius:var(--r-l);padding:20px;
  margin-bottom:12px;box-shadow:var(--golge-1)}
.muted{color:var(--dim)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}

.btn{display:block;width:100%;padding:15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-weight:800;font-size:16px;text-align:center;letter-spacing:.01em;
  transition:transform .08s ease,filter var(--gecis),background var(--gecis),border-color var(--gecis)}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--panel);border:none;color:var(--text)}
.card .btn.ghost,.sheet .btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--field);filter:none}
.btn.quiet{background:var(--panel);color:var(--text)}
.card .btn.quiet,.sheet .btn.quiet{background:var(--field)}
.btn.quiet:hover{filter:none;border-color:var(--line)}
.btn.sm{padding:12px;font-size:15px}
.btn.danger{background:var(--panel);border:none;color:var(--uyari)}
.card .btn.danger,.sheet .btn.danger{background:var(--field)}
.btn.danger:hover{background:var(--uyari);color:var(--panel);border-color:var(--uyari);filter:none}
.btn[disabled]{opacity:.4;pointer-events:none}

/* Hareket görseli. Dataset GIF'leri beyaz zeminli, o yüzden açık plaka üstünde. */
.stage{background:var(--field);border:none;border-radius:var(--r-m);overflow:hidden}
.stage .media{background:var(--plate);display:flex;align-items:center;justify-content:center;padding:12px;min-height:240px;border-radius:var(--r-m)}
.stage .media img{width:min(100%,240px);height:auto;aspect-ratio:1;object-fit:contain;display:block}
.stage-cap{padding:10px 14px;color:var(--dim);font-size:13px;font-weight:700;
  display:flex;justify-content:space-between;gap:8px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;flex:none}
.plate img{width:100%;height:100%;object-fit:contain;display:block}
.attrib{color:var(--dim);font-size:11px;margin-top:12px}
.attrib a{color:var(--dim)}

/* Dataset gorseli olmayan hareketler: adimlara yonlendiren yer tutucu. */
.stage .media.bos{background:var(--field);flex-direction:column;gap:10px;text-align:center;color:var(--dim)}
.stage .media.bos b{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1;color:var(--line)}
.stage .media.bos span{font-size:14px;max-width:260px}
.plate.bos{background:var(--field);display:flex;align-items:center;justify-content:center}
.plate.bos b{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--dim)}
.plate.bos[data-harf]::after{content:attr(data-harf);font-family:var(--cond);font-weight:700;font-size:18px;color:var(--dim)}

/* Set izgarasi. Birim etiketleri (kg / tekrar) satirda degil, bir kez
   ustteki baslik satirinda duruyor - boylece hucrelerde yer aciliyor ve
   kilo adimlayicisinin dugmeleri 40px'e cikabiliyor. 360px telefonda
   icerik genisligi 292px: 22 + 6 + 142 + 6 + 62 + 6 + 48 = 292. */
.sethead,.setrow{display:grid;grid-template-columns:22px 1fr 62px 48px;gap:6px;align-items:center}
.sethead{padding:2px 0 7px;font-size:11px;color:var(--dim);letter-spacing:.04em}
.sethead span{text-align:center}
.sethead span:first-child{text-align:left}
.setrow{padding:9px 0;border-top:1px solid var(--line);scroll-margin-top:14px}
.setno{text-align:center}

/* Kilo adimlayici: terli elle de vurulabilsin diye dugmeler tik ile ayni
   yukseklikte (46px). Rakama dokunmak klavyeyi acar, elle de yazilabilir. */
.kgbox{display:grid;grid-template-columns:40px 1fr 40px;gap:3px;align-items:center}
.kgbox button{height:46px;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--field);color:var(--text);font-size:21px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--gecis),border-color var(--gecis),transform .08s ease}
.kgbox button:active{transform:scale(.92);background:var(--accent-soft);border-color:var(--accent)}
.kgbox input{font-size:20px;padding:10px 2px}
.setrow.done .kgbox button{opacity:.5}
/* Yalnizca serit acikken: scrollIntoView serit + alt menu payini biraksin,
   yoksa satir seridin arkasinda kalir. Serit kapaliyken bu payi vermiyoruz,
   aksi halde bir kiloya dokunup klavye acilinca sayfa bosuna firlar. */
body.seritli .setrow{scroll-margin-bottom:calc(var(--tabbar) + var(--serit) + 14px)}
.setrow:first-of-type{border-top:none}
.setno{font-family:var(--cond);font-size:17px;color:var(--dim)}
.unit{position:relative}
.unit span{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--dim);pointer-events:none}
.tick{width:100%;height:46px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--field);
  font-size:20px;color:var(--dim);display:flex;align-items:center;justify-content:center;
  transition:background var(--gecis),border-color var(--gecis),color var(--gecis),transform .08s ease}
.tick:active{transform:scale(.94)}
.setrow.done .tick{background:var(--done);border-color:var(--done);color:var(--panel)}
.setrow.done input{opacity:.5}

.pill{display:inline-block;padding:5px 12px;border-radius:999px;border:none;background:var(--field);
  font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
/* Ilerleme cubugu ayni zamanda gezinme: her cizgi o harekete atlar.
   Cizgi 4px gorunuyor ama dugmenin dokunma alani 24px - salonda tek elle
   isabet ettirilebilsin, yanlis harekete atlanmasin diye. */
.progress{display:flex;margin:0 0 4px}
/* Aradaki bosluk dugmeler arasinda degil dugmenin ICINDE: boylece 16
   hareketlik bir gunde bile dokunma alani 4px genisliyor ve cizgiler
   gorsel olarak yine ayri duruyor. */
.progress button{flex:1;height:24px;padding:0 2px;background:none;border:none;
  display:flex;align-items:center}
.progress button::after{content:"";display:block;width:100%;height:4px;border-radius:999px;
  background:var(--line);transition:background var(--gecis),height var(--gecis)}
.progress button.on::after{background:var(--accent)}
/* Bulundugun hareket: "buraya kadar yapildi" ile "su an buradasin" ayirt
   edilebilsin diye o cizgi kalin duruyor. */
.progress button.simdi::after{height:7px}

/* protein çubuğu */
.meter{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin:9px 0 6px}
.meter i{display:block;height:100%;background:var(--prot);border-radius:999px;transition:width var(--gecis)}
.meter i.full{background:var(--done)}
.bignum{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:17px;font-weight:500;color:var(--dim)}

.rest{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(7px);z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px}
.rest .num{font-weight:800;font-size:108px;line-height:.9;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.rest .lbl{color:var(--dim);letter-spacing:.06em}
.rest .acts{display:flex;gap:10px;margin-top:22px;width:100%;max-width:340px}
.rest .onizleme{display:flex;align-items:center;gap:12px;width:100%;max-width:340px;margin-top:14px;
  padding:11px 13px;background:var(--panel);border:none;border-radius:var(--r-m);box-shadow:var(--golge-2)}
.rest .onizleme .plate{width:52px;height:52px}
.rest .onizleme .nm{flex:1;min-width:0;text-align:left}
.rest .onizleme .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest .kisa{display:none}
.rest .acts .boy{flex:none;width:52px;padding-left:0;padding-right:0}

/* Dinlenme sayaci iki boyda calisiyor:
   - tam ekran: sureli hareketlerin KENDISI (plank, yan plank) - buyuk rakam
     hareketin suresi, ekrani kaplamasi dogru.
   - alt serit: setler arasi mola - set listesi gorunur kalsin, kiloyu
     duzeltmek icin hicbir seyi kapatmak gerekmesin.
   Fark yalnizca .serit sinifinda; DOM, sayac ve PiP ayni kaliyor.
   Yan etki: plank bitince ayni eleman tam ekrandan serite gecer, boylece
   ust uste iki tam ekran katman cikmaz. */
.rest.serit{
  inset:auto 0 calc(var(--tabbar) + env(safe-area-inset-bottom)) 0;
  display:grid;grid-template-columns:auto 1fr;
  grid-template-areas:"num kisa" "acts acts";
  align-items:center;gap:10px 12px;
  /* genis ekranda icerik .wrap ile ayni 560px seride hizalanir */
  padding:10px max(16px,calc(50% - 280px)) 12px;
  background:var(--panel);backdrop-filter:none;
  border-top:1px solid var(--line);box-shadow:var(--golge-2)
}
.rest.serit .num{grid-area:num;font-size:34px;min-width:50px;text-align:center}
.rest.serit .kisa{grid-area:kisa;display:block;min-width:0;font-size:14px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest.serit .acts{grid-area:acts;margin-top:0;max-width:none}
/* Dugme metni iki satira kirilirsa serit --serit'ten yuksege cikar ve
   govdeye verdigimiz alt bosluk yetmez; tek satirda tutuyoruz. */
.rest.serit .acts .btn{white-space:nowrap;font-size:14px;padding:13px 4px}
.rest.serit #restLbl,.rest.serit #restNext,
.rest.serit .onizleme,.rest.serit #restPip{display:none !important}
/* Serit acikken sayfanin sonu seridin arkasinda kalmasin. */
body.seritli{padding-bottom:calc(var(--tabbar) + var(--serit) + env(safe-area-inset-bottom))}

.modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(5px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal .sheet{background:var(--panel);border:none;border-radius:var(--r-l);padding:22px;
  width:100%;max-width:420px;max-height:86vh;overflow:auto;box-shadow:var(--golge-2)}
.modal .sheet .btn{margin-top:10px}
.chips{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chips button{flex:1;min-width:60px;padding:12px 6px;border:1px solid var(--line);border-radius:999px;
  background:var(--field);font-size:16px;font-weight:800;transition:background var(--gecis),border-color var(--gecis)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.exitem{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--line);
  width:100%;text-align:left;transition:opacity var(--gecis)}
.exitem:first-child{border-top:none}
.exitem:active{opacity:.6}
.exitem .plate{width:56px;height:56px}
.exitem .nm{flex:1;min-width:0}
.exitem .nm b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.steps{margin:0;padding-left:20px} ol.steps li{margin-bottom:7px}
ul.warn{margin:0;padding-left:18px;color:var(--dim)} ul.warn li{margin-bottom:6px}
summary{cursor:pointer}

/* hareket kataloğu */
.filters{display:flex;gap:8px;margin:10px 0 2px}
.filters select{flex:1;min-width:0;background:var(--panel);border:none;color:var(--text);
  border-radius:999px;padding:12px 16px;font-family:var(--sans);font-size:14px;font-weight:700;-webkit-appearance:none;appearance:none}
.count{color:var(--dim);font-size:13px;font-weight:700;padding:12px 6px 8px}

/* Öğün kalemleri ve kalıcı fotoğraf arşivi */
.food-edit-row{border-top:1px solid var(--line);padding:12px 0}
.food-edit-row label{display:block;margin:7px 0;color:var(--dim);font-size:13px}
.food-total{font-weight:700;margin:14px 0}
.food-photo{width:100%;max-height:260px;object-fit:contain;border-radius:var(--r-s)}
.food-archive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.food-archive-card{min-width:0;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r-s);padding:8px}
.food-archive-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-s)}
.food-archive-card b,.food-archive-card span{display:block;margin-top:5px}

/* program düzenleyici */
.progrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
/* Sıralama tutamağı. touch-action:none şart: olmazsa tarayıcı parmağı
   sayfayı kaydırmak için kullanıyor ve sürükleme hiç başlamıyor. */
.progrow .tut{touch-action:none;cursor:grab}
.progrow .tut:active{cursor:grabbing}
.proglist{position:relative}
.progrow.suruklenen{position:relative;z-index:3;background:var(--panel);
  border-radius:var(--r-s);box-shadow:var(--golge-2)}
/* Bırakma çizgisi satırların üzerine değil, listenin kendisine konuyor:
   satıra inset gölge olarak çizildiğinde sürüklenen satırın opak zemini
   tam da onun üstüne gelip çizgiyi gizliyordu. z-index tutulan satırdan
   büyük, böylece her durumda görünüyor. */
.birakma{position:absolute;left:0;right:0;height:3px;border-radius:999px;
  background:var(--accent);z-index:4;pointer-events:none}
.birakma::after{content:"";position:absolute;left:0;top:-3px;width:9px;height:9px;
  border-radius:50%;background:var(--accent)}
.progrow:first-of-type{border-top:none}
.progrow .plate{width:44px;height:44px}
.progrow .nm{flex:1;min-width:0;text-align:left}
.progrow .nm b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:36px;height:36px;flex:none;border-radius:50%;background:var(--field);border:none;
  color:var(--dim);font-size:15px;display:inline-flex;align-items:center;justify-content:center;
  transition:background var(--gecis),color var(--gecis)}
.iconbtn:hover{color:var(--text)}
.iconbtn[disabled]{opacity:.28}
.editgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.editgrid label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;letter-spacing:.03em}
.editgrid input{font-size:18px;padding:9px 4px}

/* beslenme kaydı */
.logrow{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;
  padding:11px 0;border-top:1px solid var(--line)}
.logrow:first-of-type{border-top:none}
.logrow .val{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
/* Fotoğraf seçici ve döküm sayfasındaki küçük resimler */
.fotogrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fotokare{position:relative;width:74px;height:74px;border-radius:var(--r-s);overflow:hidden;
  border:1px solid var(--line);background:var(--field);flex:none}
.fotokare img{width:100%;height:100%;object-fit:cover;display:block}
.fotokare .etiket{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font-size:10px;
  text-align:center;background:rgba(0,0,0,.55);color:#fff}
.fotosil{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.logrow .lgrad{text-align:left;background:none;border:none;color:inherit;padding:0;width:100%;min-width:0}
.logrow .lgrad b{font-weight:700}
.logrow .del{width:34px;height:34px;border-radius:50%;background:var(--field);border:1px solid transparent;
  color:var(--dim);font-size:16px;transition:color var(--gecis),border-color var(--gecis)}
.logrow .del:hover{color:var(--uyari);border-color:var(--uyari)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datenav button{width:44px;height:44px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--panel);color:var(--text);font-size:18px;transition:background var(--gecis)}
.datenav button:hover{background:var(--field)}
.datenav b{font-size:17px;font-weight:800}

/* Geçmiş kaydı. Başlık açıp kapatan düğme, detay ayrı bir kutu: setler
   orada düzenlenebildiği için input'lar bir düğmenin içinde duramaz. */
.hist{border-top:1px solid var(--line)}
.hist:first-of-type{border-top:none}
.histbas{width:100%;text-align:left;padding:13px 0;background:none;border:none;color:inherit}
.histdetay{padding:0 0 4px}
.hsatir{padding:8px 0;border-top:1px dashed var(--line)}
.had{display:block;font-size:14px;margin-bottom:7px}
/* Setler arasi bosluk, set ICINDEKI kg-tekrar boslugundan belirgin
   olcude genis olmali; yoksa "10 x 12  10 x 11" tek bir dizi gibi
   okunuyor ve hangi sayinin hangi sete ait oldugu kayboluyor. */
.hsetler{display:flex;flex-wrap:wrap;gap:8px 16px}
.hset{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
.hset input{width:54px;font-size:16px;padding:7px 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--panel);border:none;border-radius:22px;padding:14px;
  text-align:left;box-shadow:var(--golge-1)}
.card .stat{background:var(--field)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--text);line-height:1.15}
.stat span{font-size:12px;font-weight:700;color:var(--dim);display:block;line-height:1.3;margin-top:2px}

/* segment secici */
.seg{display:flex;gap:4px;margin-bottom:12px;background:var(--panel);border:none;
  border-radius:999px;padding:4px}
.card .seg,.sheet .seg{background:var(--field)}
.seg button{flex:1;padding:10px 4px;border:none;border-radius:999px;color:var(--dim);
  font-size:14px;font-weight:800;background:transparent;transition:background var(--gecis),color var(--gecis)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
.seg.sm{margin-bottom:0}
.seg.sm button{font-size:13px;padding:9px 3px}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:14px 0 2px;position:relative}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;max-width:26px;background:var(--done);border-radius:999px;min-height:6px}
.bars i.empty{background:var(--track)}
.bars i.az{background:var(--track)}
.bars i.p{background:var(--prot)}
.bars small{color:var(--dim);font-size:11px;font-weight:700}
.bars small.bugun{color:var(--text);font-weight:800}
.bars .hedef{position:absolute;left:0;right:0;border-top:2px dashed var(--line);height:0;pointer-events:none}
.bars .hedef span{position:absolute;right:0;bottom:3px;font-size:11px;font-weight:800;color:var(--dim)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.kv span{color:var(--dim)}
.kv:first-of-type{border-top:none}
.kv b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.switch button{width:52px;height:31px;border-radius:999px;background:var(--track);border:1px solid transparent;
  position:relative;flex:none;transition:background var(--gecis),border-color var(--gecis)}
.switch button i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#FFFFFF;transition:left var(--gecis),background var(--gecis)}
.switch button.on{background:var(--accent);border-color:var(--accent)}
.switch button.on i{left:25px;background:#FFFFFF}

/* tema secici */
.temalar{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:12px}
.tema{border:2px solid transparent;border-radius:var(--r-m);padding:8px;background:var(--field);
  color:var(--text);text-align:left;transition:border-color var(--gecis),transform .08s ease}
.tema:active{transform:scale(.97)}
.tema.on{border-color:var(--accent)}
.tema .ornek{height:86px;border-radius:var(--r-s);display:flex;flex-direction:column;gap:5px;
  padding:7px;overflow:hidden;border:1px solid rgba(128,128,128,.18)}
.tema .ornek i{display:block;border-radius:7px}
.tema .ornek i:nth-child(1){height:8px;width:55%;border-radius:4px}
.tema .ornek i:nth-child(2){flex:1;display:flex;align-items:center;justify-content:center}
.tema .ornek i:nth-child(2)::after{content:"";width:24px;height:24px;border-radius:50%;border:4px solid var(--halka);box-sizing:border-box}
.tema .ornek i:nth-child(3){height:16px}
.tema .ad{display:flex;align-items:center;gap:5px;font-size:13px;margin-top:8px}
.tema .ad b{font-weight:800}
.tema.on .ad::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:700}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:saturate(1.3)}
nav div{display:flex;max-width:560px;margin:0 auto;padding:0 4px}
nav button{flex:1;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--dim);font-size:12px;font-weight:600;position:relative;
  transition:color var(--gecis)}
nav button i{font-style:normal;line-height:1;width:58px;height:32px;
  display:flex;align-items:center;justify-content:center;border-radius:999px;
  transition:background var(--gecis),color var(--gecis)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--text);font-weight:800}
nav button.on i{background:var(--accent-soft);color:var(--accent)}

/* ==========================================================
   KART BİLEŞENLERİ (Samsung Health benzeri yerleşim)
   ========================================================== */
.kbas{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kbas .ek{font-size:13px;font-weight:700;color:var(--dim)}
.bolumbas{margin:18px 6px 10px;font-size:17px}
/* Özet halkaları: dıştan içe protein, haftalık antrenman, hedef tutan gün. */
.halkakart{display:flex;align-items:center;gap:18px;margin-top:14px}
.halkakart svg{width:148px;height:148px;flex:none}
.lejant{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.lejant .et{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--dim)}
.lejant .et::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--renk)}
.lejant b{display:block;font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.lejant b small{font-size:13px;font-weight:600;color:var(--dim)}
.kucukler{display:flex;gap:8px;margin-top:14px}
.kucukler .plate,.kucukler .fazla{flex:1;max-width:64px;aspect-ratio:1;height:auto;border-radius:16px}
.kucukler .fazla{background:var(--field);display:flex;
  align-items:center;justify-content:center;font-weight:800;color:var(--dim)}
.btn.ikon{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ikon svg{width:18px;height:18px}
/* 2x2 küçük kartlar */
.kutular{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kutu{background:var(--panel);border-radius:26px;padding:18px;text-align:left;color:var(--text);
  display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .08s ease}
.kutu:active{transform:scale(.98)}
.kutu .ust{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.kutu .ust svg{width:18px;height:18px;fill:none;stroke:var(--renk);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kutu .deger{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kutu .deger small{font-size:14px;color:var(--dim)}
.kutu .alt{font-size:13px;font-weight:600;color:var(--dim)}
.kutu .cubuk{display:block;height:8px;border-radius:999px;background:var(--track);margin-top:10px;overflow:hidden}
.kutu .cubuk i{display:block;height:100%;border-radius:999px;background:var(--renk)}
.kutu .noktalar{display:flex;gap:4px;margin-top:10px}
.kutu .noktalar i{flex:1;height:8px;border-radius:999px;background:var(--track)}
.kutu .noktalar i.on{background:var(--renk)}
.satirlink{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 18px;
  background:var(--panel);border-radius:22px;color:var(--text);font-size:15px;font-weight:700;text-align:left;margin-bottom:12px}
.satirlink span{flex:1}
.satirlink svg,.ok{width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Antrenman sekmesi: haftanın günleri şeridi */
.gunserit{display:flex;gap:6px;margin-bottom:12px}
.gunserit div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:18px}
.gunserit div.bugun{background:var(--panel)}
.gunserit small{font-size:12px;font-weight:700;color:var(--dim)}
.gunserit .bugun small{color:var(--text)}
.gunserit b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--dim)}
.gunserit .bugun b{background:var(--accent-soft);color:var(--accent)}
.gunserit .yapildi b{background:var(--done);color:var(--panel)}
.progbas{width:44px;height:44px;border-radius:14px;flex:none;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.progbas.ops{background:var(--field);color:var(--dim)}
.minibtn{height:36px;padding:0 14px;border-radius:999px;background:var(--field);color:var(--text);
  font-size:13px;font-weight:800;flex:none;display:inline-flex;align-items:center}
/* Beslenme: yarım daire gösterge ve ekleme düğmeleri */
.yarim{position:relative;width:230px;height:128px;margin:0 auto}
.yarim svg{width:230px;height:128px;display:block}
.yarim .orta{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.yarim .orta b{display:block;font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.yarim .orta b small{font-size:16px;color:var(--dim)}
.yarim .orta span{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-top:4px}
.uclu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;text-align:center}
.uclu div+div{border-left:1px solid var(--line)}
.uclu b{display:block;font-size:18px;font-weight:800}
.uclu span{font-size:12px;font-weight:700;color:var(--dim)}
.eylemler{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.eylemler button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text);padding:0}
.eylemler button i{width:58px;height:58px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;
  transition:transform .08s ease}
.eylemler button:active i{transform:scale(.94)}
.eylemler button.ana i{background:var(--accent);color:var(--accent-ink)}
.eylemler svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.saat{width:44px;height:44px;border-radius:14px;flex:none;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.logrow.ikonlu{grid-template-columns:44px 1fr auto 34px}
.kbas+.logrow{border-top:none}
/* Hareketler: bölge çipleri ve iki sütunlu kartlar */
.katlar{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.katlar::-webkit-scrollbar{display:none}
.katlar button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.katlar button.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.excard{background:var(--panel);border-radius:24px;padding:8px 8px 14px;text-align:left;color:var(--text);
  display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .08s ease}
.excard:active{transform:scale(.98)}
.excard .plate{width:100%;height:132px;border-radius:18px;border:none}
.excard .nm{padding:0 6px;min-width:0}
.excard .nm b{display:block;font-size:14px;font-weight:800;line-height:1.25;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.excard .nm span{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-top:4px}
.excard .ekle{align-self:flex-start;margin:0 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 18px);z-index:70;
  background:var(--text);color:var(--bg);border:none;border-radius:999px;padding:12px 20px;
  font-size:14px;font-weight:700;max-width:88%;text-align:center;box-shadow:var(--golge-2)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

     biri her açılışta bir anlık koyu ekran görür. -->

<script>
/* ==========================================================
   1. HAREKET VERİTABANI
   Veri (isim, bölge, ekipman, kas, Türkçe adımlar): exercises-dataset — MIT
   Medya (images/, videos/): © Gym visual — https://gymvisual.com/
     180×180 sınırı ve atıf zorunluluğu için bkz. NOTICE.md
   ========================================================== */
const RAW = Array.isArray(window.EXDATA) ? window.EXDATA : [];
/* custom.js kendi kayitlarini sona ekliyor; katalog alfabetik olsun */
RAW.sort((a, b) => a.n.toLowerCase().localeCompare(b.n.toLowerCase(), "en"));
const EX = {};
RAW.forEach(e => { EX[e.i] = e; });
/* Saved programs/history can still resolve IDs from the short-lived SVG catalog.
   They are not offered in the restored original exercise picker. */
(window.LEGACY_EX||[]).forEach(e=>{ EX[e.i]=e; });

const BOLGE = {
  "back":"Sırt", "cardio":"Kardiyo", "chest":"Göğüs", "lower arms":"Ön kol",
  "lower legs":"Baldır", "neck":"Boyun", "shoulders":"Omuz",
  "upper arms":"Kol", "upper legs":"Bacak", "waist":"Karın ve bel"
};
const KAS = {
  "abs":"karın", "abductors":"kalça dış", "adductors":"iç bacak", "biceps":"biceps",
  "calves":"baldır", "cardiovascular system":"kondisyon", "delts":"omuz",
  "forearms":"ön kol", "glutes":"kalça", "hamstrings":"arka bacak", "lats":"kanat",
  "levator scapulae":"boyun", "pectorals":"göğüs", "quads":"ön bacak",
  "serratus anterior":"yan karın", "spine":"bel", "traps":"trapez",
  "triceps":"triceps", "upper back":"üst sırt"
};
const EKIP = {
  "assisted":"destekli", "band":"lastik", "barbell":"halter", "body weight":"vücut ağırlığı",
  "bosu ball":"bosu topu", "cable":"kablo", "dumbbell":"dambıl",

function ov(id){ return OVERLAY[id] || null; }
/* Mola kutusunu okur. 0 geçerli bir değer olduğu için "||" ile varsayılana
   düşmek yanlış; yalnızca kutu boşsa ya da sayı değilse eskisi korunur. */
function molaOku(ham, eski){
  const t=String(ham==null?"":ham).trim();
  if(t==="") return eski==null?60:eski;
  const n=+t;
  return isNaN(n) ? (eski==null?60:eski) : Math.max(0,Math.min(600,n));
}

function temaUygula(ad){
  const t = temaAdi(ad) || "gece";
  document.documentElement.dataset.tema = t;
  /* Telefonun durum cubugu da temayla ayni renge donsun. */
  const m = document.querySelector('meta[name="theme-color"]');
  if(m){
    const nav = getComputedStyle(document.documentElement).getPropertyValue("--nav").trim();
    if(nav) m.setAttribute("content", nav);
  }
  try{ localStorage.setItem(TEMA_KEY, t); }catch(e){}
  return t;
}

    && state.programs.every(p=>p.id==="A"||p.id==="B")
    && !state.programs.some(p=>p.duzenlendi);
  if(!state.programs.length || eskiAB){
    state.programs = yeni;
  }else{
    const yeniId = new Set(yeni.map(p=>p.id));
    state.programs = yeni.concat(state.programs.filter(p=>!yeniId.has(p.id)));
  }
  state.programSurum = PROGRAM_SURUM;
  return true;
}

async function loadAll(){
  let ham=null;
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value){ ham=r.value; kayitYeri="uygulama haf\u0131zas\u0131"; } } }catch(e){}
  if(!ham){ const l=lsGet(KEY); if(l){ ham=l; kayitYeri="telefon haf\u0131zas\u0131"; } }
  if(ham){ try{
    const d=JSON.parse(ham);
    state.sessions=d.sessions||[];
    state.meals=d.meals||{};
    state.favorites=Array.isArray(d.favorites)?d.favorites:[];
    if(d.hedefProtein) state.hedefProtein=d.hedefProtein;
    if(d.hedefKalori) state.hedefKalori=d.hedefKalori;
    if(typeof d.otoDosya==="boolean") state.otoDosya=d.otoDosya;
    if(typeof d.bildirim==="boolean") state.bildirim=d.bildirim;
    if(typeof d.ekranAcik==="boolean") state.ekranAcik=d.ekranAcik;
    if(d.saglayici&&SAGLAYICI[d.saglayici]) state.saglayici=d.saglayici;
    if(d.modeller&&typeof d.modeller==="object") state.modeller=d.modeller;
    if(d.kotaDolu&&typeof d.kotaDolu==="object") state.kotaDolu=d.kotaDolu;
    if(Array.isArray(d.programs)&&d.programs.length) state.programs=d.programs;
    state.programSurum=+d.programSurum||1;   // kayit varsa en az surum 1'dir
    if(d.tema&&temaAdi(d.tema)) state.tema=temaAdi(d.tema);
    /* Yarım kalan antrenman. Sayfa yenilenirse (ekran döndürme, tarayıcının
       sekmeyi bellekten atması, uygulamanın kapanıp açılması) kaldığı
       yerden devam eder. 12 saatten eskiyse unutulur. */
    if(d.aktif && d.aktif.baslangic && Date.now()-d.aktif.baslangic < 12*3600*1000){
      state.active=d.aktif;
      const n=(d.aktif.hareketler||[]).length;
      state.exIndex=Math.max(0, Math.min(+d.aktifIndex||0, n-1));
    }
  }catch(e){} }
  /* <head>'deki betik temayi zaten uygulamisti; burada state ile
     eslestiriyoruz (yedek dosyasindan geri yukleme de buradan geciyor). */
  try{
    const yerel = localStorage.getItem(TEMA_KEY);
    if(!ham && yerel && temaAdi(yerel)) state.tema = temaAdi(yerel);
  }catch(e){}
  state.tema = temaUygula(state.tema);
  const tazelendi=programlariTazele();

}

const pad=n=>String(n).padStart(2,"0");
const mmss=s=>pad(Math.floor(s/60))+":"+pad(s%60);
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUNLER=["Paz","Pzt","Sal","Çrş","Prş","Cum","Cmt"];
function gunKey(d){ d=d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function keyToDate(k){ const [y,m,g]=k.split("-").map(Number); return new Date(y,m-1,g); }
function tarihTR(iso){ const d=new Date(iso); return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`; }
function gunAdi(k){
  const d=keyToDate(k), b=gunKey();
  if(k===b) return "Bugün";
  if(k===gunKey(new Date(Date.now()-864e5))) return "Dün";
  return `${GUNLER[d.getDay()]} ${d.getDate()} ${AYLAR[d.getMonth()]}`;
}
function haftaBasi(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function progById(id){ return state.programs.find(p=>p.id===id)||null; }
function yeniProgId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function progOzet(p){
  return (p.opsiyonel?"Opsiyonel · ":"")+p.hareketler.length+" hareket \u00b7 "
       + p.hareketler.reduce((a,h)=>a+(+h.set||0),0)+" set";
}
function progKisa(ad){ return String(ad||"").split("\u2014")[0].trim()||"Program"; }
/* Opsiyonel seanslar ana gün sırasını değiştirmez. */
function sonrakiProgram(){
  const ana=state.programs.filter(p=>!p.opsiyonel);
  if(!ana.length) return null;
  const son=[...state.sessions].reverse().find(s=>ana.some(p=>p.id===((s.program&&s.program.id)||s.gun)));
  if(!son) return ana[0];
  const pid=(son.program&&son.program.id)||son.gun;
  const i=ana.findIndex(p=>p.id===pid);
  return ana[(i+1)%ana.length];
}
function programNotu(p){
  const not=p.not || (p.id==='2'
    ? '60 dk hedefi · Hammer curl ve triceps’i dönüşümlü yap: birer set, ardından 60–75 sn dinlenme. Tek kol hareketlerini iki tarafta tamamla.'
    : ['1','3'].includes(p.id) ? '60 dk hedefi · Tek kol hareketlerini ve dead bug’ı iki tarafta tamamla. Ana hareketlerde 90–120 sn, yardımcı hareketlerde 45–60 sn dinlen.' : '');
  return not ? '<p class="muted small" style="margin:8px 0">'+String(not).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</p>' : '';
}
/* Bir hareketin en son yapildigi antrenmandaki setleri ve o seansin tarihi. */
function sonKayitBilgi(exId){
  for(let i=state.sessions.length-1;i>=0;i--){
    const s=state.sessions[i];
    const e=(s.kayitlar||[]).find(k=>k.id===exId);
    if(e&&e.setler){ const d=e.setler.filter(x=>x.done); if(d.length) return {setler:d,tarih:s.tarih}; }
  }
  return null;
}
function sonKayit(exId){ const b=sonKayitBilgi(exId); return b?b.setler[b.setler.length-1]:null; }
/* "Geçen sefer" satırı. Son seti değil o antrenmandaki TÜM setleri yazıyor:
   veri zaten set set duruyordu, tek set göstermek "4 set yaptım, hangisi
   bu?" sorusunu doğuruyordu. Ağırlık bütün setlerde aynıysa bir kez yazılıp
   tekrarlar ardına diziliyor - en sık durum bu ve çok daha kısa okunuyor. */
function gecenSeferMetni(exId, tip){
  const b=sonKayitBilgi(exId);
  if(!b || !b.setler.length) return null;
  const ss=b.setler, tarih=tarihTR(b.tarih);
  const tk=x=>x.tekrar!=null?x.tekrar:"?";
  if(tip==="kg"){
    const kglar=[...new Set(ss.map(x=>x.kg==null?"?":x.kg))];
    if(kglar.length===1 && kglar[0]!=="?")
      return `Geçen sefer (${tarih}): ${kglar[0]} kg · ${ss.map(tk).join(" · ")}`;
    return `Geçen sefer (${tarih}): ${ss.map(x=>(x.kg==null?"?":x.kg)+"×"+tk(x)).join(" · ")}`;
  }
  return `Geçen sefer (${tarih}): ${ss.map(tk).join(" · ")}${tip==="sure"?" sn":""}`;
}
function gunToplam(k){
  const l=state.meals[k]||[];
  return { p:l.reduce((a,x)=>a+x.p*x.adet,0), k:l.reduce((a,x)=>a+x.k*x.adet,0), n:l.length };
}

function uzunTarih(d){ d=d||new Date(); return `${GUN_UZUN[d.getDay()]}, ${d.getDate()} ${AY_UZUN[d.getMonth()]}`; }

/* Özet halkası. SVG öznitelikleri CSS değişkeni okuyamadığı için renk style ile veriliyor. */
function halkaIc(r,oran,renk){
  const c=2*Math.PI*r, d=Math.max(0,Math.min(1,oran||0))*c;
  return `<circle cx="100" cy="100" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="18"/>`
    + (d>0?`<circle cx="100" cy="100" r="${r}" fill="none" style="stroke:${renk}" stroke-width="18" stroke-linecap="round"
        stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 100 100)"/>`:"");
}
/* Haftalık çubuk grafik; hedef çizgisi çubuklarla aynı ölçekte. Etiket
   satırı ~23px, çubuklar kalan yüksekliğe göre oranlanıyor. */
function haftaGrafik(gunler,hedef,enB){

      return `<div><i class="${sinif}" style="height:${x.gelecek||!x.p?"6px":olc(x.p)}"></i><small class="${x.bugun?"bugun":""}">${x.etiket}</small></div>`;
    }).join("")}

}

/* ==========================================================
   FOTOĞRAFTAN BESİN TAHMİNİ
   Yemek fotoğrafı bir görsel modele gönderilip protein ve kalori tahmini
   alınır. İstersen ikinci bir fotoğrafla (tabakta kalanlar) gerçekten ne
   kadar yediğini hesaplatabilirsin. Tek çevrimiçi özellik; uygulamanın
   geri kalanı çevrimdışı çalışmaya devam eder.

   İki sağlayıcı var. Gemini'nin ücretsiz katmanı olduğu için varsayılan;
   Claude daha iyi sonuç veriyor ama kredi gerektiriyor. İkisi de aynı JSON
   şemasını döndürüyor, üst katman aradaki farkı görmüyor.

   API anahtarı ayrı localStorage kayıtlarında durur: yedek dosyasına ve
   uygulama verisine karışmaz. Uygulama statik bir sayfa olduğu için istek
   tarayıcıdan doğrudan sağlayıcıya gider; anahtar cihazdan çıkmaz ama
   cihazı paylaşan herkes erişebilir.
   ========================================================== */
const SAGLAYICI={
  gemini:{ ad:"Gemini", key:"salonDefteri.geminiKey", onek:/^AIza/,
    konsol:"https://aistudio.google.com/apikey", konsolAd:"Google AI Studio",
    ucretsiz:"ücretsiz katmanı var",
    /* Lite sürümler yüksek hacim için tasarlandığından ücretsiz kotaları
       daha geniş; ağır olanlar daha iyi görsel muhakeme yapıyor. Kesin
       günlük limitler hesaba göre değiştiği için seçimi kullanıcıya
       bırakıyoruz - AI Studio'daki kota sayfası doğrusunu gösteriyor. */
    /* Sıra aynı zamanda düşme zinciri: en iyiden başlar, kota bitince bir
       alttakine geçilir. Aşağı indikçe kota genişliyor, muhakeme zayıflıyor. */
    modeller:[
      {id:"gemini-3.8-flash",      ad:"3.8 Flash", not:"en iyi, dar kota"},
      {id:"gemini-3.5-flash-lite", ad:"3.5 Flash Lite"},
      {id:"gemini-3.1-flash-lite", ad:"3.1 Flash Lite"},
      {id:"gemini-2.5-flash",      ad:"2.5 Flash"},
      {id:"gemini-2.5-flash-lite", ad:"2.5 Flash Lite", not:"en geniş kota"}
    ], varsayilanModel:"gemini-3.8-flash" },
  claude:{ ad:"Claude", key:"salonDefteri.apiKey", onek:/^sk-ant-/,
    konsol:"https://platform.claude.com/settings/keys", konsolAd:"Console → API keys",
    ucretsiz:"kredi gerektirir",
    modeller:[{id:"claude-opus-5", ad:"Opus 5", not:"en iyi"}, {id:"claude-sonnet-5", ad:"Sonnet 5", not:"daha ucuz"}],
    varsayilanModel:"claude-opus-5" }
};
/* Seçilen modelden başlayıp listenin altına inen sıra. Bugün kotası
   dolduğu bilinen modeller atlanıyor; kota günlük sıfırlandığı için
   işaret tarihle tutuluyor. */
function modelZinciri(){
  const sag=aktifSag();
  const hepsi=sag.modeller.map(m=>m.id);
  const secili=(state.modeller||{})[state.saglayici];
  let bas=hepsi.indexOf(secili);
  if(bas<0) bas=Math.max(0,hepsi.indexOf(sag.varsayilanModel));
  const sira=hepsi.slice(bas);
  const bugun=gunKey(), dolu=state.kotaDolu||{};
  const acik=sira.filter(id=>dolu[id]!==bugun);
  return acik.length?acik:sira;   // hepsi doluysa yine de dene, belki sıfırlanmıştır
}
const aktifModel=()=>modelZinciri()[0];
function modelAdi(id){
  const m=aktifSag().modeller.filter(x=>x.id===id)[0];
  return m?m.ad:id;
}
function kotayiIsaretle(id){
  state.kotaDolu=Object.assign({},state.kotaDolu,{[id]:gunKey()});
  saveAll();
}
const aktifSag=()=>SAGLAYICI[state.saglayici]||SAGLAYICI.gemini;
const apiAnahtar=sag=>lsGet((sag||aktifSag()).key)||"";

const OLCEK_KURALI=`Porsiyonu gözünle tahmin etme. Fotoğrafta boyutu bilinen bir nesne ara ve onu ölçek olarak kullan. Öncelik sırası:
1. Çatal, kaşık, bıçak (yemek kaşığı ve çatal ~19 cm, çay kaşığı ~13 cm)
2. Tabak veya kase (yemek tabağı ~26 cm, kase ~15 cm çap)
3. Bardak, kupa, kutu içecek (çay bardağı ~8 cm, kutu ~12 cm yükseklik)
4. El veya parmak (yetişkin avuç içi ~10 cm, başparmak ~6 cm)
Hangisini kullandığını "olcek" alanında yaz. Ölçek alınacak hiçbir nesne yoksa "olcek" alanına "ölçek nesnesi yok" yaz, tipik bir porsiyon varsay ve "guven" değerini "dusuk" yap.`;

const NOT_KURALI=`Kullanıcı bir not yazmışsa ona mutlaka uy - not, fotoğrafta görünmeyen ama tahmini doğrudan değiştiren bilgiyi taşır:
- Pişirme şekli ("yağsız", "tuzsuz", "kızartma", "tereyağlı") kaloriyi değiştirir.
- Paylaşım ("ikimiz yiyeceğiz", "üç kişiyiz") varsa YALNIZCA kullanıcının payını ver ve bunu "porsiyon" alanında belirt.
- Miktar düzeltmesi ("yarısını yedim", "iki kaşık aldım") varsa onu esas al.

Sana önceki bir tahmin ve kullanıcının düzeltmesi verilirse, düzeltmeyi uygulayıp tahmini yeniden hesapla. Kullanıcının değinmediği kalemleri olduğu gibi koru.`;

const SISTEM_TEK=`Sana gönderilen yemek fotoğrafındaki porsiyonun protein ve kalori miktarını tahmin ediyorsun.

${OLCEK_KURALI}

Birden fazla fotoğraf gönderilebilir ve hepsi AYNI öğüne aittir:
- Fotoğraflar farklı yiyecekleri ya da farklı tabakları gösteriyorsa hepsini TOPLA.
- Aynı yiyeceğin farklı açılardan çekilmiş halleriyse BİR KEZ say, iki kez ekleme.
Hangisini yaptığını "not" alanında açıkça söyle.

Tabaktaki her yiyeceği "kalemler" dizisine ayrı ayrı yaz: adı, tahmini porsiyonu (gram olarak da belirt), proteini ve kalorisi. Tek bir yiyecek varsa da tek elemanlı dizi ver. "protein_g" ve "kalori" alanları kalemlerin toplamı olmalı. "ad" alanına öğünde ne olduğunu kısaca yaz. Pişirme yağı, sos ve garnitürleri de hesaba kat.

${NOT_KURALI}

"not" alanına tahmini nasıl yaptığını bir cümleyle açıkla.
Her kalemde "gram" alanını pozitif sayısal gramaj olarak ver. Pişmiş / servis edilmiş, gerçekten yenen miktarı esas al.
`;

const SISTEM_KALAN=`Sana aynı öğünün İKİ GRUP fotoğrafı gönderiliyor: önce yemeğe başlamadan önceki hali, sonra yemekten sonra kalanlar. Her grupta bir ya da birden fazla fotoğraf olabilir.

İkisini karşılaştır ve YENEN miktarın protein ve kalorisini ver - tabağın tamamını değil. Aynı öğün olduğu için ölçek bütün fotoğraflarda aynıdır; önce birinci gruptaki toplamı belirle, sonra ikinci grupta ne kaldığını çıkar.

Bir grup içinde birden fazla fotoğraf varsa: farklı yiyecek ya da farklı tabak gösteriyorlarsa topla, aynı şeyin farklı açısıysa bir kez say.

${OLCEK_KURALI}

Yenen oranı "yenen_yuzde" alanına yaz (0-100). Tabak boşaldıysa 100, hiç dokunulmadıysa 0.
"ad" alanına yemeğin adını, "porsiyon" alanına yenen miktarı yaz (örn. "tabağın ~%70'i, ~220 g").
Yenen kısmı "kalemler" dizisinde yiyecek yiyecek de ayır; "protein_g" ve "kalori" bu kalemlerin toplamı olmalı.

${NOT_KURALI}

"not" alanına iki fotoğrafı nasıl karşılaştırdığını bir cümleyle açıkla.
Her kalemde "gram" alanını pozitif sayısal gramaj olarak ver. Pişmiş / servis edilmiş, gerçekten yenen miktarı esas al.
`;

const SISTEM_METIN=`Kullanıcı ne yediğini yazıyor; protein ve kalori miktarını tahmin ediyorsun.

Yazdığı miktar birimlerini esas al ("bir kase", "iki dilim", "bir avuç", "yarım tabak"). Türkiye'de tipik porsiyonlar:
- yemek kaşığı ~15 g, çay bardağı ~100 ml, su bardağı ~200 ml
- bir dilim ekmek ~25 g, bir kase çorba ~250 ml, bir avuç kuruyemiş ~30 g
- bir porsiyon et/tavuk ~150 g, bir porsiyon pilav/makarna ~180 g, bir orta boy yumurta ~50 g

Miktar hiç belirtilmemişse tipik bir porsiyon varsay ve "guven" değerini "dusuk" yap.
"olcek" alanına neye dayandığını yaz (örn. "yazdığın miktarlar" ya da "tipik porsiyonlar").

Yazdığı her yiyeceği "kalemler" dizisine ayrı ayrı koy: adı, varsaydığın porsiyonu, proteini ve kalorisi. "protein_g" ve "kalori" bu kalemlerin toplamı olmalı. "ad" alanına öğünün kısa adını yaz. Pişirme yağı ve sosları da hesaba kat.

${NOT_KURALI}

"not" alanına tahmini neye göre yaptığını bir cümleyle açıkla.
Her kalemde "gram" alanını pozitif sayısal gramaj olarak ver. Pişmiş / servis edilmiş, gerçekten yenen miktarı esas al.
`;

function fotoSema(kalanVar){
  const alan={
    ad:{type:"string",description:"Yemeğin kısa adı"},
    porsiyon:{type:"string",description:"Tahmini miktar"},
    olcek:{type:"string",description:"Ölçek olarak kullanılan nesne"},
    protein_g:{type:"number"}, kalori:{type:"number"},
    guven:{type:"string",enum:["yuksek","orta","dusuk"]},
    not:{type:"string"},
    kalemler:{type:"array",description:"Tabaktaki yiyecekler tek tek",
      items:{type:"object",properties:{
        ad:{type:"string"}, porsiyon:{type:"string"},
        gram:{type:"number",description:"Yenen yiyeceğin pişmiş veya servis edilmiş ağırlığı, gram. Pozitif sayı."},
        protein_g:{type:"number"}, kalori:{type:"number"}
      },required:["ad","porsiyon","gram","protein_g","kalori"]}}
  };
  const gerekli=["ad","porsiyon","olcek","protein_g","kalori","guven","not","kalemler"];
  if(kalanVar){ alan.yenen_yuzde={type:"number",description:"Yenen oran, 0-100"}; gerekli.push("yenen_yuzde"); }
  return {type:"object",properties:alan,required:gerekli};
}

/* Sağlayıcıdan bağımsız iç biçim: [{metin},{gorsel}] */
function istekGovdesi(model, parcalar, sema, sistem, maxTokens, anahtar){
  if(state.saglayici==="claude"){
    return {url:"https://api.anthropic.com/v1/messages", ayar:{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":anahtar,
        "anthropic-version":"2023-06-01",
        /* tarayıcıdan doğrudan çağrı için gerekli; bu başlık olmadan
           istek CORS'a takılır ve sunucuya hiç ulaşmaz */
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:model,
        max_tokens:maxTokens||4000,
        system:sistem,
        output_config:{format:{type:"json_schema",schema:sema}},
        messages:[{role:"user",content:parcalar.map(p=>p.gorsel
          ? {type:"image",source:{type:"base64",media_type:"image/jpeg",data:p.gorsel}}
          : {type:"text",text:p.metin})}]
      })
    }};
  }
  /* Gemini: sistem istemi ilk metin parçası olarak gidiyor, ayrı alanı yok */
  return {url:"https://generativelanguage.googleapis.com/v1beta/interactions", ayar:{
    method:"POST",
    headers:{"content-type":"application/json","x-goog-api-key":anahtar},
    body:JSON.stringify({
      model:model,
      input:[{type:"text",text:sistem}].concat(parcalar.map(p=>p.gorsel
        ? {type:"image",data:p.gorsel,mime_type:"image/jpeg"}
        : {type:"text",text:p.metin})),
      response_format:{type:"text",mime_type:"application/json",schema:sema}
    })
  }};
}

async function hataMetni(yanit, sag, model){
  let ek="";
  try{
    const h=await yanit.json();
    /* Gemini hatayı dizi içinde döndürebiliyor */
    const g=Array.isArray(h)?h[0]:h;
    ek=(g&&g.error&&g.error.message)||"";
  }catch(e){}
  if(/credit balance/i.test(ek))
    return `Anahtar geçerli ama ${sag.ad} hesabında kredi yok.`;
  if(/API key not valid|API key expired|API_KEY_INVALID|api key is invalid/i.test(ek))
    return `Anahtar kabul edilmedi — ${sag.konsolAd}'den yeni bir anahtar al.`;
  if(yanit.status===429)
    return "Kota ya da hız sınırına takıldı ("+(model||aktifModel())+")."+(ek?" — "+ek:"");
  if(yanit.status===404||/not found|not supported|does not exist/i.test(ek))
    return "Model bulunamadı ya da bu isteği desteklemiyor ("+(model||aktifModel())
      +")."+(ek?" — "+ek:"");
  const on={401:"Anahtar kabul edilmedi", 403:"Bu anahtarın yetkisi yok",
            400:"İstek reddedildi",
            503:"Sunucu yoğun. Birkaç kez denedim, hepsi meşgul döndü - biraz bekleyip tekrar dene",
            529:"Sunucu yoğun, biraz bekleyip tekrar dene"}[yanit.status]
            || ("API hatası "+yanit.status);
  /* Sağlayıcının kendi açıklaması teşhis için en değerli bilgi, saklama */
  return on+(ek?" — "+ek:"");
}

/* Dinlenirken sırada ne olduğunu hesaplar: aynı hareketin bir sonraki seti,
   ya da hareket bittiyse sıradaki hareket. Sıradaki hareket başka bir
   bölümdeyse (ısınma bitti, antrenman başlıyor gibi) başlık bunu söyler. */
/* "gecis" alani dinlenme ekranindaki ana dugmenin ne yapacagini soyluyor:
   null  -> bu harekette set kaldi, dugme yalnizca sayaci kapatir
   "hareket" -> hareket bitti, dugme sonraki harekete gecirir
   "bitir"   -> son hareketin son seti, dugme bitirme ekranini acar
   Gecisi her zaman kullanici yapiyor; sayac kendiliginden sifirlandiginda
   hareket DEGISMIYOR, yalnizca sayac kapaniyor. */
function sonrakiBilgi(s, exIndex, kayit){
  const kalan=kayit.setler.filter(x=>!x.done).length;
  if(kalan>0){
    const h=s.hareketler[exIndex], yapilan=kayit.setler.length-kalan;
    return {baslik:"Sıradaki set", ex:h.ex,
            alt:`set ${yapilan+1} / ${kayit.setler.length}`, gecis:null};
  }
  const sonraki=s.hareketler[exIndex+1];
  if(!sonraki) return {baslik:"Son hareket bitti", ex:null,
                       alt:"Antrenmanı bitirebilirsin", gecis:"bitir"};
  return {baslik:"Sıradaki hareket",
          ex:sonraki.ex,
          alt:`${sonraki.set} set × ${sonraki.tekrar}${sonraki.tip==="sure"?" sn":""}`,
          gecis:"hareket"};
}

const uyu=ms=>new Promise(r=>setTimeout(r,ms));
/* Ücretsiz katmanda model yoğunken 503 sık geliyor ve geçici; elle tekrar
   denemek yerine kendimiz deniyoruz. 4xx'lerin çoğu kalıcı, onları denemiyoruz. */
const GECICI_DURUM=[408,429,500,502,503,504,529];

async function tekModelIstek(model, parcalar, sema, sistem, maxTokens, anahtar, sag, ilerle){
  const istek=istekGovdesi(model,parcalar,sema,sistem,maxTokens,anahtar);
  const enFazla=3;
  for(let deneme=1;;deneme++){
    let yanit;
    try{ yanit=await fetch(istek.url,istek.ayar); }
    catch(e){
      if(deneme<enFazla){ if(ilerle) ilerle("Bağlanılamadı, yeniden deneniyor ("+(deneme+1)+"/"+enFazla+")"); await uyu(800*deneme); continue; }
      throw new Error("Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.");
    }
    if(yanit.ok){
      const d=await yanit.json();
      if(d.stop_reason==="refusal") throw new Error("Model bu fotoğrafı değerlendirmedi");
      return jsonAyikla(yanitMetni(d));
    }
    /* 429 ve "model yok" durumlarını zincire bildiriyoruz: bu modelde
       ısrar etmek yerine bir alttakine geçmek daha hızlı çözüm. */
    if(yanit.status===429||yanit.status===404){
      const hata=new Error(await hataMetni(yanit,sag,model));
      hata.modelDegistir=true;
      hata.gunlukKota=yanit.status===429;
      throw hata;
    }
    if(GECICI_DURUM.indexOf(yanit.status)>=0 && deneme<enFazla){
      /* sunucu ne kadar bekleneceğini söylüyorsa ona uy */
      const sonra=yanit.headers&&yanit.headers.get?+(yanit.headers.get("retry-after")||0):0;
      if(ilerle) ilerle("Sunucu meşguldü, yeniden deneniyor ("+(deneme+1)+"/"+enFazla+")");
      await uyu(Math.max(sonra*1000, 900*Math.pow(2,deneme-1)));
      continue;
    }
    throw new Error(await hataMetni(yanit,sag,model));
  }
}

async function yzIstek(parcalar, sema, sistem, maxTokens, ilerle){
  const sag=aktifSag(), anahtar=apiAnahtar(sag);
  if(!anahtar) throw new Error(sag.ad+" anahtarı girilmemiş");
  const zincir=modelZinciri();
  let son=null;
  for(let i=0;i<zincir.length;i++){
    try{
      return await tekModelIstek(zincir[i],parcalar,sema,sistem,maxTokens,anahtar,sag,ilerle);
    }catch(e){
      son=e;
      if(!e.modelDegistir || i===zincir.length-1) throw e;
      if(e.gunlukKota) kotayiIsaretle(zincir[i]);
      if(ilerle) ilerle(modelAdi(zincir[i])+" kotası doldu, "+modelAdi(zincir[i+1])+" deneniyor");
      await uyu(300);
    }
  }
  throw son;
}

/* Claude metni content[] içinde; Gemini yanıtı adımlara bölüyor ve metin
   model_output adımının content[]'inde duruyor (düşünme adımları ayrı). */
function yanitMetni(d){
  if(state.saglayici==="claude")
    return (d.content||[]).filter(c=>c&&c.type==="text").map(c=>c.text).join("");
  const adimlar=Array.isArray(d.steps)?d.steps:[];
  const metin=adimlar
    .filter(a=>a&&a.type==="model_output")
    .reduce((t,a)=>t.concat(Array.isArray(a.content)?a.content:[]),[])
    .filter(c=>c&&c.type==="text")
    .map(c=>c.text).join("");
  return metin || d.output_text || "";
}

/* Şema istesek de model JSON'u ``` içine alabiliyor ya da başına bir cümle
   ekleyebiliyor; kabuğu soyup öyle ayrıştırıyoruz. Hiç olmazsa gelen metnin
   başını hataya koyuyoruz, yoksa sorun teşhis edilemiyor. */
function jsonAyikla(metin){
  const t=String(metin||"").trim();
  const cit=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const ham=cit?cit[1].trim():t;
  try{ return JSON.parse(ham); }catch(e){}
  const ilk=ham.indexOf("{"), son=ham.lastIndexOf("}");
  if(ilk>=0&&son>ilk){ try{ return JSON.parse(ham.slice(ilk,son+1)); }catch(e){} }
  const ornek=ham.slice(0,140).replace(/\s+/g," ");
  throw new Error("Yanıt okunamadı"+(ornek?" — gelen: "+ornek:" — yanıt boş geldi"));
}

/* oncekiler: öğünün fotoğrafları (1..4). kalanlar: doluysa karşılaştırma
   kipi - yenen miktar hesaplanır. İkisi de dizi. */
async function fotoAnaliz(oncekiler, kalanlar, ek){
  ek=ek||{};
  const kalanVar=!!(kalanlar&&kalanlar.length);
  const parcalar=[];
  if(kalanVar){
    parcalar.push({metin:`Yemekten ÖNCE çekilen ${oncekiler.length} fotoğraf:`});
    oncekiler.forEach(b=>parcalar.push({gorsel:b}));
    parcalar.push({metin:`Yemekten SONRA, kalanların ${kalanlar.length} fotoğrafı:`});
    kalanlar.forEach(b=>parcalar.push({gorsel:b}));
    parcalar.push({metin:"Yenen miktarın protein ve kalorisini tahmin et."});
  }else{
    parcalar.push({metin:oncekiler.length>1
      ? `Aynı öğünün ${oncekiler.length} fotoğrafı:`
      : "Öğünün fotoğrafı:"});
    oncekiler.forEach(b=>parcalar.push({gorsel:b}));
    parcalar.push({metin:"Bu öğündeki porsiyonun protein ve kalori miktarını tahmin et."});
  }
  if(ek.not) parcalar.push({metin:"Kullanıcının notu: "+ek.not});
  if(ek.onceki) parcalar.push({metin:"Önceki tahminin: "+JSON.stringify(ek.onceki)});
  if(ek.duzeltme) parcalar.push({metin:"Kullanıcının düzeltmesi: "+ek.duzeltme});
  return yzIstek(parcalar, fotoSema(kalanVar), kalanVar?SISTEM_KALAN:SISTEM_TEK, null, ilerlemeYaz);
}

/* Fotoğrafsız yol: kullanıcı ne yediğini yazıyor. Şema ve sonuç ekranı
   fotoğraftakiyle aynı, sadece görsel yerine metin gidiyor. */
async function metinAnaliz(metin, ek){

/* Uzun kenarı 1024 px'e indirip JPEG'e çevirir: yemek fotoğrafı için
   fazlasıyla yeterli, istek boyutunu ve görsel token maliyetini düşürür. */
function fotoKucult(dosya, uzunKenar=1024, kalite=0.8){
  return new Promise((coz,yan)=>{
    const img=new Image(), url=URL.createObjectURL(dosya);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const olcek=Math.min(1, uzunKenar/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*olcek)), h=Math.max(1,Math.round(img.height*olcek));
      const c=document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const veri=c.toDataURL("image/jpeg",kalite);
      coz(veri.slice(veri.indexOf(",")+1));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); yan(new Error("Fotoğraf okunamadı")); };
    img.src=url;
  });
}

/* Kamera ya da galeri seçici; seçilen dosyaları dizi olarak döndürür.
   Kullanıcı hareketi içinde çağrılmalı (input.click() senkron olmalı).
   capture="environment" telefonda doğrudan kamerayı açıyor - galeriye
   ulaşabilmek için o alanın HİÇ olmaması gerekiyor. multiple ile capture
   birlikte çalışmadığından kameradan tek tek çekiliyor, galeriden çoklu
   seçilebiliyor. */
function fotoSec(kamera){
  return new Promise(coz=>{
    const inp=document.createElement("input");
    inp.type="file"; inp.accept="image/*";
    if(kamera) inp.capture="environment"; else inp.multiple=true;
    inp.onchange=()=>coz(inp.files?[...inp.files]:[]);
    /* iptal edilirse change hiç gelmez; sayfa açık kaldığı için sorun değil. */
    inp.click();
  });
}

/* ==========================================================
   ÖĞÜN FOTOĞRAFLARI (IndexedDB)
   "Kalanını çek" karşılaştırması ilk fotoğrafların saklanmasını
   gerektiriyor. localStorage'a sığmazlardı: 1024px bir JPEG ~100-250 KB ve
   localStorage'ın toplam sınırı ~5 MB. IndexedDB kotası çok daha geniş, o
   yüzden fotoğraflar oraya; uygulamanın geri kalanı localStorage'da kalıyor.

   Fotoğraflar öğün silinene kadar saklanır; elle alınan yedeğe dahil edilir.

   IndexedDB yoksa ya da reddedilirse (gizli sekme, kapalı depolama) her şey
   sessizce fotoğrafsız çalışır: analiz yapılır, yalnızca sonradan
   karşılaştırma sunulmaz. Bu yüzden her çağrı try/catch içinde. */
const FOTO_DB="salonDefteriFoto", FOTO_DEPO="ogunFoto", FOTO_EN_FAZLA=4;
function yeniOgunId(){ return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function fotoDBAc(){
  return new Promise((coz,yan)=>{
    if(!window.indexedDB) return yan(new Error("IndexedDB yok"));
    let i;
    try{ i=indexedDB.open(FOTO_DB,1); }catch(e){ return yan(e); }
    i.onupgradeneeded=()=>{
      const db=i.result;
      if(!db.objectStoreNames.contains(FOTO_DEPO)) db.createObjectStore(FOTO_DEPO,{keyPath:"id"});
    };
    i.onsuccess=()=>coz(i.result);
    i.onerror=()=>yan(i.error||new Error("IndexedDB açılamadı"));
  });
}
function fotoIslem(kip, is){
  return fotoDBAc().then(db=>new Promise((coz,yan)=>{
    let istek;
    const t=db.transaction(FOTO_DEPO,kip);
    try{ istek=is(t.objectStore(FOTO_DEPO)); }catch(e){ yan(e); return; }
    /* Sonucu transaction bitince okuyoruz; tek tek isteklere bağlanmak
       gerekmiyor, hepsi aynı işlemde tamamlanıyor. */
    t.oncomplete=()=>coz(istek && typeof istek==="object" && "result" in istek ? istek.result : istek);
    t.onerror=()=>yan(t.error);
    t.onabort=()=>yan(t.error);
  }));
}
/* IndexedDB her zaman yanit vermiyor: baska bir sekme yukseltmeyi
   kilitlemisse ya da depolama baskisi varsa istek askida kalabiliyor.
   Hicbir fotograf islemi arayuzu bloke etmesin diye hepsi sure sinirli -
   sinir asilirsa fotograf kaydedilmemis sayilir, kaydin kendisi yine
   eklenir. Bu olmadan "Gune ekle" sonsuza kadar bekliyordu. */
function fotoSureSinirli(soz, ms){
  return Promise.race([soz, new Promise((_,yan)=>
    setTimeout(()=>yan(new Error("IndexedDB yanıt vermedi")), ms||4000))]);
}
async function fotoKaydet(id, oncekiler, kalanlar){
  if(!id) return false;
  try{
    await fotoSureSinirli(fotoIslem("readwrite", d=>d.put({
      id, gun:gunKey(), zaman:Date.now(),
      oncekiler:oncekiler||[], kalanlar:kalanlar||[]
    })));
    return true;
  }catch(e){ return false; }
}
async function fotoGetir(id){
  if(!id) return null;
  try{ return (await fotoSureSinirli(fotoIslem("readonly", d=>d.get(id)))) || null; }
  catch(e){ return null; }
}
async function fotoSil(id){
  if(!id) return;
  try{ await fotoSureSinirli(fotoIslem("readwrite", d=>d.delete(id))); }catch(e){}
}

/* Sonucu düzenlenebilir gösterir. Kalan fotoğrafı henüz çekilmediyse
   "Kalanını çek" ile ikinci fotoğraf istenip yenen miktar hesaplanır. */
function fotoSonucSheet(sonuc, durum){
  const guvenTR={yuksek:"yüksek",orta:"orta",dusuk:"düşük"}[sonuc.guven]||sonuc.guven||"";
  const kalemler=Array.isArray(sonuc.kalemler)?sonuc.kalemler:[];

  modalAc(`
    <h2>${durum.kalanVar?"Yediğin kadarı":(durum.metinMi?"Yazdığından":"Fotoğraftan")}</h2>
    ${durum.kayitId?`<p class="small" style="margin:0 0 6px">Bu miktar <b>${String(durum.kayitAd||"kaydın").replace(/"/g,"&quot;")}</b> kaydının yerine geçecek.</p>`:""}
    <p class="muted small">${yuzde!=null?"Tabağın ~%"+yuzde+"'i · ":""}${sonuc.porsiyon||""}${guvenTR?" · güven "+guvenTR:""}</p>
    <input class="text" id="fAd" value="${String(sonuc.ad||"").replace(/"/g,"&quot;")}" style="margin-top:10px">
    <div class="editgrid" style="grid-template-columns:1fr 1fr">
      <div><label>Protein (g)</label><input type="number" inputmode="decimal" id="fP" value="${Math.round((+sonuc.protein_g||0)*10)/10}"></div>
      <div><label>Kalori</label><input type="number" inputmode="numeric" id="fK" value="${Math.round(+sonuc.kalori||0)}"></div>
    </div>
    ${kalemler.length>1?`<p class="muted small" style="margin-top:12px">Neler var</p>
      ${kalemler.map(x=>`<div class="kv"><span>${x.ad}<br><span class="muted small">${x.porsiyon||""}</span></span>
        <b>${Math.round((+x.protein_g||0)*10)/10} g · ${Math.round(+x.kalori||0)} kcal</b></div>`).join("")}`:""}
    <p class="muted small" style="margin-top:10px">${durum.metinMi?"Dayanak":"Ölçek"}: ${sonuc.olcek||"—"}</p>
    ${sonuc.not?`<p class="muted small">${sonuc.not}</p>`:""}
    ${durum.notu?`<p class="muted small">${durum.metinMi?"Yazdığın":"Notun"}: ${durum.notu}</p>`:""}
    <button class="btn" id="fEkle">${durum.kayitId?"Kaydı güncelle":"Güne ekle"}</button>
    <button class="btn quiet" id="fDuzelt">Tahmini düzelt</button>
    ${(durum.kalanVar||durum.metinMi)?"":`<button class="btn quiet" id="fKalan">Hepsini yemediysen: kalanını çek</button>`}
    <button class="btn ghost" id="fIptal">Vazgeç</button>`);

  document.getElementById("fEkle").onclick=async()=>{
    const ad=document.getElementById("fAd").value.trim()||"Yemek";
    const pr=+document.getElementById("fP").value||0;
    const kal=+document.getElementById("fK").value||0;
    if(!pr&&!kal){ toast("Protein veya kalori gir"); return; }
    if(!state.meals[durum.gunK]) state.meals[durum.gunK]=[];
    const liste=state.meals[durum.gunK];
    const mevcut=durum.kayitId?liste.find(y=>y.id===durum.kayitId):null;
    const hedef=mevcut||{id:yeniOgunId(),adet:1};
    /* Fotoğraflar kayda değil IndexedDB'ye yazılıyor; "foto" yalnızca kaç
       tane olduğunu tutuyor, böylece arayüz IndexedDB'yi açmadan
       "kalanını çek" sunup sunmayacağını biliyor. Yazma başarısızsa 0
       kalıyor - özellik sessizce kapanır, kayıt yine eklenir. */
    let foto=0;
    const oncekiler=durum.oncekiler||[];

      foto=oncekiler.length;
    Object.assign(hedef, {

       yenen miktar adetle çarpılıp günü şişirirdi. */
    if(mevcut) hedef.adet=1;
    if(!mevcut) liste.push(hedef);
    await saveAll(); modalKapat(); renderFood();
    toast(oncekiler.length&&!foto ? "Öğün eklendi; fotoğraf cihaz hafızasına kaydedilemedi." : ad+(mevcut?" güncellendi":" eklendi"));
  };
  /* Yanlış bir kalem varsa kullanıcı söylüyor, tahmin yeniden hesaplanıyor.
     Fotoğraf da önceki tahmin de birlikte gönderildiği için model neyi
     değiştireceğini biliyor. */
  document.getElementById("fDuzelt").onclick=()=>{
    modalAc(`
      <h2>Neyi düzeltmeli?</h2>
      <p class="muted small">Yanlış bulduğun kalemi ve doğrusunu yaz.</p>
      <input class="text" id="dMetin" placeholder="örn. pilav 170 değil 80 gram" style="margin-top:10px">
      ${kalemler.length?`<p class="muted small" style="margin-top:8px">Tahmindeki kalemler: ${kalemler.map(x=>x.ad).join(", ")}</p>`:""}
      <button class="btn" id="dGonder">Yeniden hesapla</button>
      <button class="btn ghost" id="dVaz">Vazgeç</button>`);
    const gonder=async()=>{
      const metin=document.getElementById("dMetin").value.trim();
      if(!metin){ toast("Ne düzeltmeli?"); return; }
      modalAc(`<h2>Yeniden hesaplanıyor</h2><p class="muted small">Düzeltmen uygulanıyor.</p>`);
      try{
        /* Kaynak ne olursa olsun (fotoğraf, iki fotoğraf, metin) aynı yerden
           yeniden çalıştırılıyor; sayfa kaynağı bilmek zorunda değil. */
        const yeni=await durum.yeniden({onceki:sonuc,duzeltme:metin});
        fotoSonucSheet(yeni,durum);
      }catch(e){ fotoHataSheet(e, ()=>fotoSonucSheet(sonuc,durum)); }
    };
    document.getElementById("dGonder").onclick=gonder;
    document.getElementById("dMetin").onkeydown=ev=>{ if(ev.key==="Enter") gonder(); };
    document.getElementById("dVaz").onclick=()=>fotoSonucSheet(sonuc,durum);
  };
  const kalanBtn=document.getElementById("fKalan");
  if(kalanBtn) kalanBtn.onclick=()=>kalanAkisi(durum.gunK, durum.oncekiler, durum.notu,
    null, null, ()=>fotoSonucSheet(sonuc,durum));
  document.getElementById("fIptal").onclick=modalKapat;
}

/* Kalan fotoğraflarını toplayıp karşılaştırmayı çalıştırır. Hem "güne
   eklemeden önce" hem "ekledikten sonra" aynı yoldan geçiyor; fark
   yalnızca kayitId'nin dolu olup olmaması. */
function kalanAkisi(gunK, oncekiler, notu, kayitId, kayitAd, geriDon){
  fotoSecSheet({
    baslik:"Kalanını çek",
    aciklama:`İlk ${oncekiler.length} fotoğrafla karşılaştırılacak. Tabakta kalanların fotoğrafını ekle.`,
    notEtiketi:"Eklemek istediğin bir şey var mı? Boş bırakabilirsin.",
    notOrnek:"örn. kalanı kardeşim yedi",
    eylem:"Karşılaştır",
    notu:notu||"",
    vazgec:geriDon,
    bitince:(kalanlar,yeniNot)=>{
      const calistir=async()=>{
        modalAc(`<h2>Karşılaştırılıyor</h2>
          <p class="muted small">İlk fotoğraflarla kalanlar birlikte değerlendiriliyor.</p>`);
        try{
          const sonuc=await fotoAnaliz(oncekiler, kalanlar, {not:yeniNot});
          fotoSonucSheet(sonuc,{gunK, kalanVar:true, notu:yeniNot, oncekiler, kalanlar,
            kayitId, kayitAd,
            yeniden:ek=>fotoAnaliz(oncekiler,kalanlar,Object.assign({not:yeniNot},ek))});
        }catch(e){ fotoHataSheet(e, calistir); }
      };
      calistir();
    }
  });
}

/* Model çıktısından kayda yazılacak ayrıntılar. Kalem başına kısa anahtar
   (p/k) kullanılıyor, kaydın geri kalanıyla aynı dil. */
function ogunEkleri(sonuc){
  const ham=Array.isArray(sonuc.kalemler)?sonuc.kalemler:[];
  return {
    kalemler: ham.map(x=>kalemHazirla({
      ad:String(x.ad||""), porsiyon:String(x.porsiyon||""),
      gram:besinSayi(x.gram)||gramOku(x.porsiyon),
      p:besinSayi(x.protein_g), k:besinSayi(x.kalori)
    })),
    olcek:String(sonuc.olcek||""),
    guven:String(sonuc.guven||""),
    aciklama:String(sonuc.not||"")
  };
}

/* ==========================================================
   FOTOĞRAF TOPLAMA SAYFASI
   Hem yeni öğün hem "kalanını çek" bunu kullanıyor. Fotoğraflar seçilir
   seçilmez küçültülüyor: küçük resmi hemen gösterebiliyoruz ve modele
   gidecek veri hazır oluyor.
   ========================================================== */
function fotoSecSheet(ayar){
  const secilen=[];
  let notu=ayar.notu||"", mesgul=false;

  const ciz=()=>{
    modalAc(`
      <h2>${ayar.baslik}</h2>
      <p class="muted small">${ayar.aciklama}</p>
      ${secilen.length?`<div class="fotogrid">${secilen.map((b,i)=>`
        <div class="fotokare"><img src="data:image/jpeg;base64,${b}" alt="">
          <button class="fotosil" data-fsil="${i}" aria-label="Bu fotoğrafı çıkar">✕</button></div>`).join("")}</div>`
        :`<p class="muted small" style="margin:12px 0 0">Henüz fotoğraf eklemedin.</p>`}
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn quiet sm" id="fCek" ${secilen.length>=FOTO_EN_FAZLA?"disabled":""}>Fotoğraf çek</button>
        <button class="btn quiet sm" id="fGaleri" ${secilen.length>=FOTO_EN_FAZLA?"disabled":""}>Galeriden seç</button>
      </div>
      <p class="muted small" style="margin:8px 0 0">${secilen.length} / ${FOTO_EN_FAZLA} fotoğraf${secilen.length>=FOTO_EN_FAZLA?" — sınıra ulaştın":""}</p>
      <p class="muted small" style="margin:14px 0 6px">${ayar.notEtiketi}</p>
      <input class="text" id="fNot" value="${String(notu).replace(/"/g,"&quot;")}" placeholder="${ayar.notOrnek}">
      <button class="btn" id="fBasla" ${secilen.length?"":"disabled"}>${ayar.eylem}</button>
      <button class="btn ghost" id="fVaz">Vazgeç</button>`);

    const sheet=document.getElementById("modalBody");
    const notuOku=()=>{ const n=sheet.querySelector("#fNot"); if(n) notu=n.value; };
    /* fotoSec kullanıcı hareketi içinde çağrılmalı: notuOku senkron, ilk
       await'ten önce input.click() çalışıyor. */
    const ekle=async kamera=>{
      if(mesgul) return;
      notuOku();
      const dosyalar=await fotoSec(kamera);
      if(!dosyalar.length) return;
      mesgul=true;
      let tasan=false;
      for(const dosya of dosyalar){
        if(secilen.length>=FOTO_EN_FAZLA){ tasan=true; break; }
        try{ secilen.push(await fotoKucult(dosya)); }
        catch(e){ toast("Bir fotoğraf okunamadı"); }
      }
      mesgul=false;
      ciz();
      if(tasan) toast(`En fazla ${FOTO_EN_FAZLA} fotoğraf eklenebilir`);
    };
    sheet.querySelector("#fCek").onclick=()=>ekle(true);
    sheet.querySelector("#fGaleri").onclick=()=>ekle(false);
    sheet.querySelectorAll("[data-fsil]").forEach(b=>b.onclick=()=>{
      notuOku(); secilen.splice(+b.dataset.fsil,1); ciz();
    });
    sheet.querySelector("#fBasla").onclick=()=>{
      notuOku();
      if(!secilen.length){ toast("Önce fotoğraf ekle"); return; }
      ayar.bitince(secilen.slice(), notu.trim());
    };
    sheet.querySelector("#fVaz").onclick=ayar.vazgec||modalKapat;
  };
  ciz();
}

/* Fotoğrafsız giriş: ne yediğini yaz, gerisi fotoğraf yoluyla aynı. */
